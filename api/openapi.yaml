              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Runtime backend unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/runs/{id}/resume:
    post:
      tags: [Runs]
      summary: Resume a suspended Run runtime workflow
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resume requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunOperationResponse' }
        '400':
          description: Run has no runtime workflow reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Runtime backend unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/runs/{id}/terminate:
    post:
      tags: [Runs]
      summary: Terminate a Run runtime workflow
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Terminate requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunOperationResponse' }
        '400':
          description: Run has no runtime workflow reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Runtime backend unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pipeline-runs:
    post:
      tags: [Pipeline]
      summary: Create a first-class pipeline run
      description: >
        Creates a pipeline run and submits the rendered workflow to the selected
        execution target. This endpoint also writes the legacy deployment record
        for compatibility.
      security:
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipeline]
              properties:
                pipeline:
                  type: object
                  description: Full pipeline definition
                name: { type: string, description: Optional pipeline name }
                asset_ids:
                  type: array
                  items: { type: string }
                target_id:
                  type: string
                  description: Execution target ID. Defaults to the default target when omitted.
      responses:
        '201':
          description: Pipeline run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }
        '400':
          description: Invalid request, missing asset, or invalid execution target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Workflow backend unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Pipeline]
      summary: List pipeline runs
      description: Returns first-class pipeline runs ordered by creation time.
      security:
        - DatabrewToken: []
      responses:
        '200':
          description: Pipeline run list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PipelineRun' }

  /api/v1/pipeline-runs/watcher/status:
    get:
      tags: [Pipeline]
      summary: Get pipeline run watcher status
      description: Returns the durable DataBrew watcher health snapshot used to synchronize Argo workflow state into pipeline run ledger tables.
      security:
        - DatabrewToken: []
      responses:
        '200':
          description: Pipeline run watcher status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRunWatcherState' }

  /api/v1/pipeline-runs/template/{id}:
    post:
      tags: [Pipeline]
      summary: Create a first-class pipeline run from a template
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Template ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: Optional override pipeline name }
                version:
                  type: integer
                  description: Optional template version lock. Defaults to the active template version when omitted.
                asset_ids:
                  type: array
                  items: { type: string }
                target_id:
                  type: string
                configSelection:
                  $ref: '#/components/schemas/DeployConfigSelection'
      responses:
        '201':
          description: Pipeline run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }
        '400':
          description: Invalid request, missing asset, or invalid execution target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Template not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pipeline-runs/{id}:
    get:
      tags: [Pipeline]
      summary: Get a pipeline run by ID
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pipeline run details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }
        '404':
          description: Pipeline run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Pipeline]
      summary: Delete a pipeline run
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted successfully }
        '404':
          description: Pipeline run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pipeline-runs/{id}/events:
    get:
      tags: [Pipeline]
      summary: List pipeline run events
      description: Returns stored DataBrew timeline events for a pipeline run in chronological order.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Pipeline run ID
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Maximum number of events to return.
        - in: query
          name: cursor
          schema: { type: integer, format: int64, minimum: 0 }
          description: Sequence cursor returned by the previous page.
        - in: query
          name: subjectType
          schema: { type: string, enum: [run, workflow, node, pod] }
          description: Optional subject type filter.
        - in: query
          name: eventType
          schema: { type: string }
          description: Optional event type filter.
        - in: query
          name: status
          schema: { type: string }
          description: Optional event status/phase filter.
        - in: query
          name: q
          schema: { type: string }
          description: Optional text search across message, subject, and event type.
        - in: query
          name: from
          schema: { type: string, format: date-time }
          description: Optional lower bound for occurredAt.
        - in: query
          name: to
          schema: { type: string, format: date-time }
          description: Optional upper bound for occurredAt.
      responses:
        '200':
          description: Pipeline run event page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRunEventList' }
        '400':
          description: Invalid pagination or filter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Pipeline run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pipeline-runs/{id}/asset-nodes:
    get:
      tags: [Pipeline]
      summary: List pipeline run asset-node snapshots
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: assetId
          schema: { type: string }
        - in: query
          name: nodeId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: orderBy
          schema: { type: string, enum: [cost, duration, status] }
      responses:
        '200':
          description: Asset-node snapshot page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRunAssetNodeList' }
        '400':
          description: Invalid pagination or filter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Pipeline run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pipeline-runs/{id}/cost-summary:
    get:
      tags: [Pipeline]
      summary: Get pipeline run estimated cost summary
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estimated cost summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRunCostSummary' }
        '404':
          description: Pipeline run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pipeline-runs/{id}/retry:
    post:
      tags: [Pipeline]
      summary: Retry a pipeline run
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Pipeline run retried
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }
        '404':
          description: Pipeline run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pipeline-runs/{id}/stop:
    post:
      tags: [Pipeline]
      summary: Stop a pipeline run
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Stop requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '404':
          description: Pipeline run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/deployments/{id}:
    get:
      tags: [Pipeline]
      summary: Get a deployment by ID
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Deployment ID
      responses:
        '200':
          description: Deployment details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDeployment' }
        '404':
          description: Deployment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Pipeline]
      summary: Delete a deployment
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted successfully
        '404':
          description: Deployment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/deployments/{id}/retry:
    post:
      tags: [Pipeline]
      summary: Retry a failed or stopped deployment
      description: >
        Retries a pipeline deployment by re-submitting the Argo workflow.
        Only works on deployments with 'failed' or 'stopped' status.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Deployment ID
      responses:
        '201':
          description: Deployment retried
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDeployment' }
        '404':
          description: Deployment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/deployments/{id}/stop:
    post:
      tags: [Pipeline]
      summary: Stop a running deployment
      description: >
        Stops a running pipeline deployment by terminating the underlying
        Argo workflow. Only works on deployments with 'running' status.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Deployment ID
      responses:
        '200':
          description: Workflow stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: workflow stopped
        '404':
          description: Deployment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── Pipeline config registry ───────────────────────────────────────
  /api/v1/pipeline-configs:
    get:
      tags: [Pipeline]
      summary: List standalone pipeline configs
      description: Lists config metadata for the current user by default. Admin/legacy SDK callers may pass owner to inspect a specific owner. Version content is omitted.
      security:
        - DatabrewToken: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive search over name, description, owner, file type, and tags.
        - in: query
          name: owner
          schema: { type: string }
          description: Optional owner filter for admin/legacy SDK callers.
        - in: query
          name: scope
          schema: { type: string }
          description: Optional scope filter; defaults to dev.
        - in: query
          name: lifecycle
          schema:
            type: string
            enum: [draft, ready, deprecated]
      responses:
        '200':
          description: Config list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineConfigListResponse' }
    post:
      tags: [Pipeline]
      summary: Create a standalone pipeline config
      description: Creates metadata plus the first immutable file version. File payload is stored in PostgreSQL and limited to 1 MiB.
      security:
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineConfigCreateRequest' }
      responses:
        '201':
          description: Config created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineConfig' }
        '400':
          description: Invalid request body or content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/pipeline-configs/{id}:
    get:
      tags: [Pipeline]
      summary: Get standalone pipeline config metadata
      description: Returns metadata and version summaries. File content is omitted; fetch a specific version for content.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Config details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineConfig' }
        '404':
          description: Config not found or not owned by caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Pipeline]
      summary: Update standalone pipeline config metadata
      description: Updates metadata only. To edit file content, create a new version.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineConfigUpdateRequest' }
      responses:
        '200':
          description: Config updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineConfig' }
        '400':
          description: Invalid metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Config not found or not owned by caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/pipeline-configs/{id}/versions:
    post:
      tags: [Pipeline]
      summary: Create a new immutable config file version
      description: Appends a new file snapshot and advances currentVersion. Existing versions are not mutated.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineConfigVersionCreateRequest' }
      responses:
        '201':
          description: Version created. Content is omitted from the response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineConfigVersion' }
        '400':
          description: Invalid content or status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Config not found or not owned by caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/pipeline-configs/{id}/versions/{version}:
    get:
      tags: [Pipeline]
      summary: Get one immutable config file version
      description: Returns the file content for a single version.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: version
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Version details including content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineConfigVersion' }
        '400':
          description: Invalid version number
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Config or version not found, or config not owned by caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/pipeline-configs/{id}/deprecate:
    post:
      tags: [Pipeline]
      summary: Deprecate a standalone pipeline config
      description: Marks the config and current version as deprecated. Hard delete is intentionally not exposed because configs can be referenced by saved pipelines and runs.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deprecated config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineConfig' }
        '404':
          description: Config not found or not owned by caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── Pipeline component registry ───────────────────────────────────
  /api/v1/pipeline-components:
    post:
      tags: [Pipeline]
      summary: Register a new pipeline component
      description: Creates a custom pipeline component in the registry.
      security:
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineComponentRequest' }
      responses:
        '201':
          description: Component created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineComponent' }
        '400':
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Pipeline]
      summary: List all registered pipeline components
      security:
        - DatabrewToken: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive name search
        - in: query
          name: source
          schema: { type: string }
          description: Optional source filter such as custom or system
      responses:
        '200':
          description: Component list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PipelineComponent' }
  /api/v1/pipeline-components/{id}:
    get:
      tags: [Pipeline]
      summary: Get a pipeline component by ID
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Component details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineComponent' }
        '404':
          description: Component not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Pipeline]
      summary: Update a pipeline component
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineComponentRequest' }
      responses:
        '200':
          description: Component updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineComponent' }
        '404':
          description: Component not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pipeline-component-releases:
    get:
      tags: [Pipeline]
      summary: List generated component releases
      description: Lists platform-generated component releases. Normal UI should use selectable=true to hide unsafe or incomplete builds.
      security:
        - DatabrewToken: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive search over component, task, display name, release label, source commit/ref/repo, build id, image tag/digest, and runtime image.
        - in: query
          name: componentId
          schema: { type: string }
        - in: query
          name: taskName
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: channel
          schema: { type: string }
        - in: query
          name: selectable
          schema: { type: boolean }
      responses:
        '200':
          description: Component release list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentReleaseListResponse' }
  /api/v1/pipeline-component-releases/{id}:
    get:
      tags: [Pipeline]
      summary: Get a generated component release
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Component release details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineComponentRelease' }
        '404':
          description: Component release not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/pipeline-component-releases/sync:
    post:
      tags: [Pipeline]
      summary: Sync generated component releases
      description: Accepts release records generated by CI/platform tooling and stores the validated selectable state. CI should prefer X-Databrew-CI-Token; administrators may still use normal DataBrew auth.
      security:
        - DatabrewCIIngestToken: []
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentReleaseSyncRequest' }
      responses:
        '200':
          description: Synced component releases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentReleaseListResponse' }
        '400':
          description: Invalid request body or release identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/components:
    get:
      tags: [Pipeline]
      summary: List registered pipeline components (compatibility alias)
      deprecated: true
      security:
        - DatabrewToken: []
      responses:
        '200':
          description: Component list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PipelineComponent' }
    post:
      tags: [Pipeline]
      summary: Register a pipeline component (compatibility alias)
      deprecated: true
      security:
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineComponentRequest' }
      responses:
        '201':
          description: Component created
          content:
            application/json:
