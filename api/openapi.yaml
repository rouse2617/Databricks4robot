  # ── Pipeline ──────────────────────────────────────────────────────
  /api/v1/pipelines/{id}/diff/{id2}:
    get:
      tags: [Pipeline]
      summary: Compare two pipeline template versions
      description: >
        Returns a structural diff (added/removed/modified nodes and edges)
        between two pipeline templates identified by their IDs.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: First pipeline template ID
        - in: path
          name: id2
          required: true
          schema:
            type: string
          description: Second pipeline template ID
      responses:
        '200':
          description: Structural diff
          content:
            application/json:
              schema:
                type: object
                properties:
                  added_nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        component: { type: object }
                        inputs: { type: array, items: { type: object } }
                        outputs: { type: array, items: { type: object } }
                  removed_nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                  modified_nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                  added_edges:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        target: { type: string }
                  removed_edges:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        target: { type: string }
        '404':
          description: Template not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/deployments/{id}/resources:
    get:
      tags: [Pipeline]
      summary: Get pod-level resource metadata for a deployment
      description: >
        Returns Argo workflow resource duration plus manifest-derived requests/limits
        for each pod belonging to a workflow deployment. Live Kubernetes Metrics API
        samples are not returned unless source.metrics and live_metrics_available say so.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Pipeline deployment ID
      responses:
        '200':
          description: Resource usage report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUsageReport'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/workflows/{name}/resources:
    get:
      tags: [Pipeline]
      summary: Get resource metadata for a workflow
      description: >
        Returns resource metadata for pods in an Argo workflow. The response
        distinguishes Argo live status, manifest-derived requests/limits, and
        unavailable live metrics.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
          description: Workflow name
      responses:
        '200':
          description: Workflow resource usage report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUsageReport'
        '404':
          description: Workflow not found or workflow service unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/workflows/{name}/nodes/{nodeId}/resources:
    get:
      tags: [Pipeline]
      summary: Get resource metadata for one workflow node
      description: >
        Returns resource metadata for a single pod node in an Argo workflow.
        Live metrics are marked unavailable unless the backend explicitly wires
        a metrics source.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
          description: Workflow name
        - in: path
          name: nodeId
          required: true
          schema: { type: string }
          description: Workflow pod node ID
      responses:
        '200':
          description: Workflow node resource usage report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUsageReport'
        '404':
          description: Workflow or node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/workflows/{name}/nodes/{nodeId}/pod:
    get:
      tags: [Pipeline]
      summary: Get Kubernetes Pod diagnostics for one workflow node
      description: >
        Resolves the Argo workflow node to its Kubernetes Pod and returns
        backend-mediated Pod metadata, container statuses, conditions, and
        Kubernetes events. The browser never receives Kubernetes credentials.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
          description: Workflow name
        - in: path
          name: nodeId
          required: true
          schema: { type: string }
          description: Workflow Pod node ID
      responses:
        '200':
          description: Pod diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowNodePodDiagnostics' }
        '403':
          description: Kubernetes credentials cannot read Pod diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Workflow, node, or Pod not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Kubernetes diagnostics unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/workflows/{name}/nodes/{nodeId}/terminal-sessions:
    post:
      tags: [Pipeline]
      summary: Create a backend-owned Pod terminal session
      description: >
        Resolves a workflow node to its Kubernetes Pod, validates execution
        target terminal policy, and creates a short-lived backend-owned
        terminal session. The response may include a one-time attach URL but
        never exposes Kubernetes credentials.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
          description: Workflow name
        - in: path
          name: nodeId
          required: true
          schema: { type: string }
          description: Workflow Pod node ID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePodTerminalSessionRequest' }
      responses:
        '201':
          description: Terminal session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PodTerminalSession' }
        '403':
          description: Terminal disabled or command denied by policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Workflow, node, or Pod not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Pod is completed or otherwise unavailable for exec
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pod-terminal/sessions/{id}:
    get:
      tags: [Pipeline]
      summary: Get Pod terminal session metadata
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Terminal session metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PodTerminalSession' }
        '404':
          description: Session not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pod-terminal/sessions/{id}/terminate:
    post:
      tags: [Pipeline]
      summary: Terminate a Pod terminal session
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Terminal session terminated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PodTerminalSession' }
        '404':
          description: Session not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pod-terminal/sessions/{id}/attach:
    get:
      tags: [Pipeline]
      summary: Attach to a Pod terminal WebSocket stream
      description: >
        Upgrades to a WebSocket when a valid one-time attach token is provided.
        Frames are JSON text messages. When the backend has a Kubernetes exec
        client configured, stdout/stderr/exit frames are proxied from the Pod
        exec stream. If exec is not configured, the stream returns a controlled
        `POD_EXEC_UNAVAILABLE` frame without exposing Kubernetes credentials.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        '101':
          description: WebSocket upgrade accepted
        '403':
          description: Attach token invalid, expired, or reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Session not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/deployments/{id}/save-template:
    post:
      tags: [Pipeline]
      summary: Save deployment as a new pipeline template
      description: >
        Creates a new pipeline template from a deployment's pipeline JSON,
        allowing users to reuse a successful run's configuration.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Pipeline deployment ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Optional template name (defaults to pipeline name + "-from-deployment")
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  version: { type: integer }
                  node_count: { type: integer }
                  created_at: { type: string }
        '404':
          description: Deployment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/pipeline-assets:
    post:
      tags: [Pipeline]
      summary: Register a pipeline step output as a new asset
      description: >
        Called by pipeline containers to register processing results as
        new assets for lineage tracing. The deployment_id is injected as
        the PIPELINE_DEPLOYMENT_ID environment variable.
      security:
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deployment_id, storage_uri]
              properties:
                deployment_id:
                  type: string
                  description: Pipeline deployment ID
                node_id:
                  type: string
                  description: Pipeline step node ID
                asset_id:
                  type: string
                  description: Optional caller-chosen asset ID (auto-generated if empty)
                storage_uri:
                  type: string
                  description: URI of the output data (e.g. gs://bucket/path)
                asset_type:
                  type: string
                  description: Asset type (e.g. image, video, pointcloud)
                files:
                  type: object
                  description: File mapping (name -> URI)
                  additionalProperties:
                    type: string
                metadata:
                  type: object
                  description: Arbitrary metadata
      responses:
        '201':
          description: Asset registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Deployment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/pipeline-lineage:
    get:
      tags: [Pipeline]
      summary: Get pipeline lineage for an asset
      description: >
        Returns which pipeline run and step produced the asset, plus its
        input assets. Queries asset_events for pipeline_output records.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Asset ID
      responses:
        '200':
          description: Lineage info
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset_id:
                    type: string
                  deployment_id:
                    type: string
                  pipeline_name:
                    type: string
                  workflow_name:
                    type: string
                  node_id:
                    type: string
                  input_assets:
                    type: array
                    items:
                      type: string
                  produced_at:
                    type: string
                    format: date-time

  /api/v1/workflows/{name}/logs:
    get:
      tags: [Pipeline]
      summary: Get bounded workflow node logs
      description: >
        Returns a bounded log tail for a specific node in a workflow. Defaults
        are tailLines=200 and limitBytes=262144; server-side maximums clamp
        tailLines to 2000 and limitBytes to 2097152.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Workflow name
        - in: query
          name: nodeId
          required: true
          schema:
            type: string
          description: Node ID (matches Argo template name)
        - in: query
          name: container
          schema:
            type: string
            default: main
        - in: query
          name: tailLines
          schema:
            type: integer
            format: int64
            default: 200
            maximum: 2000
            minimum: 0
        - in: query
          name: limitBytes
          schema:
            type: integer
            format: int64
            default: 262144
            maximum: 2097152
            minimum: 0
        - in: query
          name: sinceSeconds
          schema:
            type: integer
            format: int64
            minimum: 0
        - in: query
          name: sinceTime
          schema:
            type: string
            format: date-time
        - in: query
          name: previous
          schema:
            type: boolean
        - in: query
          name: timestamps
          schema:
            type: boolean
        - in: query
          name: cursor
          schema:
            type: string
          description: Reserved for persisted log pagination. Live Argo logs return 400 when cursor is provided.
      responses:
        '200':
          description: Bounded log content and truncation metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowLogResponse'
        '400':
          description: Missing nodeId parameter
        '404':
          description: Workflow or node not found

  /api/v1/workflows/{name}/logs/stream:
    get:
      tags: [Pipeline]
      summary: Stream bounded workflow node logs
      description: >
        Streams workflow node logs as server-sent events. Events are JSON
        payloads with event names log, heartbeat, and end. Query parameters
        match the JSON log endpoint and are bounded server-side.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Workflow name
        - in: query
          name: nodeId
          required: true
          schema:
            type: string
        - in: query
          name: container
          schema:
            type: string
            default: main
        - in: query
          name: tailLines
          schema:
            type: integer
            format: int64
            default: 200
            maximum: 2000
            minimum: 0
        - in: query
          name: limitBytes
          schema:
            type: integer
            format: int64
            default: 262144
            maximum: 2097152
            minimum: 0
        - in: query
          name: sinceSeconds
          schema:
            type: integer
            format: int64
            minimum: 0
        - in: query
          name: sinceTime
          schema:
            type: string
            format: date-time
        - in: query
          name: previous
          schema:
            type: boolean
        - in: query
          name: timestamps
          schema:
            type: boolean
      responses:
        '200':
          description: Server-sent log stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: log
                  data: {"podName":"pod","container":"main","line":"hello"}
        '400':
          description: Missing nodeId parameter
        '404':
          description: Workflow or node not found

  # ── Pipeline templates ────────────────────────────────────────────
  /api/v1/pipelines:
    post:
      tags: [Pipeline]
      summary: Save a new pipeline template
      description: Creates a new reusable pipeline template from a pipeline definition. The pipeline is normalized before saving, and Argo-facing validation rejects duplicate fan-in target inputs or consumed output ports whose producer does not write the matching /tmp/outputs/<port> file.
      security:
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pipeline]
              properties:
                name: { type: string, description: Template name }
                pipeline:
                  $ref: '#/components/schemas/PipelineDefinition'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineTemplate' }
        '400':
          description: Invalid request body or invalid pipeline definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Pipeline]
      summary: List pipeline templates
      description: Returns the latest version of each saved pipeline template.
      security:
        - DatabrewToken: []
      responses:
        '200':
          description: Template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PipelineTemplate' }
  /api/v1/pipelines/{id}:
    get:
      tags: [Pipeline]
      summary: Get a pipeline template by ID
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Template ID
      responses:
        '200':
          description: Template details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineTemplate' }
        '404':
          description: Template not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Pipeline]
      summary: Delete a pipeline template
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted successfully
        '404':
          description: Template not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/pipelines/{id}/versions:
    get:
      tags: [Pipeline]
      summary: List all versions of a pipeline template
      description: Returns all saved snapshots for the same template name as the provided template ID, ordered by version descending.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Template ID
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PipelineTemplate' }

  # ── Deployment ────────────────────────────────────────────────────
  /api/v1/deploy:
    post:
      tags: [Pipeline]
      summary: Deploy a pipeline directly (without saving a template)
      description: >
        Accepts an inline pipeline definition and optionally asset IDs.
        Returns a deployment record linking to the resulting Argo workflow.
      security:
        - DatabrewToken: []
      parameters:
        - in: query
          name: dryRun
          required: false
          schema:
            type: boolean
            default: false
          description: When true, return transpiled manifest without creating a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipeline]
              properties:
                pipeline:
                  type: object
                  description: Full pipeline definition
                name: { type: string, description: Optional pipeline name }
                asset_ids:
                  type: array
                  items: { $ref: '#/components/schemas/AssetID' }
                  uniqueItems: true
                  description: Optional existing, non-deleted asset IDs to bind as environment variables
                target_id:
                  type: string
                  description: Execution target ID. Defaults to the dev target when omitted.
                version:
                  type: integer
                  description: Optional template version to run. Defaults to the template ID's own version.
      responses:
        '200':
          description: Dry-run preview generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDeployment' }
        '201':
          description: Deployment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDeployment' }
        '400':
          description: Invalid request or asset not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missingAsset:
                  summary: Missing asset
                  value:
                    code: INVALID_ARGUMENT
                    message: asset_ids contain unknown assets
                    request_id: rid-123
                    details:
                      field: asset_ids
                      missing_asset_ids: [DEAD1536]

  /api/v1/deploy/template/{id}:
    post:
      tags: [Pipeline]
      summary: Deploy a pipeline by template ID
      description: >
        Deploys a saved template by its ID. Optionally binds asset IDs.
        This is the recommended deployment path.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Template ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: Optional override pipeline name }
                asset_ids:
                  type: array
                  items: { $ref: '#/components/schemas/AssetID' }
                  uniqueItems: true
                  description: Optional existing, non-deleted asset IDs to bind as environment variables
                target_id:
                  type: string
                  description: Execution target ID. Defaults to the dev target when omitted.
                version:
                  type: integer
                  description: Optional template version to run. Defaults to the template ID's own version.
      responses:
        '201':
          description: Deployment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDeployment' }
        '400':
          description: Invalid request or asset not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                duplicateAsset:
                  summary: Duplicate asset ID
                  value:
                    code: INVALID_ARGUMENT
                    message: asset_ids contain duplicate assets
                    request_id: rid-123
                    details:
                      field: asset_ids
                      duplicate_asset_ids: [SDKT0202]
        '404':
          description: Template not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

