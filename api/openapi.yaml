        silver_asset_rows: { type: integer, format: int64 }
        gold_latest_date: { type: string, nullable: true, example: '2026-05-12' }
        gold_row_count: { type: integer, format: int64 }
        asset_total: { type: integer, format: int64, description: Active assets (same as silver row count). }
        today_new_assets: { type: integer, format: int64 }
        yesterday_new_assets: { type: integer, format: int64 }
        week_new_assets: { type: integer, format: int64 }
        day7_avg_new_assets:
          type: number
          format: double
