        elasticsearch_docs: { type: integer, format: int64 }
        missing_in_elasticsearch: { type: integer, format: int64 }
        orphan_in_elasticsearch: { type: integer, format: int64 }
        consistency: { type: number, format: double }
        target: { type: number, format: double }
        sample_missing_ids:
          type: array
          items: { type: string }
        sample_orphan_ids:
          type: array
          items: { type: string }
        duration_ms: { type: integer, format: int64 }
    BatchDeleteRequest:
      type: object
      properties:
        asset_ids:
          type: array
          items: { $ref: '#/components/schemas/AssetID' }
        import_batch: { type: string }
        include_mcap_files: { type: boolean }
        dry_run: { type: boolean }
        chunk_size: { type: integer }
    BatchDeleteResponse:
      type: object
      properties:
        deleted_count: { type: integer }
        dry_run: { type: boolean }
    InternalCommitSegmentsRequest:
      type: object
      properties:
        mcap_file_id: { $ref: '#/components/schemas/McapFileID' }
        segments:
          type: array
          items:
            type: object
            properties:
              start_ns: { type: integer, format: int64 }
              end_ns: { type: integer, format: int64 }
              asset_type: { type: string }
              metadata:
                type: object
                additionalProperties: true

    # ── Auth ───────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LoginResponse:
      type: object
      properties:
        authenticated: { type: boolean }

    # ── Layered child-asset creation (CYB-1222) ─────────────────────────────
    ChildAssetCreateRequest:
      type: object
      required: [start_timestamp_ns, end_timestamp_ns]
      properties:
        start_timestamp_ns:
          type: integer
          format: int64
          minimum: 1
          description: Start timestamp in nanoseconds
        end_timestamp_ns:
          type: integer
          format: int64
          minimum: 1
          description: End timestamp in nanoseconds
        split_method:
          type: string
          description: "Split method. When unset or manual/rule:* → edge is split_from; algo:* → edge is derived_from"
        split_run_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata for the new child asset

paths:
  # ── Infrastructure ────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [Infrastructure]
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
  /readyz:
    get:
      tags: [Infrastructure]
      summary: Readiness check (PG ping)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      healthy: { type: boolean }
                  checks:
                    type: object
                    properties:
                      pg:
                        type: object
                        properties:
                          status: { type: string }
                          error: { type: string }
                      lakehouse:
                        type: object
                        properties:
                          status: { type: string }
                          backend: { type: string }
                          project: { type: string }
                          dataset: { type: string }
        '503':
          description: Not ready
  /version:
    get:
      tags: [Infrastructure]
      summary: Version info
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  commit: { type: string }
                  time: { type: string }
                  service: { type: string }
  /metrics:
    get:
      tags: [Infrastructure]
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus metrics

  # ── Auth ───────────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with Grace Token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: Missing token
        '401':
          description: Invalid token
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Check current auth session
      responses:
        '200':
          description: Auth status
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (clear session cookie)
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }

  # ── Assets ─────────────────────────────────────────────────────────────
  /api/v1/assets:
    post:
      tags: [Assets]
      summary: Create asset
      responses:
        '201': { description: Created }
        '422':
          description: Invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}:
    get:
      tags: [Assets]
      summary: Get asset by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Assets]
      summary: Update asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Concurrent conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Assets]
      summary: Soft-delete asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets:batch_get:
    post:
      tags: [Assets]
      summary: Batch get assets by IDs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }
  /api/v1/assets/{id}/mcap-locator:
    get:
      tags: [Assets]
      summary: Get MCAP locator for asset preview/streaming
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetMcapLocator' }
  /api/v1/assets/{id}/foxglove-source:
    get:
      tags: [Assets]
      summary: Get Foxglove streaming source
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoxgloveSourceResponse' }
  /api/v1/assets/{id}/deliveries:
    get:
      tags: [Assets]
      summary: List deliveries for an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryListResponse' }
  /api/v1/assets/{id}/events:
    get:
      tags: [Assets]
      summary: List asset events
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: query
          name: before_seq
          schema: { type: integer, format: int64 }
        - in: query
          name: after_seq
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetEventListResponse' }
  /api/v1/assets/{id}/events/stream:
    get:
      tags: [Assets]
      summary: Stream asset events (SSE)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  event_id: { type: string }
                  event_seq: { type: integer, format: int64 }
                  event_type: { type: string }
                  asset_id: { $ref: '#/components/schemas/AssetID' }
                  event_payload:
                    type: object
                    additionalProperties: true
                  occurred_at: { type: string, format: date-time }
  /api/v1/assets/{id}/lineage:
    get:
      tags: [Assets]
      summary: Get asset lineage (upstream/downstream)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineageResponse' }
  /api/v1/assets/{id}/provenance:
    get:
      tags: [Assets]
      summary: Get asset provenance chain
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetProvenanceResponse' }
  /api/v1/assets/{id}/timeline:
    get:
      tags: [Assets]
      summary: Get asset timeline (event/time-based activity)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
  /api/v1/assets/{id}/view:
    post:
      tags: [Assets]
      summary: Record asset view (usage stats)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: Recorded
  /api/v1/assets/{id}/favorite:
    post:
      tags: [Assets]
      summary: Toggle asset favorite status
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: Toggled
  /api/v1/assets/{id}/revisions:
    post:
      tags: [Assets]
      summary: Promote asset revision
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: Revision promoted

  # ── Layered child-asset creation (CYB-1222) ──────────────────────────────
  /api/v1/assets/{id}/clips:
    post:
      tags: [Assets]
      summary: Create clip asset under a segment parent
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildAssetCreateRequest' }
      responses:
        '201':
          description: Clip asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '422':
          description: Hierarchy violation or invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/frames:
    post:
      tags: [Assets]
      summary: Create frame asset under a segment parent
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildAssetCreateRequest' }
      responses:
        '201':
          description: Frame asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '422':
          description: Hierarchy violation or invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/tasks:
    post:
      tags: [Assets]
      summary: Create task asset under a segment or task parent
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildAssetCreateRequest' }
      responses:
        '201':
          description: Task asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '422':
          description: Hierarchy violation or invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/logical-assets/{id}/current:
    get:
      tags: [Assets]
      summary: Get current revision for logical asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentAssetResponse' }
  /api/v1/logical-assets/{id}/ratings-history:
    get:
      tags: [Assets]
      summary: Get ratings history for a logical asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingsHistoryResponse' }
  /api/v1/events:
    get:
      tags: [Assets]
      summary: List global asset events
      parameters:
        - in: query
          name: before_seq
          schema: { type: integer, format: int64 }
        - in: query
          name: after_seq
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: event_types
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetEventListResponse' }

  # ── AssetTags ──────────────────────────────────────────────────────────
  /api/v1/assets/{id}/tags:
    post:
      tags: [AssetTags]
      summary: Upsert a tag on an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagUpsertRequest' }
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTag' }
  /api/v1/assets/{id}/tags/{key}:
    delete:
      tags: [AssetTags]
      summary: Delete a tag by key
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
  /api/v1/assets/{id}/tags/history:
    get:
      tags: [AssetTags]
      summary: List tag history for an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagHistoryResponse' }

  # ── Actions ────────────────────────────────────────────────────────────
  /api/v1/assets/{id}/actions:
    post:
      tags: [Actions]
      summary: Create action on asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
    get:
      tags: [Actions]
      summary: List actions on asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionListResponse' }
  /api/v1/assets/{id}/actions/{action_id}:
    patch:
      tags: [Actions]
      summary: Patch action
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: action_id
          required: true
          schema: { $ref: '#/components/schemas/ActionID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionPatchRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
    delete:
      tags: [Actions]
      summary: Soft-delete action
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: action_id
          required: true
          schema: { $ref: '#/components/schemas/ActionID' }
      responses:
        '204':
          description: Deleted

  # ── LegacyAlgo (deprecated) ───────────────────────────────────────────
  /api/v1/assets/{id}/algo:
    get:
      tags: [LegacyAlgo]
      summary: List current algo statuses for asset (deprecated)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/AlgoLifecycleResponse'
  /api/v1/assets/{id}/algo/{algo_key}/start:
    post:
      tags: [LegacyAlgo]
      summary: Start a legacy algo on asset (deprecated, use AlgoRuns)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAlgoRequest' }
      responses:
        '200':
          description: Started
  /api/v1/assets/{id}/algo/{algo_key}/finish:
    post:
      tags: [LegacyAlgo]
      summary: Finish a legacy algo on asset (deprecated, use AlgoRuns)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishAlgoRequest' }
      responses:
        '200':
          description: Finished
  /api/v1/assets/{id}/algo/{algo_key}/reset:
    post:
      tags: [LegacyAlgo]
      summary: Reset a legacy algo status (deprecated, use AlgoRuns)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reset

  # ── Queries ────────────────────────────────────────────────────────────
  /api/v1/queries/validate:
    post:
      tags: [Queries]
      summary: Validate Query IR request
      parameters:
        - name: include_history
          in: query
          required: false
          schema:
            type: boolean
          description: Include non-current revisions when validating.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
      responses:
        '200':
          description: Query is valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryValidateResponse' }
        '400':
          description: Syntax/shape error (INVALID_ARGUMENT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Semantic/planning error (UNSUPPORTED_FIELD/OPERATOR/UNPLANNABLE_QUERY)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/queries/run:
    post:
      tags: [Queries]
      summary: Execute a Query IR request
      parameters:
        - name: include_history
          in: query
          required: false
          schema:
            type: boolean
          description: Include non-current asset revisions in results.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryRunResponse' }
        '400':
          description: Syntax/shape error (INVALID_ARGUMENT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Semantic/planning error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── SavedQueries ───────────────────────────────────────────────────────
  /api/v1/saved-queries:
    get:
      tags: [SavedQueries]
      summary: List saved queries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavedQuery' }
    post:
      tags: [SavedQueries]
      summary: Create saved query
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertSavedQueryRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedQuery' }
  /api/v1/saved-queries/{id}:
    get:
      tags: [SavedQueries]
      summary: Get saved query
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedQuery' }
    patch:
      tags: [SavedQueries]
      summary: Update saved query
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertSavedQueryRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedQuery' }
    delete:
      tags: [SavedQueries]
      summary: Delete saved query
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
