        downstream: {}
    ProvenanceEntry:
      type: object
      properties:
        source_asset_id: { $ref: '#/components/schemas/AssetID', nullable: true }
        relation_type: { type: string }
        method: { type: string }
        algo_name: { type: string, nullable: true }
        run_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AssetProvenanceResponse:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        root_asset_id: { $ref: '#/components/schemas/AssetID', nullable: true }
        provenance:
          type: array
          items: { $ref: '#/components/schemas/ProvenanceEntry' }

    # ── Admin ──────────────────────────────────────────────────────────────
    SearchReindexRequest:
      type: object
      properties:
        dry_run: { type: boolean }
        page_size: { type: integer }
    SearchReindexResponse:
      type: object
      properties:
        dry_run: { type: boolean }
        total_assets: { type: integer, format: int64 }
        indexed: { type: integer, format: int64 }
        deleted: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        errors:
          type: array
          items: { type: string }
        elasticsearch_doc_count: { type: integer, format: int64 }
        assets_scanned: { type: integer, format: int64 }
        documents_indexed: { type: integer, format: int64 }
        documents_deleted: { type: integer, format: int64 }
    SearchReindexJobView:
      type: object
      properties:
        id: { type: string, format: int64 }
        job_type: { type: string }
        status: { type: string }
        progress_n: { type: integer, format: int64 }
        progress_of: { type: integer, format: int64 }
        error_detail: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    SearchReindexJobsListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchReindexJobView' }
    SearchOutboxStatsResponse:
      type: object
      properties:
        publish_state_counts:
          type: object
          additionalProperties: { type: integer, format: int64 }
        outbox_dlq_rows: { type: integer, format: int64 }
    SearchAuditResponse:
      type: object
      properties:
        pg_assets: { type: integer, format: int64 }
        elasticsearch_docs: { type: integer, format: int64 }
        missing_in_elasticsearch: { type: integer, format: int64 }
        orphan_in_elasticsearch: { type: integer, format: int64 }
        consistency: { type: number, format: double }
        target: { type: number, format: double }
        sample_missing_ids:
          type: array
          items: { type: string }
        sample_orphan_ids:
          type: array
          items: { type: string }
        duration_ms: { type: integer, format: int64 }
    BatchDeleteRequest:
      type: object
      properties:
        asset_ids:
          type: array
          items: { $ref: '#/components/schemas/AssetID' }
        import_batch: { type: string }
        include_mcap_files: { type: boolean }
        dry_run: { type: boolean }
        chunk_size: { type: integer }
    BatchDeleteResponse:
      type: object
      properties:
        deleted_count: { type: integer }
        dry_run: { type: boolean }
    InternalCommitSegmentsRequest:
      type: object
      properties:
        mcap_file_id: { $ref: '#/components/schemas/McapFileID' }
        segments:
          type: array
          items:
            type: object
            properties:
              start_ns: { type: integer, format: int64 }
              end_ns: { type: integer, format: int64 }
              asset_type: { type: string }
              metadata:
                type: object
                additionalProperties: true

    # ── Auth ───────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, example: "g-databrew-admin-token-xxx" }
    EmailLoginRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: "user@example.com" }
    LoginResponse:
      type: object
      properties:
        authenticated: { type: boolean, example: true }
        email: { type: string, format: email, example: "user@example.com" }
        role: { type: string, example: "admin" }

    # ── Layered child-asset creation (CYB-1222) ─────────────────────────────
    ChildAssetCreateRequest:
      type: object
      required: [start_timestamp_ns, end_timestamp_ns]
      properties:
        start_timestamp_ns:
          type: integer
          format: int64
          minimum: 1
          description: Start timestamp in nanoseconds
          example: 1700000000000000000
        end_timestamp_ns:
          type: integer
          format: int64
          minimum: 1
          description: End timestamp in nanoseconds
          example: 1700000100000000000
        split_method:
          type: string
          description: "Split method. When unset or manual/rule:* → edge is split_from; algo:* → edge is derived_from"
          example: "manual"
        split_run_id:
          type: string
          example: "run-abc123"
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata for the new child asset
          example: { source: "manual-annotation" }

    # ── Asset request bodies ────────────────────────────────────────────────
    CreateAssetRequest:
      type: object
      required: [start_timestamp_ns, end_timestamp_ns, reviewer]
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID', description: "Optional — server generates if omitted" }
        logical_asset_id: { type: string, description: "Logical asset group ID", example: "aaaaaaaa" }
        mcap_file_id: { $ref: '#/components/schemas/McapFileID', description: "Source MCAP file" }
        start_timestamp_ns: { type: integer, format: int64, minimum: 1, description: "Start timestamp in nanoseconds", example: 1700000000000000000 }
        end_timestamp_ns: { type: integer, format: int64, minimum: 1, description: "End timestamp in nanoseconds", example: 1700000360000000000 }
        reviewer: { type: string, description: "Reviewer name for the asset", example: "zhangsan" }
        owner: { type: string, description: "Owner name", example: "lisi" }
        type: { type: string, description: "Segment type (legacy)", example: "segment" }
        asset_type: { type: string, description: "Asset type (e.g. segment, clip, frame_set, derived_asset)", example: "segment" }
        status: { type: string, description: "Legacy lifecycle status", example: "ready" }
        lifecycle_state: { type: string, description: "Lifecycle state", example: "ready" }
        env: { type: string, example: "production" }
        task: { type: string, example: "data-ingestion-pipeline-v3" }
        tags: { type: object, additionalProperties: { type: string }, description: "Key→value tags", example: { project: "alpha", batch: "2024-03" } }
        files: { type: object, additionalProperties: { type: string }, description: "Key→value file URIs", example: { image: "gs://bucket/preview.png", raw: "gs://bucket/data.bin" } }
        metadata: { type: object, additionalProperties: true, example: { source: "lidar-sensor-01", resolution: "1920x1080" } }
        lifecycle_meta: { type: object, additionalProperties: true, example: { reason: "quality-review-passed" } }
        retention_tier: { type: string, example: "standard" }
        expire_at: { type: string, format: date-time, nullable: true, example: "2025-06-01T00:00:00Z" }
        storage_uri: { type: string, example: "gs://databrew-assets/segments/a1b2c3d4.mcap" }
        thumb_uri: { type: string, example: "gs://databrew-thumbnails/a1b2c3d4.jpg" }
        asset_level: { type: integer, example: 1 }
        parent_asset_id: { $ref: '#/components/schemas/AssetID', nullable: true }
        root_asset_id: { $ref: '#/components/schemas/AssetID', nullable: true }
        segment_index: { type: integer, nullable: true, example: 3 }
        parent_start_offset_ms: { type: integer, format: int64, nullable: true, example: 120000 }
        parent_end_offset_ms: { type: integer, format: int64, nullable: true, example: 240000 }
        split_method: { type: string, example: "manual" }
        split_algo_name: { type: string, example: "scene-detector" }
        split_algo_version: { type: string, example: "2.1.0" }
        split_run_id: { type: string, example: "run-abc123" }
        split_reason: { type: string, example: "scene-change-at-12s" }
        delivery_count: { type: integer, example: 2 }
        last_delivered_at: { type: string, format: date-time, nullable: true, example: "2025-05-01T10:30:00Z" }
        last_delivered_to: { type: string, nullable: true, example: "customer-alpha" }
    BatchGetAssetsRequest:
      type: object
      required: [asset_ids]
      properties:
        asset_ids:
          type: array
          items: { $ref: '#/components/schemas/AssetID' }
          maxItems: 100
          description: "List of asset IDs to fetch (max 100)"
          example: ["a1b2c3d4", "e5f6g7h8"]
    PromoteRevisionRequest:
      type: object
      properties:
        logical_asset_id: { type: string, description: "Logical asset group to promote into", example: "aaaaaaaa" }
        revision_of: { type: string, description: "Source revision identifier", example: "a1b2c3d4" }
        owner: { type: string, description: "Owner of the new revision", example: "lisi" }

    # ── Pipeline ─────────────────────────────────────────────────────────
    PipelineArgument:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        from: { type: string }
    PipelinePort:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        desc: { type: string }
        default_value: { type: string }
    PipelineNodeComponentResources:
      type: object
      properties:
        cpu: { type: string, example: 500m }
        memory: { type: string, example: 512Mi }
        disk: { type: string, example: 1Gi }
        gpu: { type: string, example: "1" }
        computeTier: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
    PipelineNodeComponent:
      type: object
      required: [name, image]
      properties:
        name: { type: string }
        image: { type: string }
        type: { type: string, enum: [container, script, resource, suspend] }
        source: { type: string }
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { $ref: '#/components/schemas/PipelineArgument' }
        resources:
          $ref: '#/components/schemas/PipelineNodeComponentResources'
        componentId: { type: string }
        releaseId: { type: string }
        componentVersionLabel: { type: string }
    PipelineNodeRuntimeConfig:
      type: object
      description: Node-local saved config-library binding. During deploy this config is mounted only into the node that declares it.
      required: [mode, configId, version, mountPath, targetFilename]
      properties:
        mode:
          type: string
          enum: [saved]
        configId: { type: string }
        version: { type: integer, minimum: 1 }
        fileName: { type: string }
        mountPath: { type: string, example: /workspace/configs }
        targetFilename: { type: string, example: detector.yaml }
        displayName: { type: string }
    PipelineNodeRuntimeSecretMount:
      type: object
      description: Node-local binding to a platform-defined SecretProviderClass catalog entry.
      required: [resourceId]
      properties:
        resourceId: { type: string, description: Runtime secret catalog ID }
        mountPath:
          type: string
          description: Absolute path mounted inside the node container. Defaults to the catalog path.
          example: /mnt/secrets
        displayName: { type: string }
    PipelineNodeRuntimeStorageMount:
      type: object
      description: Node-local binding to a platform-defined storage catalog entry such as PVC or emptyDir.
      required: [resourceId]
      properties:
        resourceId: { type: string, description: Runtime storage catalog ID }
        mountPath:
          type: string
          description: Absolute path mounted inside the node container. Defaults to the catalog path.
          example: /workspace/models
        readOnly:
          type: boolean
          description: Overrides catalog read mode when the resource supports write access.
        displayName: { type: string }
    RuntimeSecretMountResource:
      type: object
      required: [id, name, kind, secretProviderClass, defaultMountPath, readOnly]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [secretProviderClass]
        secretProviderClass: { type: string, description: Kubernetes SecretProviderClass name }
        defaultMountPath: { type: string, example: /mnt/secrets }
        readOnly: { type: boolean, example: true }
        targetIds:
          type: array
          items: { type: string }
    RuntimeStorageMountResource:
      type: object
      required: [id, name, kind, defaultMountPath, readOnly, allowWrite]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [pvc, emptyDir]
        pvcName: { type: string, description: Kubernetes PVC name when kind=pvc }
        defaultMountPath: { type: string, example: /workspace/scratch }
        readOnly: { type: boolean }
        allowWrite: { type: boolean }
        targetIds:
          type: array
          items: { type: string }
    RuntimeMountCatalog:
      type: object
      required: [secrets, storage]
      properties:
        secrets:
          type: array
          items: { $ref: '#/components/schemas/RuntimeSecretMountResource' }
        storage:
          type: array
          items: { $ref: '#/components/schemas/RuntimeStorageMountResource' }
    PipelineNodeDefinition:
      type: object
      required: [id, component]
      properties:
        id: { type: string }
        component:
          $ref: '#/components/schemas/PipelineNodeComponent'
        inputs:
          type: array
          items: { $ref: '#/components/schemas/PipelinePort' }
        outputs:
          type: array
          items: { $ref: '#/components/schemas/PipelinePort' }
        runtimeConfig:
          $ref: '#/components/schemas/PipelineNodeRuntimeConfig'
        runtimeSecrets:
          type: array
          items: { $ref: '#/components/schemas/PipelineNodeRuntimeSecretMount' }
        storageMounts:
          type: array
          items: { $ref: '#/components/schemas/PipelineNodeRuntimeStorageMount' }
    PipelineEdgeDefinition:
      type: object
      required: [source, target]
      properties:
        source: { type: string, example: step-a.output }
        target: { type: string, example: step-b.input }
    PipelineDefinition:
      type: object
      required: [name, nodes, edges]
      properties:
        name: { type: string }
        version: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/PipelineNodeDefinition' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/PipelineEdgeDefinition' }
        assetSelection:
          type: object
          properties:
            assetIds:
              type: array
              items: { type: string }
            assetQuery: { type: string }
    PipelineTemplate:
      type: object
      properties:
        id: { type: string, description: Template ID }
        name: { type: string, description: Template name }
        version: { type: integer, description: Template version number }
        versionCount: { type: integer, description: Number of saved versions for the same template name }
        pipeline:
          $ref: '#/components/schemas/PipelineDefinition'
        nodeCount: { type: integer, description: Number of nodes in the pipeline }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PipelineDeployment:
      type: object
      properties:
        id: { type: string, description: Deployment ID }
        templateId: { type: string, nullable: true, description: Optional linked template ID }
        templateVersion: { type: integer, nullable: true, description: Version of the linked template snapshot }
        pipelineName: { type: string, description: Pipeline name from the deployed pipeline }
        workflowName: { type: string, description: Resulting Argo workflow name }
        status: { type: string, description: Deployment/workflow status (Succeeded, Running, Failed, Error, Expired, etc.). Expired means the deployment record remains but the Argo Workflow CR is no longer available, usually due to TTL cleanup. }
        nodeCount: { type: integer }
        assetIds:
          type: array
          items: { type: string }
          description: Asset IDs selected for this run, when any
        assetCount: { type: integer, description: Number of selected assets }
        executionTarget:
          $ref: '#/components/schemas/ExecutionTarget'
        manifest: { type: string, nullable: true }
        pipelineJSON:
          type: object
          nullable: true
          description: Snapshot of the pipeline definition at deployment time
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    ExecutionTarget:
      type: object
      properties:
        id: { type: string, description: Stable execution target ID }
        name: { type: string, description: Human-readable target name }
        cluster: { type: string, description: Cluster label or identifier }
        namespace: { type: string, description: Kubernetes namespace for Argo workflows }
        serviceAccount: { type: string, description: Kubernetes service account for workflow pods }
        argoServerUrl:
          type: string
          description: Argo Server URL when persisted. May be omitted/redacted by API responses.
        argoAuthSecretRef: { type: string, description: Secret reference for Argo auth, never raw credentials }
        argoInsecureSkipTls: { type: boolean }
        argoCaCertRef: { type: string }
        argoServerConfigured: { type: boolean, description: Whether backend Argo client is configured }
        status:
          type: string
          enum: [available, unavailable]
        enabled: { type: boolean }
        isDefault: { type: boolean }
        description: { type: string }
        resourceDefaults:
          type: object
          additionalProperties: true
        quotaPolicy:
          type: object
          additionalProperties: true
        labels:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PipelineRunNode:
      type: object
      properties:
        id: { type: string }
        runId: { type: string }
        pipelineNodeId: { type: string }
        argoNodeId: { type: string }
        argoNodeName: { type: string }
        displayName: { type: string }
        templateName: { type: string }
        type: { type: string }
        phase: { type: string }
        message: { type: string }
        podName: { type: string }
        hostNodeName: { type: string }
        children:
          type: array
          items: { type: string }
        inputs:
          type: object
          additionalProperties: true
        outputs:
          type: object
          additionalProperties: true
        resourcesDuration:
          type: object
          additionalProperties: true
        resourceSummary:
          type: object
          additionalProperties: true
        logRef: { type: string, description: Relative logs endpoint for this pod when available }
        estimatedCostUsd:
          type: number
          format: double
          nullable: true
          description: Best-effort estimated node cost in USD.
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PipelineRun:
      type: object
      properties:
        id: { type: string, description: Pipeline run ID }
        templateId: { type: string, nullable: true }
        pipelineName: { type: string }
        templateVersion: { type: integer, nullable: true }
        workflowName: { type: string }
        executionTargetId: { type: string }
        targetSnapshot:
          type: object
          additionalProperties: true
        status: { type: string }
        nodeCount: { type: integer }
        assetIds:
          type: array
          items: { type: string }
        assetCount: { type: integer }
        noAssetRun: { type: boolean }
        manifest: { type: string, nullable: true }
        pipelineJSON:
          type: object
          nullable: true
        argoNamespace: { type: string }
        argoWorkflowUid: { type: string }
        message: { type: string }
        executionTarget:
          $ref: '#/components/schemas/ExecutionTarget'
        nodes:
          type: array
          items: { $ref: '#/components/schemas/PipelineRunNode' }
        totalEstimatedCost:
          type: number
          format: double
          nullable: true
          description: Sum of node estimated costs in USD when pricing data is available.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    DeployConfigSelection:
      type: object
      description: Compatibility deploy-level runtime config source. Node-level PipelineNodeRuntimeConfig is the primary product model; deploy-level configSelection is preserved for advanced callers and is applied only as a global fallback when node bindings are present.
      required: [mode, mountPath, targetFilename]
      properties:
        mode:
          type: string
          enum: [saved, upload, inline]
          description: saved = select a platform-stored config; upload = ad hoc local file; inline = deploy-time editor content.
        configId:
          type: string
          description: Required when mode=saved.
        version:
          type: integer
          description: Optional saved config version. Defaults to the latest active version when omitted.
        fileName:
          type: string
          description: Source file name used in the deploy UI and ConfigMap projection.
        content:
          type: string
          description: Required when mode=upload or mode=inline. Raw file content projected into a request-scoped ConfigMap.
        mountPath:
          type: string
          description: Directory mounted into each pipeline step container.
          example: /workspace/configs
        targetFilename:
          type: string
          description: Final file name inside mountPath.
          example: app-config.yaml
    PipelineRunEvent:
      type: object
      properties:
        id: { type: string, description: Event ID }
        runId: { type: string, description: Pipeline run ID }
        workflowName: { type: string, description: Argo workflow name when known }
        eventType:
          type: string
          description: Machine-readable event type such as run_submitted or node_failed.
        subjectType:
          type: string
          enum: [run, workflow, node, pod]
        subjectId: { type: string }
        status: { type: string }
        message: { type: string }
        reason: { type: string }
        payload:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
          description: Deterministic key used by the backend to deduplicate watcher observations.
        sequence:
          type: integer
          format: int64
          description: Monotonic run event sequence used for chronological pagination.
        occurredAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PipelineRunEventList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PipelineRunEvent' }
        nextCursor:
          type: integer
          format: int64
          nullable: true
        total:
          type: integer
          description: Number of events returned in this page.
    PipelineRunWatcherState:
      type: object
      properties:
        id: { type: string }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        lastScanStartedAt: { type: string, format: date-time, nullable: true }
        lastScanFinishedAt: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastErrorAt: { type: string, format: date-time, nullable: true }
        activeScanLimit: { type: integer }
        lastSyncedRunCount: { type: integer }
        consecutiveFailures: { type: integer }
        totalScans: { type: integer, format: int64 }
        totalErrors: { type: integer, format: int64 }
        scanLagSeconds: { type: integer, format: int64, nullable: true }
        lastError: { type: string }
        healthy: { type: boolean }
        stale: { type: boolean }
        updatedAt: { type: string, format: date-time }
    PipelineRunAssetNode:
      type: object
      properties:
        id: { type: string }
        runId: { type: string }
        assetId: { type: string }
        pipelineNodeId: { type: string }
        argoNodeId: { type: string }
        displayName: { type: string }
        status: { type: string }
        message: { type: string }
        podName: { type: string }
        logRef: { type: string }
        estimatedCostUsd:
          type: number
          format: double
          nullable: true
        costSource:
          type: string
          enum: [estimated_resource_duration, not_available]
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    PipelineRunAssetNodeList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PipelineRunAssetNode' }
        nextCursor:
          type: string
          nullable: true
        total: { type: integer }
        summary:
          type: object
          properties:
            assetCount: { type: integer }
            nodeCount: { type: integer }
            statuses:
              type: object
              additionalProperties: { type: integer }
            totalEstimatedCostUsd:
              type: number
              format: double
              nullable: true
            costSource:
              type: string
              enum: [estimated_resource_duration, not_available]
    PipelineRunCostSummary:
      type: object
      properties:
        runId: { type: string }
        totalEstimatedCostUsd:
          type: number
          format: double
          nullable: true
        costSource:
          type: string
          enum: [estimated_resource_duration, not_available]
        nodeSummaries:
          type: array
          items:
            type: object
            properties:
              nodeId: { type: string }
              displayName: { type: string }
              status: { type: string }
              podCount: { type: integer }
              estimatedCostUsd: { type: number, format: double, nullable: true }
              costSource: { type: string }
              durationSeconds: { type: integer, format: int64, nullable: true }
        assetNodeSummaries:
          type: array
          items:
            type: object
            properties:
              assetId: { type: string }
              nodeId: { type: string }
              displayName: { type: string }
              status: { type: string }
              estimatedCostUsd: { type: number, format: double, nullable: true }
              costSource: { type: string }
        generatedAt: { type: string, format: date-time }
    RunInput:
      type: object
      properties:
        id: { type: string }
        runId: { type: string }
        nodeId: { type: string }
        type:
          type: string
          description: Input kind, for example asset, runtime_target, config, or parameter.
        refId: { type: string }
        refVersion: { type: string }
        fileName: { type: string }
        mountPath: { type: string }
        targetFilename: { type: string }
        source: { type: string }
        snapshot:
          type: object
          additionalProperties: true
    RunInputList:
      type: object
      properties:
        runId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/RunInput' }
        total: { type: integer }
    RunOutput:
      type: object
      properties:
        id: { type: string }
        runId: { type: string }
        nodeId: { type: string }
        type:
          type: string
          description: Output kind, for example node_outputs, logs, or metrics.
        refId: { type: string }
        uri: { type: string }
        snapshot:
          type: object
          additionalProperties: true
    RunOutputList:
      type: object
      properties:
        runId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/RunOutput' }
        total: { type: integer }
    RunChildList:
      type: object
      properties:
        runId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PipelineRun' }
        total: { type: integer }
    RunRuntime:
      type: object
      properties:
        runId: { type: string }
        runtime:
          type: object
          properties:
            runtimeType: { type: string, example: argo }
            workflowName: { type: string }
            namespace: { type: string }
            uid: { type: string }
            status: { type: string }
            message: { type: string }
            executionTargetId: { type: string }
            targetSnapshot:
              type: object
              additionalProperties: true
            debugUrl: { type: string }
    RunNodeList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PipelineRunNode' }
        total: { type: integer }
    RunOperationResponse:
      type: object
      properties:
        message: { type: string }
    PipelineComponent:
      type: object
      properties:
        id: { type: string, description: Component ID }
        name: { type: string }
        type:
          type: string
          enum: [container, script, resource, suspend]
        description: { type: string }
        image: { type: string, description: Docker image name }
        tag: { type: string, description: Docker image tag }
        source: { type: string, description: Source registry identifier }
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        inputPorts:
          type: array
          items: { $ref: '#/components/schemas/PortDef' }
        outputPorts:
          type: array
          items: { $ref: '#/components/schemas/PortDef' }
        resources:
          $ref: '#/components/schemas/PipelineComponentResources'
        envVars:
          type: array
          items: { $ref: '#/components/schemas/EnvVarDef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PipelineComponentRequest:
      type: object
      required: [name, type, image]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [container, script, resource, suspend]
        description: { type: string }
        image: { type: string }
        tag: { type: string, default: latest }
        source: { type: string, default: custom }
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        inputPorts:
          type: array
          items: { $ref: '#/components/schemas/PortDef' }
        outputPorts:
          type: array
          items: { $ref: '#/components/schemas/PortDef' }
        resources:
          $ref: '#/components/schemas/PipelineComponentResources'
        envVars:
          type: array
          items: { $ref: '#/components/schemas/EnvVarDef' }
    PipelineComponentResources:
      type: object
      description: Container resource requirements and DataBrew scheduling metadata.
      properties:
        cpu:
          type: string
          description: Kubernetes CPU quantity, for example "500m" or "4".
          example: "4000m"
        memory:
          type: string
          description: Kubernetes memory quantity.
          example: "16Gi"
        disk:
          type: string
          description: Kubernetes ephemeral storage quantity.
          example: "50Gi"
        gpu:
          type: string
          description: Kubernetes nvidia.com/gpu quantity emitted as a GPU limit.
          example: "1"
        computeTier:
          type: string
          description: DataBrew compute tier metadata for future scheduling, quota, and cost policy.
          example: "gpu-l4"
        type:
          type: string
          description: Component runtime type mirror.
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
      additionalProperties: true
    PipelineConfig:
      type: object
      description: Standalone user-owned config file record. Configs are independent resources and are not children of pipeline components.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        owner: { type: string }
        scope: { type: string, default: dev }
        tags:
          type: array
          items: { type: string }
        fileType:
          type: string
          enum: [yaml, json]
        lifecycle:
          type: string
          enum: [draft, ready, deprecated]
        currentVersion: { type: integer, minimum: 1 }
        versionCount: { type: integer, minimum: 0 }
        versions:
          type: array
          description: Version summaries. File content is omitted here; fetch a specific version for content.
          items: { $ref: '#/components/schemas/PipelineConfigVersion' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PipelineConfigVersion:
      type: object
      description: Immutable file snapshot for a standalone config.
      properties:
        id: { type: string }
        configId: { type: string }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [draft, ready, deprecated]
        content:
          type: string
          description: Present only on single-version detail responses.
          maxLength: 1048576
        contentSha256: { type: string }
        contentSizeBytes: { type: integer, minimum: 0, maximum: 1048576 }
        summary: { type: string }
        author: { type: string }
        createdAt: { type: string, format: date-time }
    PipelineConfigCreateRequest:
      type: object
      required: [name, content]
      properties:
        name: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        fileType:
          type: string
          enum: [yaml, json]
          description: Optional; inferred from the file name when omitted.
        lifecycle:
          type: string
          enum: [draft, ready, deprecated]
          default: draft
        scope:
          type: string
          default: dev
        content:
          type: string
          maxLength: 1048576
        summary: { type: string }
    PipelineConfigUpdateRequest:
      type: object
      required: [name]
      description: Updates metadata only. Editing file content creates a new immutable version.
      properties:
        name: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        fileType:
          type: string
          enum: [yaml, json]
        lifecycle:
          type: string
          enum: [draft, ready, deprecated]
    PipelineConfigVersionCreateRequest:
      type: object
      required: [content]
      properties:
        status:
          type: string
          enum: [draft, ready, deprecated]
          default: draft
        content:
          type: string
          maxLength: 1048576
        summary: { type: string }
    PipelineConfigListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PipelineConfig' }
    ComponentReleaseRuntimeSnapshot:
      type: object
      required: [image, inputPorts, outputPorts]
      properties:
        image:
          type: string
          description: Immutable runtime image, preferably pinned by digest.
          example: us-central1-docker.pkg.dev/my-project/video-proc-images/hand-detect-yolov26m@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        inputPorts:
          type: array
          items: { $ref: '#/components/schemas/PortDef' }
        outputPorts:
          type: array
          items: { $ref: '#/components/schemas/PortDef' }
        resources:
          type: object
          additionalProperties: true
    PipelineComponentRelease:
      type: object
      required:
        - id
        - componentId
        - taskName
        - releaseLabel
        - channel
        - runtimeImage
        - status
        - selectable
        - validationStatus
        - runtimeSnapshot
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        imageUid:
          type: string
          description: Stable 8-character DataBrew image ID generated from image digest, falling back to runtime image.
          example: 2f4a9c01
        componentId: { type: string }
        taskName: { type: string }
        taskPath: { type: string }
        displayName: { type: string }
        owner: { type: string }
        releaseLabel:
          type: string
          description: User-facing version label such as pr-128-abc123, main-abc123, v0.4.1-rc.1, or v0.4.0.
        channel:
          type: string
          enum: [dev, preview, candidate, rc, prod]
        sourceRepo: { type: string }
        sourceRef: { type: string }
        sourceRefType:
          type: string
          enum: [tag, commit, branch, pr]
        sourceCommit: { type: string }
        buildId: { type: string }
        imageRepo: { type: string }
        imageTag: { type: string }
        imageDigest: { type: string }
        runtimeImage: { type: string }
        status:
          type: string
          enum: [ready, failed, pending, deprecated]
        selectable: { type: boolean }
        validationStatus:
          type: string
          enum: [passed, failed]
        validationErrors:
          type: array
          items: { type: string }
        runtimeSnapshot:
          $ref: '#/components/schemas/ComponentReleaseRuntimeSnapshot'
        technicalMetadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
    PipelineComponentReleaseInput:
      type: object
      description: CI/platform generated component release payload. DataBrew derives missing identity/status fields where possible and validates selectability.
      properties:
        id: { type: string }
        imageUid:
          type: string
          description: Optional CI-provided DataBrew image ID. DataBrew derives it from image digest when omitted.
        componentId: { type: string }
        taskName: { type: string }
        taskPath: { type: string }
        displayName: { type: string }
        owner: { type: string }
        releaseLabel: { type: string }
        channel:
          type: string
          enum: [dev, preview, candidate, rc, prod]
        sourceRepo: { type: string }
        sourceRef: { type: string }
        sourceRefType:
          type: string
          enum: [tag, commit, branch, pr]
        sourceCommit: { type: string }
        buildId: { type: string }
        imageRepo: { type: string }
        imageTag: { type: string }
        imageDigest: { type: string }
        runtimeImage: { type: string }
        status:
          type: string
          enum: [ready, failed, pending, deprecated]
        runtimeSnapshot:
          $ref: '#/components/schemas/ComponentReleaseRuntimeSnapshot'
        technicalMetadata:
          type: object
          additionalProperties: true
    ComponentReleaseIngestSource:
      type: object
      description: Shared CI/build source context applied as defaults to every release item in the batch.
      properties:
        provider:
          type: string
          example: cloud-build
        repo:
          type: string
          example: CyberOrigin2077/automated-processing-gcloud
        ref:
          type: string
          example: refs/heads/main
        refType:
          type: string
          enum: [tag, commit, branch, pr]
          example: branch
        commit:
          type: string
          example: abc123
        buildId:
          type: string
          example: 1e86eab9-9250-41c5-b905-8ff3c6de23af
        trigger:
          type: string
          example: hand-track-stereo-build-trigger
    ComponentReleaseSyncRequest:
      type: object
      required: [items]
      properties:
        source:
          $ref: '#/components/schemas/ComponentReleaseIngestSource'
