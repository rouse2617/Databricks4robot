              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── Runs (product execution API) ──────────────────────────────────
  /api/v1/runs:
    post:
      tags: [Runs]
      summary: Create a Run from an inline pipeline
      description: Creates the product execution record through the Run Kernel boundary and submits its runtime workflow through the configured adapter. Pipeline design-time templates and runtime workflow names remain references; callers should store the returned run id.
      security:
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipeline]
              properties:
                pipeline:
                  type: object
                  description: Full pipeline definition
                name: { type: string, description: Optional run name }
                asset_ids:
                  type: array
                  items: { type: string }
                target_id:
                  type: string
                  description: Execution target ID. Defaults to the default target when omitted.
                configSelection:
                  $ref: '#/components/schemas/DeployConfigSelection'
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }
        '400':
          description: Invalid request, missing asset, or invalid execution target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Runtime backend unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Runs]
      summary: List Runs
      security:
        - DatabrewToken: []
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [summary, full] }
        - in: query
          name: batchJobId
          schema: { type: string }
        - in: query
          name: excludeBatch
          schema: { type: boolean }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: pipelineNodeId
          schema: { type: string }
        - in: query
          name: nodeStatus
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Run list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PipelineRun' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /api/v1/runs/template/{id}:
    post:
      tags: [Runs]
      summary: Create Run from a pipeline template
      description: Creates product Run records through the Run Kernel boundary from a saved pipeline template. A single asset returns one Run; multiple asset IDs may return a collection wrapper.
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Template ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                version: { type: integer }
                asset_ids:
                  type: array
                  items: { type: string }
                target_id: { type: string }
                configSelection:
                  $ref: '#/components/schemas/DeployConfigSelection'
      responses:
        '201':
          description: Run created. Multiple asset IDs may return a batch object with items and total.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PipelineRun'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PipelineRun' }
                      total: { type: integer }
        '400':
          description: Invalid request, missing asset, or invalid execution target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Template not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

