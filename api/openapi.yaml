openapi: 3.1.0
info:
  title: cyber-databrew API
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - GraceToken: []
components:
  securitySchemes:
    GraceToken:
      type: apiKey
      in: header
      name: X-Grace-Token
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
  parameters:
    RequestIdHeader:
      in: header
      name: X-Request-ID
      schema:
        type: string
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details:
          type: object
          additionalProperties: true
    AssetID:
      type: string
      minLength: 8
      maxLength: 8
      pattern: '^[0-9A-Za-z]{8}$'
      description: Primary key for assets (8 alphanumeric ASCII characters).
    RunID:
      type: string
      minLength: 16
      maxLength: 16
      pattern: '^[0-9A-Za-z]{16}$'
      description: Primary key for algo_runs (16 alphanumeric ASCII characters).
    McapFileID:
      type: string
      minLength: 8
      maxLength: 8
      pattern: '^[0-9A-Za-z]{8}$'
      description: Primary key for mcap_files (same format as asset_id).
    ActionID:
      type: string
      minLength: 8
      maxLength: 8
      pattern: '^[0-9A-Za-z]{8}$'
      description: Primary key for actions (same format as asset_id).
    Asset:
      type: object
      description: >
        Asset resource. Documented shape matches what integrations should rely on;
        see also docs/review/api-guide.md. Primary lifecycle and typing fields are
        lifecycle_state, asset_type, and duration_ms.
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        mcap_file_id: { $ref: '#/components/schemas/McapFileID' }
        segment_locator: { type: string, description: "Deterministic SHA-1 of mcap_file_id + start_ns + end_ns" }
        start_timestamp_ns: { type: integer, format: int64 }
        end_timestamp_ns: { type: integer, format: int64 }
        lifecycle_state:
          type: string
          enum: [created, processing, ready, delivered, archived, superseded, failed, rejected]
          description: "Lifecycle state; must match PostgreSQL chk_lifecycle_state and GET /api/v1/lifecycle-states."
        asset_type:
          type: string
          description: "Asset type (e.g. segment, clip, frame_set, derived_asset)."
        duration_ms:
          type: integer
          format: int64
          description: "Duration in milliseconds (aligned with start_timestamp_ns / end_timestamp_ns)."
        owner: { type: string, description: "Owner identifier" }
        reviewer: { type: string, description: "Reviewer identifier" }
        retention_tier:
          type: string
          description: "Retention policy tier (e.g. standard, long-term, archive)"
        expire_at:
          type: string
          format: date-time
          description: "Expiration timestamp for retention policy"
          nullable: true
        storage_uri:
          type: string
          description: "Primary storage URI (GCS path)"
        thumb_uri:
          type: string
          description: "Thumbnail URI"
        tenant_id:
          type: string
          description: "Tenant identifier (pre-positioned for multi-tenant support)"
          nullable: true
        project_id:
          type: string
          description: "Project identifier (pre-positioned for multi-tenant support)"
          nullable: true
        asset_level: { type: integer, description: "Hierarchy depth (0 = root segment)" }
        parent_asset_id:
          allOf:
            - $ref: '#/components/schemas/AssetID'
          nullable: true
          description: "Parent asset id for split/derived assets"
        root_asset_id:
          allOf:
            - $ref: '#/components/schemas/AssetID'
          nullable: true
          description: "Root ancestor asset id"
        delivery_count: { type: integer, description: "Number of times this asset has been delivered" }
        last_delivered_at: { type: string, format: date-time, nullable: true }
        last_delivered_to: { type: string, description: "Last delivery customer ID", nullable: true }
        env: { type: string, description: "Environment tag (e.g. indoor, outdoor)" }
        task: { type: string, description: "Task identifier" }
        version: { type: integer, format: int64 }
        algo_results:
          type: object
          description: "Per-algorithm latest status / outputs (projection; map key is algo key such as algo@version:field)"
          additionalProperties: { type: string }
        tags:
          type: object
          description: "Flat key→value map of `asset_tags`. Last-applied-wins per key for backward compatibility. For multi-source data use `tags_detailed`."
          additionalProperties: { type: string }
        tags_detailed:
          type: array
          description: "Full `asset_tags` rows (CYB-1015). Multiple rows per `tag_key` may appear when (source_type, source_version) differs."
          items: { $ref: '#/components/schemas/AssetTagDetail' }
        files:
          type: object
          description: "File references. Key = logical name, value = GCS URI"
          additionalProperties: { type: string }
        algo_inputs_uris:
          type: object
          description: "Derived algorithm input video URIs (keyed by source/input name)"
          additionalProperties: { type: string }
        annot_inputs_uris:
          type: object
          description: "Derived annotation input video URIs (keyed by source/input name)"
          additionalProperties: { type: string }
        metadata:
          type: object
          description: "Structured metadata JSONB"
          additionalProperties: true
        lifecycle_meta:
          type: object
          description: "Lifecycle metadata (retention_tier, archive_after_days, etc.)"
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    AssetMcapLocator:
      type: object
      description: >
        Joined view of an asset's time window and its underlying MCAP object,
        for preview/streaming services that drive byte-range reads.
      required: [asset_id, lifecycle_state, mcap, window, version, updated_at]
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        lifecycle_state: { type: string }
        mcap:
          type: object
          required: [mcap_file_id, mcap_uri, size_bytes]
          properties:
            mcap_file_id: { $ref: '#/components/schemas/McapFileID' }
            mcap_uri:
              type: string
              description: "Storage URI (e.g. gs://bucket/path/to.mcap). Caller signs/reads as needed."
            size_bytes: { type: integer, format: int64 }
            raw_hash_md5: { type: string, nullable: true }
        window:
          type: object
          required: [start_timestamp_ns, end_timestamp_ns, duration_ms]
          properties:
            start_timestamp_ns: { type: integer, format: int64 }
            end_timestamp_ns:   { type: integer, format: int64 }
            duration_ms:        { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    Action:
      type: object
      description: >
        Time-bounded annotation inside a segment asset (mcap → seg → action,
        third layer of the business model). Actions do NOT participate in
        lifecycle_state, deliveries, or the asset list API.
      required: [action_id, asset_id, start_ns, end_ns, source_type, version]
      properties:
        action_id: { $ref: '#/components/schemas/ActionID' }
        asset_id: { $ref: '#/components/schemas/AssetID', description: "Parent seg asset" }
        start_ns: { type: integer, format: int64, description: "Half-open interval start (ns, same scale as assets.start_timestamp_ns)" }
        end_ns: { type: integer, format: int64, description: "Half-open interval end (ns); end_ns >= start_ns" }
        action_index: { type: integer, nullable: true, description: "Optional human-readable ordinal inside the seg" }
        primary_label: { type: string, description: "Primary label used for facets / list display" }
        labels:
          type: array
          items: { type: string }
          description: "Multi-label set (GIN-indexed in PG)"
        description: { type: string }
        attrs:
          type: object
          additionalProperties: true
          description: "Free-form payload (algo outputs, geometry, etc.)"
        source_type:
          type: string
          enum: [human, algo, rule, system]
        source_name: { type: string, description: "Algo name / annotator id", nullable: true }
        source_version: { type: string, nullable: true }
        run_id: { type: string, nullable: true }
        confidence: { type: number, format: double, nullable: true }
        external_id: { type: string, nullable: true, description: "Producer-side idempotency fingerprint; UNIQUE with (asset_id, source_name)" }
        tenant_id: { type: string, nullable: true }
        project_id: { type: string, nullable: true }
        is_deleted: { type: boolean }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ActionCreateRequest:
      type: object
      required: [start_ns, end_ns]
      properties:
        start_ns: { type: integer, format: int64 }
        end_ns: { type: integer, format: int64 }
        action_index: { type: integer, nullable: true }
        primary_label: { type: string }
        labels:
          type: array
          items: { type: string }
        description: { type: string }
        attrs:
          type: object
          additionalProperties: true
        source_type:
          type: string
          enum: [human, algo, rule, system]
          default: human
        source_name: { type: string }
        source_version: { type: string }
        run_id: { type: string }
        confidence: { type: number, format: double, nullable: true }
        external_id: { type: string }
    ActionPatchRequest:
      type: object
      description: >
        Partial update for an existing action. Unset fields are left unchanged.
        `expected_version` enables optimistic concurrency; on mismatch the
        server returns 409 CONCURRENT_CONFLICT.
      properties:
        start_ns: { type: integer, format: int64 }
        end_ns: { type: integer, format: int64 }
        action_index: { type: integer, nullable: true }
        primary_label: { type: string }
        labels:
          type: array
          items: { type: string }
        description: { type: string }
        attrs:
          type: object
          additionalProperties: true
        source_type:
          type: string
          enum: [human, algo, rule, system]
        source_name: { type: string }
        source_version: { type: string }
        run_id: { type: string }
        confidence: { type: number, format: double, nullable: true }
        expected_version: { type: integer, format: int64, description: "Current version for CAS; omit to skip the version guard" }
    ActionListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        asset_id: { $ref: '#/components/schemas/AssetID' }
        total: { type: integer }
    CustomerID:
      type: string
      pattern: '^[a-z][a-z0-9_-]{2,31}$'
      minLength: 3
      maxLength: 32
      description: Stable customer slug (lowercase letter first).
    Customer:
      type: object
      required: [customer_id, display_name, status, sla_tier, created_at, updated_at, row_version]
      properties:
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        display_name: { type: string }
        legal_name: { type: string }
        status:
          type: string
          enum: [active, trial, suspended, offboarded]
        region: { type: string }
        sla_tier:
          type: string
          enum: [standard, premium, enterprise]
        account_owner: { type: string }
        compliance_tags:
          type: array
          items: {}
        exclude_tags:
          type: array
          items: {}
        metadata:
          type: object
          additionalProperties: true
        extra:
          type: object
          additionalProperties: true
        onboarded_at: { type: string, format: date-time, nullable: true }
        offboarded_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        row_version: { type: integer, format: int64 }
    CustomerCreateRequest:
      type: object
      required: [customer_id, display_name]
      properties:
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        display_name: { type: string }
        legal_name: { type: string }
        status:
          type: string
          enum: [active, trial, suspended, offboarded]
        region: { type: string }
        sla_tier:
          type: string
          enum: [standard, premium, enterprise]
        account_owner: { type: string }
        compliance_tags:
          type: array
          items: {}
        exclude_tags:
          type: array
          items: {}
        metadata:
          type: object
          additionalProperties: true
    CustomerPatchRequest:
      type: object
      properties:
        display_name: { type: string }
        legal_name: { type: string }
        status:
          type: string
          enum: [active, trial, suspended, offboarded]
        region: { type: string }
        sla_tier:
          type: string
          enum: [standard, premium, enterprise]
        account_owner: { type: string }
        compliance_tags:
          type: array
          items: {}
        exclude_tags:
          type: array
          items: {}
        metadata:
          type: object
          additionalProperties: true
    CustomerListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        limit: { type: integer }
        next_cursor: { type: string }
    DeliveryRuleQueryDSL:
      type: object
      required: [where]
      properties:
        where:
          type: array
          items:
            type: object
            required: [field, op]
            properties:
              field: { type: string }
              op: { type: string }
              value: {}
        asset_types:
          type: array
          items: { type: string }
    DeliveryRule:
      type: object
      properties:
        rule_id: { type: string, format: uuid }
        name: { type: string }
        owner: { type: string }
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        query_dsl: { $ref: '#/components/schemas/DeliveryRuleQueryDSL' }
        dsl_version: { type: string }
        enforce_mode:
          type: string
          enum: [block, warn, tag_only]
        rating_scope:
          type: string
          enum: [current, logical]
        is_active: { type: boolean }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeliveryRuleCreateRequest:
      type: object
      required: [name, owner, query_dsl]
      properties:
        name: { type: string }
        owner: { type: string }
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        query_dsl: { $ref: '#/components/schemas/DeliveryRuleQueryDSL' }
        dsl_version: { type: string, default: v1 }
        enforce_mode:
          type: string
          enum: [block, warn, tag_only]
          default: block
        rating_scope:
          type: string
          enum: [current, logical]
          default: current
        is_active: { type: boolean, default: true }
    DeliveryRuleListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeliveryRule' }
    DeliveryRuleViolation:
      type: object
      properties:
        asset_id: { type: string }
        rule_id: { type: string }
        rule_name: { type: string }
        enforce_mode: { type: string }
        reason: { type: string }
    AlgoRunCreateRequest:
      type: object
      required: [algo_name, algo_version, triggered_by]
      properties:
        run_id: { $ref: '#/components/schemas/RunID' }
        algo_name: { type: string }
        algo_version: { type: string }
        algo_kind:
          type: string
          enum: [processing, split, qa, enrichment]
        triggered_by: { type: string }
        input_filter:
          type: object
          additionalProperties: true
        input_asset_ids:
          type: array
          items: { type: string }
        params:
          type: object
          additionalProperties: true
        code_commit: { type: string }
        image_digest: { type: string }
    AlgoRunFinishRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, failed]
        assets_processed: { type: integer }
        assets_succeeded: { type: integer }
        assets_failed: { type: integer }
        actions_created: { type: integer }
        metrics_written: { type: integer }
        outputs:
          type: object
          additionalProperties: true
        cpu_seconds: { type: integer, format: int64 }
        gpu_seconds: { type: integer, format: int64 }
        cost_usd_micros: { type: integer, format: int64 }
        error_class: { type: string }
        error_message: { type: string }
    AlgoRun:
      type: object
      properties:
        run_id: { $ref: '#/components/schemas/RunID' }
        algo_name: { type: string }
        algo_version: { type: string }
        algo_kind: { type: string }
        triggered_by: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        duration_ns: { type: integer, format: int64, nullable: true }
        params:
          type: object
          additionalProperties: true
        outputs:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        row_version: { type: integer, format: int64 }
    AlgoRunListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AlgoRun' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    AlgoRunCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    AffectedAsset:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        algo_name: { type: string }
        algo_version: { type: string }
        status: { type: string }
        result_tag: { type: string }
        result_score: { type: number, format: double, nullable: true }
        run_id: { $ref: '#/components/schemas/RunID' }
        updated_at: { type: string, format: date-time }
    Delivery:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        status: { type: string }
        delivered_at: { type: string, format: date-time, nullable: true }
        contract_id: { type: string }
        note: { type: string }
        asset_count: { type: integer }
        owner: { type: string }
        delivery_type: { type: string }
        item_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    DeliveryListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Delivery' }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    DeliveryCommitRequest:
      type: object
      required: [asset_ids, customer_id]
      properties:
        asset_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AssetID' }
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        contract_id: { type: string }
        note: { type: string }
        owner: { type: string }
    DeliveryCommitResponse:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        asset_count: { type: integer }
        delivered_at: { type: string, format: date-time }
        status: { type: string }
    DeliveryItemsRequest:
      type: object
      required: [asset_ids]
      properties:
        asset_ids:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AssetID' }
    DeliveryItemsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeliveryItem' }
    DeliveryDraftRequest:
      type: object
      required: [customer_id]
      properties:
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        asset_ids:
          type: array
          items: { $ref: '#/components/schemas/AssetID' }
        contract_id: { type: string }
        note: { type: string }
        owner: { type: string }
    DeliveryDraftResponse:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        status: { type: string }
        asset_count: { type: integer }
        created_at: { type: string, format: date-time }
    DeliveryAddItemsResponse:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        status: { type: string }
        asset_count:
          type: integer
          description: Count of unique persisted delivery items after insertion.
        version: { type: integer, format: int64 }
    DeliveryCommitC2Request:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, format: int64 }
        approved_by: { type: string }
    DeliveryCommitC2Response:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        status: { type: string }
        delivered_at: { type: string, format: date-time }
        approved_by: { type: string }
        asset_count: { type: integer }
        version: { type: integer, format: int64 }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/DeliveryRuleViolation' }
    DeliveryCancelRequest:
      type: object
      properties:
        cancelled_by: { type: string }
        cancel_reason: { type: string }
    DeliveryCancelResponse:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        status: { type: string }
        cancelled_at: { type: string, format: date-time }
        cancelled_by: { type: string }
        cancel_reason: { type: string }
    DeliveryRetryResponse:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        customer_id: { $ref: '#/components/schemas/CustomerID' }
        status: { type: string }
        asset_count: { type: integer }
        original_delivery: { type: string, format: uuid }
    DeliveryAckRequest:
      type: object
      required: [acknowledged_by]
      properties:
        acknowledged_by: { type: string }
    DeliveryAckResponse:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        status: { type: string, enum: [accepted] }
        acknowledged_at: { type: string, format: date-time }
        acknowledged_by: { type: string }
    DeliveryItem:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        asset_id: { $ref: '#/components/schemas/AssetID' }
        created_at: { type: string, format: date-time }
    CustomerDeliveryIDsResponse:
      type: object
      properties:
        delivery_ids:
          type: array
          items: { type: string, format: uuid }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        next_token: { type: string }
    StartAlgoRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, description: "Processing method identifier" }
        run_id: { type: string, description: "External orchestration run ID" }
    FinishAlgoRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, failed]
          description: "Algo completion status"
        output_uri:
          type: string
          description: "GCS URI of the output artifact (required when status=ok and algo requires URI)"
        run_id: { type: string, description: "External orchestration run ID" }
        reason:
          type: string
          description: "Failure reason (required when status=failed)"
        result_size_bytes:
          type: integer
          format: int64
          description: "Size of the result in bytes"
        extra_fields:
          type: object
          additionalProperties: true
          description: "Additional output fields required by the algo registry"
    AlgoLifecycleResponse:
      type: object
      properties:
        asset_id: { type: string }
        algo_key: { type: string }
        status: { type: string }
    AlgoEvent:
      type: object
      properties:
        event_id: { type: string, format: uuid }
