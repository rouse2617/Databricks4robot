    # ── Audit ──────────────────────────────────────────────────────────────
    AuditEventRow:
      type: object
      properties:
        event_id: { type: string }
        event_seq: { type: integer, format: int64 }
        event_type: { type: string }
        aggregate_type: { type: string }
        asset_id: { $ref: '#/components/schemas/AssetID' }
        mcap_file_id: { type: string }
        tenant_id: { type: string }
        project_id: { type: string }
        event_source: { type: string }
        actor_type: { type: string }
        actor_id: { type: string }
        run_id: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    AuditSearchResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEventRow' }
        total: { type: integer }
        next_cursor: { type: string, nullable: true }
    LineageNode:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        parent_asset_id: { type: string }
        child_asset_id: { type: string }
        relation_type: { type: string }
        direction: { type: string }
        depth: { type: integer }
        method: { type: string }
        algo_name: { type: string }
        algo_version: { type: string }
        run_id: { type: string }
        created_at: { type: string, format: date-time }
    LineageSearchResponse:
      type: object
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/LineageNode' }
    LineageResponse:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
