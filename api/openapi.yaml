              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}:
    get:
      summary: Get asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      summary: Update asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: concurrent conflict (asset was modified between GET and PATCH)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Soft-delete asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
  /api/v1/assets/{id}/mcap-locator:
    get:
      summary: Get asset MCAP locator (time window + MCAP object)
      description: |
        Returns the underlying MCAP object reference and the asset's time window
        in a single payload, intended for preview/streaming services that need
        to drive HTTP byte-range reads against the original MCAP without
        signing URLs through this API.

        The endpoint is read-only. URL signing, byte-range planning and video
        muxing are responsibilities of downstream services (e.g.
        mcap-preview-service).
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetMcapLocator' }
        '404':
          description: asset or mcap file not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            asset lifecycle_state is not preview-enabled for this endpoint
            (allowed created, ready, delivered, archived, superseded),
            or asset has no linked mcap file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: mcap repository not configured on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/algo/{algo_key}/start:
    post:
      summary: Start algo processing on an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
          description: "Algo key in format name@version (e.g. hand_tracking@1.2.0)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAlgoRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlgoLifecycleResponse' }
        '400':
          description: "Invalid algo key (INVALID_ALGO_KEY)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Algo already running (ALGO_ALREADY_RUNNING) or invalid state transition (INVALID_STATE_TRANSITION) or concurrent conflict (CONCURRENT_CONFLICT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/algo/{algo_key}/finish:
    post:
      summary: Finish algo processing on an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
          description: "Algo key in format name@version (e.g. hand_tracking@1.2.0)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishAlgoRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlgoLifecycleResponse' }
        '400':
          description: "Invalid algo key (INVALID_ALGO_KEY)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Invalid state transition (INVALID_STATE_TRANSITION) or concurrent conflict (CONCURRENT_CONFLICT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: "Missing required field (MISSING_REQUIRED_FIELD) or missing reason (MISSING_REASON)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/algo/{algo_key}/reset:
    post:
      summary: Reset algo to pending for retry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
          description: "Algo key in format name@version (e.g. hand_tracking@1.2.0)"
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlgoLifecycleResponse' }
        '400':
          description: "Invalid algo key (INVALID_ALGO_KEY)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Invalid state transition (INVALID_STATE_TRANSITION) or concurrent conflict (CONCURRENT_CONFLICT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/events:
    get:
      summary: List asset events for an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: event_type
          schema: { type: string }
          description: "Repeated filter; supports wildcard suffix such as algo_*"
        - in: query
          name: algo_key
          schema: { type: string }
          description: "Filter event_payload.algo_key"
        - in: query
          name: cursor
          schema: { type: integer, format: int64 }
          description: "Fetch older events with event_seq < cursor"
        - in: query
          name: before_event_seq
          schema: { type: integer, format: int64 }
          description: "Alias of cursor"
        - in: query
          name: after_event_seq
          schema: { type: integer, format: int64 }
          description: "Fetch events with event_seq > after_event_seq"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetEventListResponse' }
        '400':
          description: "Invalid path id or query (INVALID_ARGUMENT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/timeline:
    get:
      summary: List asset timeline events for an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: event_type
          schema: { type: string }
          description: "Repeated filter; supports wildcard suffix such as algo_*"
        - in: query
          name: algo_key
          schema: { type: string }
          description: "Filter event_payload.algo_key"
        - in: query
          name: cursor
          schema: { type: integer, format: int64 }
          description: "Fetch older events with event_seq < cursor"
        - in: query
          name: before_event_seq
          schema: { type: integer, format: int64 }
          description: "Alias of cursor"
        - in: query
          name: after_event_seq
          schema: { type: integer, format: int64 }
          description: "Fetch events with event_seq > after_event_seq"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetEventListResponse' }
        '400':
          description: "Invalid path id or query (INVALID_ARGUMENT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/audit/search:
    get:
      summary: Search audit events across assets
      description: |
        Searches `asset_events` across assets. Results are ordered by
        `event_seq DESC`; `cursor` fetches older rows with `event_seq < cursor`.
      parameters:
        - in: query
          name: actor
          schema: { type: string }
          description: "Case-insensitive match on actor_id."
        - in: query
          name: event_type
          schema: { type: string }
          description: "Exact event_type match."
        - in: query
          name: run_id
          schema: { type: string }
          description: "Exact run_id match."
        - in: query
          name: time_from
          schema: { type: string, format: date-time }
          description: "Inclusive occurred_at lower bound (RFC3339)."
        - in: query
          name: time_to
          schema: { type: string, format: date-time }
          description: "Inclusive occurred_at upper bound (RFC3339)."
        - in: query
          name: cursor
          schema: { type: integer, format: int64 }
          description: "Fetch older events with event_seq < cursor."
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditSearchResponse' }
        '400':
          description: "Invalid query filter (INVALID_ARGUMENT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: "Audit search storage is not configured (SERVICE_UNAVAILABLE)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/provenance:
    get:
      summary: Get asset provenance (version history + lineage)
      description: |
        Returns revision list and version_history for the asset logical family,
        plus the same structural lineage snapshot as GET /assets/{id}/lineage.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetProvenanceResponse' }
        '400':
          description: "Invalid path id (INVALID_ARGUMENT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/tags:
    post:
      summary: Create or update a single tag on an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagUpsertRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Immutable source attempted to rewrite an existing assertion (TAG_IMMUTABLE)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: "Invalid tag key/value (INVALID_TAG) or invalid source identity (TAG_SOURCE_INVALID)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/tags/{key}:
    delete:
      summary: Delete tag(s) for a key. Omit `source_type` to delete all sources for the key; specify to remove a single source row.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: source_type
          required: false
          schema: { type: string }
          description: "When set, only the matching source row is deleted; otherwise all source rows for the key are removed."
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/tags/history:
    get:
      summary: List tag change history for an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
