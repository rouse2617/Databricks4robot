        event_type: { type: string, example: asset_created }
        asset_count: { type: integer, format: int64 }
    LakehouseEventDailyResponse:
      type: object
      properties:
        days: { type: integer }
        checked_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/LakehouseEventDailyItem' }
    LakehouseEventTypeShareItem:
      type: object
      properties:
        event_type: { type: string, example: asset_created }
        asset_count: { type: integer, format: int64 }
        ratio:
          type: number
          format: double
          description: Share of this event_type on the selected date, in [0,1].
    LakehouseEventTypeShareResponse:
      type: object
      properties:
        date: { type: string, nullable: true, example: '2026-05-12' }
        checked_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/LakehouseEventTypeShareItem' }
    PurgeCounts:
      type: object
      description: Rows physically deleted from each affected table during a hard-delete.
      properties:
        asset_metrics: { type: integer, format: int64 }
        asset_eval_results: { type: integer, format: int64 }
        asset_algo_events: { type: integer, format: int64 }
        asset_algo_latest: { type: integer, format: int64 }
        asset_tags: { type: integer, format: int64 }
        actions: { type: integer, format: int64 }
        delivery_items: { type: integer, format: int64 }
        asset_relations: { type: integer, format: int64 }
        asset_events_by_asset: { type: integer, format: int64 }
        assets: { type: integer, format: int64 }
        asset_events_by_mcap: { type: integer, format: int64 }
        asset_eval_results_by_mcap: { type: integer, format: int64 }
        mcap_files: { type: integer, format: int64 }
    BatchDeleteRequest:
      type: object
      description: Exactly one of `asset_ids` or `import_batch` must be provided.
      properties:
        asset_ids:
          type: array
          items: { $ref: '#/components/schemas/AssetID' }
          description: Explicit list of asset_ids to purge.
        import_batch:
          type: string
          description: Match assets / mcap_files whose `metadata->>'import_batch'` equals this value.
        include_mcap_files:
          type: boolean
          default: false
          description: When `import_batch` is set, also drop the matching `mcap_files` rows (and their `asset_events` / `asset_eval_results` children) after the assets are gone.
        dry_run:
          type: boolean
          default: false
          description: When true, only report counts that would be deleted; nothing is modified.
        chunk_size:
          type: integer
          minimum: 1
          default: 1000
          description: Per-transaction batch size for the physical deletes.
    BatchPurgeResolved:
      type: object
      properties:
        asset_ids_count: { type: integer, format: int64 }
        mcap_file_ids_count: { type: integer, format: int64 }
        import_batch: { type: string }
    BatchPurgeResponse:
      type: object
      required: [dry_run, include_mcap_files, resolved, deleted]
      properties:
        dry_run: { type: boolean }
        include_mcap_files: { type: boolean }
        resolved: { $ref: '#/components/schemas/BatchPurgeResolved' }
        deleted: { $ref: '#/components/schemas/PurgeCounts' }
    SearchReindexResponse:
      type: object
      properties:
        dry_run: { type: boolean }
        total_assets: { type: integer, format: int64 }
        indexed: { type: integer, format: int64 }
        deleted: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        errors:
          type: array
          items: { type: string }
        elasticsearch_doc_count: { type: integer, format: int64 }
        assets_scanned: { type: integer, format: int64 }
        documents_indexed: { type: integer, format: int64 }
        documents_deleted: { type: integer, format: int64 }
    SearchReindexJob:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [queued, running, paused, succeeded, failed]
        dry_run: { type: boolean }
        page_size: { type: integer }
        next_page: { type: integer }
        stop_requested: { type: boolean }
        total_assets: { type: integer, format: int64 }
        assets_scanned: { type: integer, format: int64 }
        documents_indexed: { type: integer, format: int64 }
        documents_deleted: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        error: { type: string }
        error_samples:
          type: array
          items: { type: string }
        elasticsearch_doc_count: { type: integer, format: int64 }
        progress_pct:
          type: number
          format: double
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    SearchReindexJobListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchReindexJob' }
    SearchOutboxStatsResponse:
      type: object
      properties:
        publish_state_counts:
          type: object
          additionalProperties: { type: integer, format: int64 }
        outbox_dlq_rows: { type: integer, format: int64 }
    SyncStatusData:
      type: object
      properties:
        dagster_run_id: { type: string }
        checked_at: { type: string, format: date-time }
        pg_total_count: { type: integer, format: int64 }
        iceberg_total_count: { type: integer, format: int64 }
        count_diff_pct:
          type: number
          format: double
          description: "Difference ratio in [0,1]. Example: 0.001 = 0.1%."
        pg_status_dist:
          type: object
          additionalProperties: true
        iceberg_status_dist:
          type: object
          additionalProperties: true
        status_diff:
          type: object
          additionalProperties: true
        is_alert: { type: boolean }
        iceberg_max_seq: { type: integer, format: int64 }
    SyncStatusResponse:
      type: object
      properties:
        available: { type: boolean }
        source:
          type: string
          enum: [realtime, sync_reconciliation]
        message: { type: string }
        data:
          $ref: '#/components/schemas/SyncStatusData'
    BronzeSyncProgressResponse:
      type: object
      required:
        - outbox_published_max_seq
        - bronze_max_event_seq
        - bronze_lag_events
        - bronze_stale_seconds
        - checked_at
      properties:
        outbox_published_max_seq:
          type: integer
          format: int64
          description: MAX(event_seq) WHERE publish_state='published' in asset_events; upper bound Bronze can catch up to.
        bronze_max_event_seq:
          type: integer
          format: int64
          description: MAX(event_seq) in bronze_asset_events; cursor for the next ingest run.
        bronze_lag_events:
          type: integer
          format: int64
          description: outbox_published_max_seq - bronze_max_event_seq; PG-published events not yet in Bronze.
        bronze_last_ingested_at:
          type: string
          format: date-time
          nullable: true
          description: MAX(_ingested_at) from Bronze; null when table is empty.
        bronze_stale_seconds:
          type: number
          format: double
          description: now - bronze_last_ingested_at in seconds; -1 when Bronze has no rows yet.
        checked_at: { type: string, format: date-time }
    SearchSyncStatusResponse:
      type: object
      required:
        - elasticsearch_ok
        - outbox_relay_enabled
        - outbox_es_subscriber_enabled
        - search_index_mode
      properties:
        elasticsearch_ok: { type: boolean }
        outbox_relay_enabled: { type: boolean }
        outbox_es_subscriber_enabled: { type: boolean }
        search_index_mode:
          type: string
          enum: [unavailable, outbox_es_subscriber, local_reconcile, manual]
        env: { type: string }
    SearchSyncProgressResponse:
      type: object
      required:
        - postgres_assets_total
        - elasticsearch_docs_total
        - pg_es_gap
        - pg_es_sync_ratio
        - outbox_pending_events
        - outbox_pending_claimable
        - outbox_processing_events
        - outbox_relay_safety_lag_sec
        - oldest_pending_age_sec
        - checked_at
      properties:
        postgres_assets_total: { type: integer, format: int64 }
        elasticsearch_docs_total: { type: integer, format: int64 }
        pg_es_gap: { type: integer, format: int64 }
        pg_es_sync_ratio: { type: number, format: double }
        outbox_pending_events:
          type: integer
          format: int64
          description: >
            Rows with publish_state=pending, including rows inside the relay
            safety-lag window that are not yet claimable.
        outbox_pending_claimable:
          type: integer
          format: int64
          description: >
            Pending rows old enough for the relay to claim (same visibility as
            ClaimPendingSafe pending branch).
        outbox_processing_events:
          type: integer
          format: int64
          description: Rows with publish_state=processing (claimed, in-flight to ES).
        outbox_relay_safety_lag_sec:
          type: number
          format: double
          description: Configured OUTBOX_RELAY_SAFETY_LAG_SEC (visibility delay for new pending rows).
        oldest_pending_age_sec: { type: number, format: double }
        pg_max_event_seq:
          type: integer
          format: int64
          description: >
            MAX(event_seq) across asset_events. Watermark used for cheap
            O(1) lag monitoring at scale (no COUNT(*) over assets / ES).
        outbox_published_max_seq:
          type: integer
          format: int64
          description: >
            MAX(event_seq) WHERE publish_state='published'. Represents "handed
            off to the message bus", NOT "consumed by ES" — for the
            consumer-side high-water mark, run a separate sync audit.
        seq_lag:
          type: integer
          format: int64
          description: >
            pg_max_event_seq - outbox_published_max_seq. Number of events still
            in pending/processing on the PG side. Primary alerting signal.
        es_applied_min_seq:
          type: integer
          format: int64
          description: >
            MIN(applied_seq) across es_sync_checkpoint shards. Conservative
            high-water mark: every event_seq <= this value has been ack'd by ES
            on its shard. 0 when fewer shards have reported than configured.
        consumer_lag:
          type: integer
          format: int64
          description: >
            outbox_published_max_seq - es_applied_min_seq when both non-zero.
            Reflects the MQ → ES segment (handed to bus but not yet ack'd by
            ES). 0 when es_applied_min_seq is 0.
        checked_at: { type: string, format: date-time }
    TagTimelineResponse:
      type: object
      properties:
        tag_key: { type: string }
        note: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    McapFile:
      type: object
      properties:
        mcap_file_id: { $ref: '#/components/schemas/McapFileID' }
        gcs_path: { type: string }
        size_bytes: { type: integer, format: int64 }
        raw_hash_md5: { type: string }
        ingest_state: { type: string, enum: [pending, summarized, failed] }
        start_timestamp_ns: { type: integer, format: int64 }
        end_timestamp_ns: { type: integer, format: int64 }
        channel_count: { type: integer }
        chunk_count: { type: integer }
        owner: { type: string }
        process_state:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    QueryPage:
      type: object
      properties:
        page: { type: integer, minimum: 1, default: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200, default: 20 }
        offset:
          type: integer
          minimum: 0
          description: "Optional bridge paging: offset for target offset/limit style. In bridge mode, offset must be a multiple of limit."
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: "Optional bridge paging: limit for target offset/limit style. In bridge mode, offset must be a multiple of limit."
    QueryScope:
      type: object
      required: [resource]
      properties:
        resource:
          type: string
          enum: [assets]
        include_history:
          type: boolean
          description: >
            When true, asset queries return all revisions. Default false — only
            current revisions (is_current=true or legacy NULL is_current).
    QuerySelect:
      type: object
      properties:
        fields:
          type: array
          items: { type: string }
    QuerySort:
      type: object
      required: [field]
      properties:
        field: { type: string }
        direction: { type: string, enum: [asc, desc] }
    QueryFacet:
      type: object
      required: [field]
      properties:
        field: { type: string }
        size: { type: integer, minimum: 1 }
    QueryDebug:
      type: object
      properties:
        explain: { type: boolean }
    QueryExpr:
      type: object
      additionalProperties: false
      properties:
        and:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QueryExpr' }
        or:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QueryExpr' }
        not:
          $ref: '#/components/schemas/QueryExpr'
        pred:
          $ref: '#/components/schemas/QueryPredicate'
      oneOf:
        - required: [and]
        - required: [or]
        - required: [not]
        - required: [pred]
    QueryPredicate:
      type: object
      required: [field, op]
      properties:
        field: { type: string }
        op:
          type: string
          enum: [eq, ne, lt, gt, lte, gte, like, ilike, in, nin, contains, between]
        value: {}
    QueryRequest:
      type: object
      required: [scope]
      properties:
        schema_version: { type: string, default: v1 }
        mode:
          type: string
          enum: [structured, keyword, semantic, similar]
        scope: { $ref: '#/components/schemas/QueryScope' }
        select: { $ref: '#/components/schemas/QuerySelect' }
        where: { $ref: '#/components/schemas/QueryExpr' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/QuerySort' }
        page: { $ref: '#/components/schemas/QueryPage' }
        facets:
          type: array
          items: { $ref: '#/components/schemas/QueryFacet' }
        debug: { $ref: '#/components/schemas/QueryDebug' }
    FieldCapabilityBrief:
      type: object
      required: [field, engines]
      properties:
        field: { type: string }
        engines:
          type: array
          items: { type: string }
    DebugPlanStep:
      type: object
      required: [engine, mode]
      properties:
        engine: { type: string }
        mode: { type: string }
    DebugPlan:
      type: object
      properties:
        steps:
          type: array
          items: { $ref: '#/components/schemas/DebugPlanStep' }
    QueryFacetBucket:
      type: object
      properties:
        value: { type: string }
        count: { type: integer, format: int64 }
    QueryValidateResponse:
      type: object
      properties:
        valid: { type: boolean }
        normalized_query: { $ref: '#/components/schemas/QueryRequest' }
        warnings:
          type: array
          items: { type: string }
        field_capabilities:
          type: array
          items: { $ref: '#/components/schemas/FieldCapabilityBrief' }
        debug_plan: { $ref: '#/components/schemas/DebugPlan' }
    QueryRunResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        columns:
          type: array
          items: { type: string }
        column_defs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              nullable: { type: boolean }
        offset: { type: integer }
        limit: { type: integer }
        facets:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/QueryFacetBucket' }
        warnings:
          type: array
          items: { type: string }
        debug_plan: { $ref: '#/components/schemas/DebugPlan' }
    SavedQuery:
      type: object
      properties:
        saved_query_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        resource: { type: string }
        schema_version: { type: string }
        query_ir_json: { $ref: '#/components/schemas/QueryRequest' }
        owner: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
paths:
  /api/v1/queries/validate:
    post:
      summary: Validate Query IR request
      parameters:
        - name: include_history
          in: query
          required: false
          schema:
            type: boolean
          description: Same as scope.include_history on run — include non-current revisions when validating.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
      responses:
        '200':
          description: query is valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryValidateResponse' }
        '400':
          description: syntax/shape error (INVALID_ARGUMENT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: semantic/planning error (UNSUPPORTED_FIELD/UNSUPPORTED_OPERATOR/UNPLANNABLE_QUERY)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/queries/run:
    post:
      summary: Execute Query IR request
      parameters:
        - name: include_history
          in: query
          required: false
          schema:
            type: boolean
          description: >
            When true, include non-current asset revisions in results. Same as
            scope.include_history in the JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
      responses:
        '200':
          description: query result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryRunResponse' }
        '400':
          description: syntax/shape error (INVALID_ARGUMENT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: semantic/planning error (UNSUPPORTED_FIELD/UNSUPPORTED_OPERATOR/UNPLANNABLE_QUERY)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/saved-queries:
    get:
      summary: List saved queries
      responses:
        '200':
          description: saved queries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavedQuery' }
    post:
      summary: Create saved query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, query_ir_json]
              properties:
                name: { type: string }
                description: { type: string }
                owner: { type: string }
                query_ir_json: { $ref: '#/components/schemas/QueryRequest' }
      responses:
        '201':
          description: created saved query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedQuery' }
  /api/v1/saved-queries/{id}:
    get:
      summary: Get saved query
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: saved query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedQuery' }
    patch:
      summary: Update saved query
      parameters:
        - in: path
          name: id
          required: true
