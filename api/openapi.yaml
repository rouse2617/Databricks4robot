openapi: 3.1.0
info:
  title: data-platform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - GraceToken: []
components:
  securitySchemes:
    GraceToken:
      type: apiKey
      in: header
      name: X-Grace-Token
  parameters:
    RequestIdHeader:
      in: header
      name: X-Request-ID
      schema:
        type: string
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details:
          type: object
          additionalProperties: true
    Asset:
      type: object
      properties:
        asset_id: { type: string }
        mcap_file_id: { type: string }
        start_timestamp_ns: { type: integer, format: int64 }
        end_timestamp_ns: { type: integer, format: int64 }
        status: { type: string }
        reviewer: { type: string }
        owner: { type: string }
        version: { type: integer, format: int64 }
    AssetListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    DeliveryCommitRequest:
      type: object
      required: [asset_ids, customer_id]
      properties:
        asset_ids:
          type: array
          minItems: 1
          items: { type: string }
        customer_id: { type: string }
        contract_id: { type: string }
        note: { type: string }
        owner: { type: string }
paths:
  /api/v1/assets:
    get:
      summary: List assets by MCAP file
      parameters:
        - in: query
          name: mcap_file_id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: ok
          headers:
            X-Request-ID: { $ref: '#/components/parameters/RequestIdHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
        '400':
          description: invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: internal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      summary: Create asset
      responses:
        '201': { description: created }
        '422':
          description: invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}:
    get:
      summary: Get asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      summary: Update asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Soft-delete asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
  /api/v1/mcap/upload/finalize:
    post:
      summary: Finalize upload
      responses:
        '200': { description: ok }
  /api/v1/deliveries:
    post:
      summary: Commit delivery (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryCommitRequest' }
      responses:
        '201': { description: created }
        '409':
          description: idempotency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/deliveries/{id}:
    get:
      summary: Get delivery
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/customers/{customer_id}/deliveries:
    get:
      summary: List customer deliveries
      parameters:
        - in: path
          name: customer_id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200': { description: ok }
        '500':
          description: internal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
