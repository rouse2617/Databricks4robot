  # ── Search ─────────────────────────────────────────────────────────────
  /api/v1/search:
    get:
      tags: [Search]
      summary: Search assets
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free-text query }
        - { name: mode, in: query, schema: { type: string, enum: [keyword, semantic, similar] } }
        - { name: filter, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true, description: 'Repeated field:op:value filters' }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, maximum: 200 } }
        - { name: lineage_with, in: query, schema: { type: string }, description: Asset ID used as lineage seed }
        - { name: lineage_direction, in: query, schema: { type: string, enum: [upstream, downstream, both], default: both } }
        - { name: lineage_depth, in: query, schema: { type: integer, default: 1, maximum: 3 } }
        - { name: relation_types, in: query, schema: { type: string }, description: Comma-separated or repeated relation types }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchAssetsResponse' }
        '400':
          description: Invalid search parameter
        '404':
          description: lineage_with asset not found
        '503':
          description: Elasticsearch unavailable
