openapi: 3.1.0
info:
  title: data-platform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - GraceToken: []
components:
  securitySchemes:
    GraceToken:
      type: apiKey
      in: header
      name: X-Grace-Token
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
  parameters:
    RequestIdHeader:
      in: header
      name: X-Request-ID
      schema:
        type: string
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details:
          type: object
          additionalProperties: true
    Asset:
      type: object
      description: >
        Asset resource. During the dual-write migration period, both legacy
        fields (status, duration_sec, type) and new fields (lifecycle_state,
        duration_ms, asset_type) are returned in every response. New consumers
        should prefer the new field names. Legacy fields will be removed after
        the dual-write period ends.
      properties:
        asset_id: { type: string }
        mcap_file_id: { type: string }
        segment_locator: { type: string, description: "Deterministic SHA-1 of mcap_file_id + start_ns + end_ns" }
        start_timestamp_ns: { type: integer, format: int64 }
        end_timestamp_ns: { type: integer, format: int64 }
        # ── Legacy fields (retained during dual-write) ──
        status:
          type: string
          deprecated: true
          description: "Legacy lifecycle status (approved, rejected, archived, superseded). Prefer lifecycle_state."
        duration_sec:
          type: number
          format: double
          deprecated: true
          description: "Legacy duration in seconds. Prefer duration_ms."
        type:
          type: string
          deprecated: true
          description: "Legacy asset type. Prefer asset_type."
        # ── New fields (Phase 2 — schema evolution) ──
        lifecycle_state:
          type: string
          enum: [created, processing, ready, rejected, delivered, archived, superseded]
          description: "Authoritative lifecycle state. Maps bidirectionally to legacy status during dual-write."
        asset_type:
          type: string
          description: "Asset type (e.g. segment, clip, frame_set, derived_asset). Mirrors legacy type field."
        duration_ms:
          type: integer
          format: int64
          description: "Duration in milliseconds. duration_sec = duration_ms / 1000."
        owner: { type: string, description: "Owner identifier" }
        reviewer: { type: string, description: "Reviewer identifier" }
        retention_tier:
          type: string
          description: "Retention policy tier (e.g. standard, long-term, archive)"
        expire_at:
          type: string
          format: date-time
          description: "Expiration timestamp for retention policy"
          nullable: true
        storage_uri:
          type: string
          description: "Primary storage URI (GCS path)"
        thumb_uri:
          type: string
          description: "Thumbnail URI"
        tenant_id:
          type: string
          description: "Tenant identifier (pre-positioned for multi-tenant support)"
          nullable: true
        project_id:
          type: string
          description: "Project identifier (pre-positioned for multi-tenant support)"
          nullable: true
        asset_level: { type: integer, description: "Hierarchy depth (0 = root segment)" }
        parent_asset_id: { type: string, description: "Parent asset UUID for split/derived assets", nullable: true }
        root_asset_id: { type: string, description: "Root ancestor asset UUID", nullable: true }
        delivery_count: { type: integer, description: "Number of times this asset has been delivered" }
        last_delivered_at: { type: string, format: date-time, nullable: true }
        last_delivered_to: { type: string, description: "Last delivery customer ID", nullable: true }
        env: { type: string, description: "Environment tag (e.g. indoor, outdoor)" }
        task: { type: string, description: "Task identifier" }
        version: { type: integer, format: int64 }
        algo_results:
          type: object
          description: "Algorithm results from cf_algo JSONB (legacy, retained during dual-write)"
          additionalProperties: { type: string }
        tags:
          type: object
          description: "Free-form tags from cf_tag JSONB (legacy, retained during dual-write)"
          additionalProperties: { type: string }
        files:
          type: object
          description: "File references. Key = logical name, value = GCS URI"
          additionalProperties: { type: string }
        metadata:
          type: object
          description: "Structured metadata JSONB (new, Phase 2)"
          additionalProperties: true
        lifecycle_meta:
          type: object
          description: "Lifecycle metadata (retention_tier, archive_after_days, etc.)"
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    DeliveryCommitRequest:
      type: object
      required: [asset_ids, customer_id]
      properties:
        asset_ids:
          type: array
          minItems: 1
          items: { type: string }
        customer_id: { type: string }
        contract_id: { type: string }
        note: { type: string }
        owner: { type: string }
    StartAlgoRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, description: "Processing method identifier" }
        run_id: { type: string, description: "External orchestration run ID" }
    FinishAlgoRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, failed]
          description: "Algo completion status"
        output_uri:
          type: string
          description: "GCS URI of the output artifact (required when status=ok and algo requires URI)"
        run_id: { type: string, description: "External orchestration run ID" }
        reason:
          type: string
          description: "Failure reason (required when status=failed)"
        result_size_bytes:
          type: integer
          format: int64
          description: "Size of the result in bytes"
        extra_fields:
          type: object
          additionalProperties: true
          description: "Additional output fields required by the algo registry"
    AlgoLifecycleResponse:
      type: object
      properties:
        asset_id: { type: string }
        algo_key: { type: string }
        status: { type: string }
    AlgoEvent:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        algo_key: { type: string }
        prev_status: { type: string, nullable: true }
        new_status: { type: string }
        run_id: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AlgoEventListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AlgoEvent' }
    AssetEvent:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        event_seq: { type: integer, format: int64 }
        event_type: { type: string }
        payload_schema_version: { type: string }
        asset_id: { type: string, format: uuid }
        mcap_file_id: { type: string, format: uuid, nullable: true }
        event_source: { type: string }
        request_id: { type: string, nullable: true }
        publish_state: { type: string }
        event_payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        occurred_at: { type: string, format: date-time }
    AssetEventListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssetEvent' }
        limit:
          type: integer
        next_cursor:
          type: integer
          format: int64
          nullable: true
    TagUpsertRequest:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          description: "Registered tag key"
        value:
          type: string
          description: "Tag value"
    LakehouseReport:
      type: object
      description: Local Iceberg MVP report generated by the Spark lakehouse builder.
      properties:
        generated_at: { type: string, format: date-time }
        sync_mode: { type: string }
        sync_note: { type: string }
        tables:
          type: array
          items:
            type: object
            properties:
              table_name: { type: string }
              row_count: { type: integer }
        questions:
          type: object
          additionalProperties: true
    LakehouseStatus:
      type: object
      properties:
        enabled: { type: boolean }
        healthy: { type: boolean }
        catalog: { type: string }
        schema: { type: string }
        error: { type: string }
    LakehouseTableCount:
      type: object
      properties:
        table_name: { type: string }
        row_count: { type: integer, format: int64 }
    LakehouseTableListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LakehouseTableCount' }
    LakehouseItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    McapFile:
      type: object
      properties:
        mcap_file_id: { type: string }
        gcs_path: { type: string }
        size_bytes: { type: integer, format: int64 }
        raw_hash_md5: { type: string }
        ingest_state: { type: string, enum: [pending, summarized, failed] }
        start_timestamp_ns: { type: integer, format: int64 }
        end_timestamp_ns: { type: integer, format: int64 }
        channel_count: { type: integer }
        chunk_count: { type: integer }
        owner: { type: string }
        process_state:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }
paths:
  /api/v1/admin/search/reindex:
    post:
      summary: Rebuild Elasticsearch `assets` index from PostgreSQL
      description: >
        Scans all non-deleted assets and bulk-indexes documents. Does not modify
        `outbox_sink_cursors` or `asset_events.publish_state`. Requires `ADMIN_TOKEN` and reachable ES.
      security:
        - AdminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: false
                page_size:
                  type: integer
                  maximum: 500
                  default: 200
      responses:
        '200':
          description: Summary counters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: invalid or missing admin token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Elasticsearch not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/lakehouse/report:
    get:
      summary: Get local lakehouse MVP report
      description: Returns the latest Iceberg query report generated by `make iceberg-mvp` or `make iceberg-mvp-host`.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LakehouseReport' }
        '404':
          description: report not generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/lakehouse/status:
    get:
      summary: Get Trino lakehouse query status
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LakehouseStatus' }
  /api/v1/lakehouse/tables:
    get:
      summary: List Iceberg MVP table row counts via Trino
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LakehouseTableListResponse' }
        '503':
          description: trino disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/lakehouse/training-assets:
    get:
      summary: Query training snapshot assets via Trino
      parameters:
        - in: query
          name: snapshot_id
          schema: { type: string, default: mvp_hand_tracking_quality_v1 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LakehouseItemsResponse' }
  /api/v1/lakehouse/recompute-candidates:
    get:
      summary: Query historical assets that should be recomputed after an algorithm version change
      parameters:
        - in: query
          name: algo_key
          schema: { type: string, default: hand_tracking@1.2.0 }
        - in: query
          name: target_version
          schema: { type: string, default: next }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LakehouseItemsResponse' }
  /api/v1/lakehouse/tag-timeline:
    get:
      summary: Query tag current-state update timeline via Trino
      parameters:
        - in: query
          name: tag_key
          schema: { type: string, default: quality }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LakehouseItemsResponse' }
  /api/v1/lakehouse/quality-distribution:
    get:
      summary: Query MCAP segment quality distribution via Trino
      parameters:
        - in: query
          name: window
          schema: { type: string, enum: [30d], default: 30d }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LakehouseItemsResponse' }
  /api/v1/lakehouse/customer-replay:
    get:
      summary: Query customer delivery replay manifest via Trino
      parameters:
        - in: query
          name: customer_id
          schema: { type: string, default: 'urn:grace:customer:A' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LakehouseItemsResponse' }
  /api/v1/assets:
    get:
      summary: List assets with optional filtering and sorting
      parameters:
        - in: query
          name: mcap_file_id
          schema: { type: string }
          description: "Filter by MCAP file ID (backward compatible)"
        - in: query
          name: filter
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
          description: "Filter expressions in format field:op:value. Allowed fields: asset_id, mcap_file_id, status, lifecycle_state, reviewer, owner, type, asset_type, env, task, created_at, updated_at, start_timestamp_ns, end_timestamp_ns, duration_sec, duration_ms, delivery_count, last_delivered_to, last_delivered_at, version, retention_tier, expire_at, archive_after_days, delete_after_days, total_size_bytes, last_accessed_at, tenant_id, project_id, and dynamic prefixes tag.<key>, algo.<key>, files.<key>. Accepted aliases: tags.<key>, algo_results.<key>. Both legacy (status, type, duration_sec) and new (lifecycle_state, asset_type, duration_ms) field names are accepted during the dual-write period."
        - in: query
          name: sort_by
          schema: { type: string }
          description: "Sort field, prefix with - for descending. Uses the same field whitelist and aliases as filter. Default: -created_at"
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: ok
          headers:
            X-Request-ID: { $ref: '#/components/parameters/RequestIdHeader' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetListResponse' }
        '400':
          description: invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: internal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      summary: Create asset
      responses:
        '201': { description: created }
        '422':
          description: invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}:
    get:
      summary: Get asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      summary: Update asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: concurrent conflict (asset was modified between GET and PATCH)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Soft-delete asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
  /api/v1/assets/{id}/algo/{algo_key}/start:
    post:
      summary: Start algo processing on an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
          description: "Algo key in format name@version (e.g. hand_tracking@1.2.0)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAlgoRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlgoLifecycleResponse' }
        '400':
          description: "Invalid algo key (INVALID_ALGO_KEY)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Algo already running (ALGO_ALREADY_RUNNING) or invalid state transition (INVALID_STATE_TRANSITION) or concurrent conflict (CONCURRENT_CONFLICT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/algo/{algo_key}/finish:
    post:
      summary: Finish algo processing on an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
          description: "Algo key in format name@version (e.g. hand_tracking@1.2.0)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishAlgoRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlgoLifecycleResponse' }
        '400':
          description: "Invalid algo key (INVALID_ALGO_KEY)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Invalid state transition (INVALID_STATE_TRANSITION) or concurrent conflict (CONCURRENT_CONFLICT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: "Missing required field (MISSING_REQUIRED_FIELD) or missing reason (MISSING_REASON)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/algo/{algo_key}/reset:
    post:
      summary: Reset algo to pending for retry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
          description: "Algo key in format name@version (e.g. hand_tracking@1.2.0)"
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlgoLifecycleResponse' }
        '400':
          description: "Invalid algo key (INVALID_ALGO_KEY)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "Invalid state transition (INVALID_STATE_TRANSITION) or concurrent conflict (CONCURRENT_CONFLICT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/events:
    get:
      summary: List asset events for an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: event_type
          schema: { type: string }
          description: "Repeated filter; supports wildcard suffix such as algo_*"
        - in: query
          name: algo_key
          schema: { type: string }
          description: "Filter event_payload.algo_key"
        - in: query
          name: cursor
          schema: { type: integer, format: int64 }
          description: "Fetch older events with event_seq < cursor"
        - in: query
          name: before_event_seq
          schema: { type: integer, format: int64 }
          description: "Alias of cursor"
        - in: query
          name: after_event_seq
          schema: { type: integer, format: int64 }
          description: "Fetch events with event_seq > after_event_seq"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetEventListResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/tags:
    post:
      summary: Create or update a single tag on an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagUpsertRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: "Invalid tag (INVALID_TAG)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/tags/{key}:
    delete:
      summary: Delete a single tag from an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/tags/history:
    get:
      summary: List tag change history for an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: integer, format: int64 }
          description: "Fetch older events with event_seq < cursor"
        - in: query
          name: before_event_seq
          schema: { type: integer, format: int64 }
          description: "Alias of cursor"
        - in: query
          name: after_event_seq
          schema: { type: integer, format: int64 }
          description: "Fetch events with event_seq > after_event_seq"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetEventListResponse' }
        '404':
          description: "Asset not found (ASSET_NOT_FOUND)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/mcap-files:
    get:
      summary: List MCAP files with pagination
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/McapFile' }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }
        '500':
          description: internal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/mcap-files/{id}:
    get:
      summary: Get MCAP file by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/mcap/upload/finalize:
    post:
      summary: Finalize upload
      responses:
        '200': { description: ok }
  /api/v1/deliveries:
    post:
      summary: Commit delivery (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryCommitRequest' }
      responses:
        '201': { description: created }
        '409':
          description: idempotency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/deliveries/{id}:
    get:
      summary: Get delivery
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/deliveries/{id}/items:
    get:
      summary: List delivery items
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '500':
          description: internal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/customers/{customer_id}/deliveries:
    get:
      summary: List customer deliveries
      parameters:
        - in: path
          name: customer_id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200': { description: ok }
        '500':
          description: internal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets:batch_get:
    post:
      summary: Batch get assets by IDs
      description: >
        Retrieve multiple assets in a single request. Returns only found assets;
        missing IDs are silently skipped. Maximum 100 IDs per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_ids]
              properties:
                asset_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }
        '400':
          description: invalid request (empty or >100 IDs)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
