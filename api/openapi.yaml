        target: { type: string, description: Target workflow node id }
        kind:
          type: string
          enum: [runtime, dag, fallback]
          description: Edge origin. `dag` preserves logical dependencies such as failed upstream to omitted downstream steps.
    WorkflowNodeStatus:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string }
        type: { type: string, description: "Node type (Pod, StepGroup, DAG, etc.)" }
        templateName: { type: string }
        phase: { type: string, description: "Node phase (Running, Succeeded, Failed, Error, etc.)" }
        message: { type: string }
        inputs:
          type: object
          description: Argo node inputs, including parameters and artifacts.
          additionalProperties: true
        outputs:
          type: object
          description: Argo node outputs, including parameters and artifacts.
          additionalProperties: true
        resourcesDuration:
          type: object
          description: Argo resource duration counters for the node.
          additionalProperties: true
        hostNodeName: { type: string }
        podName: { type: string, description: Kubernetes pod name backing this Argo Pod node, when resolvable. }
        progress: { type: string, description: Node progress, e.g. 1/2 }
        estimatedDuration: { type: integer, format: int64, description: Estimated node duration in seconds }
        children:
          type: array
          items: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
