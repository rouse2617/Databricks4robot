  # ── Backfill jobs (batch asset processing) ────────────────────────────
  /api/v1/backfill:
    post:
      tags: [Backfill]
      summary: Create a new backfill job
      description: Creates a batch backfill job that processes multiple assets through a pipeline template.
      security:
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, templateId, assetIds]
              properties:
                name: { type: string, description: Job name }
                templateId: { type: string, description: Pipeline template ID }
                templateVersion: { type: integer, description: Optional template version lock }
                targetId: { type: string, description: Optional execution target ID/name used for each materialized pipeline run }
                pilotCount: { type: integer, description: Optional pilot gate size }
                assetIds:
                  type: array
                  items: { type: string }
                filterJson: { type: object, description: Asset filter criteria (JSON) }
                configSelection:
                  $ref: '#/components/schemas/DeployConfigSelection'
      responses:
        '201':
          description: Backfill job created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackfillJob' }
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Backfill]
      summary: List all backfill jobs
      security:
        - DatabrewToken: []
      responses:
        '200':
          description: Backfill job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BackfillJob' }
  /api/v1/backfill/{id}:
    get:
      tags: [Backfill]
      summary: Get a backfill job by ID
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Backfill job details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackfillJob' }
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/backfill/{id}/node-summary:
    get:
      tags: [Backfill]
      summary: Get batch node status summary
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Node summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchNodeSummary' }
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/backfill/{id}/node-failures:
    get:
      tags: [Backfill]
      summary: List batch items for a node status
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: pipelineNodeId
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, example: "Failed,Error" }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Node item page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchNodeFailureList' }
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/backfill/{id}/pause:
    post:
      tags: [Backfill]
      summary: Pause a running backfill job
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: job paused }
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/backfill/{id}/resume:
    post:
      tags: [Backfill]
      summary: Resume a paused backfill job
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: job resumed }
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/backfill/{id}/rerun:
    post:
      tags: [Backfill]
      summary: Rerun selected backfill items
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackfillRerunRequest' }
      responses:
        '200':
          description: Rerun accepted or dry-run result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackfillRerunResult' }
        '400':
          description: Invalid scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/backfill/{id}/continue-full:
    post:
      tags: [Backfill]
      summary: Continue full batch after pilot review
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Full batch resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: running }
        '400':
          description: Pilot is not awaiting review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/backfill/results:
    post:
      tags: [Backfill]
      summary: Register algorithm result JSON for a backfill asset
      description: Validates report manifest and upserts a staging row in algo_run_results.
      security:
        - DatabrewToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, reportId, version]
              properties:
                assetId: { type: string }
                reportId: { type: string, example: report.project@1.0.0-backfill-left-eye-only }
                version: { type: string, example: "1.0.0" }
                manifest:
                  type: object
                  additionalProperties: true
                  description: Optional manifest metadata; assetId must match when present
                result:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Result registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  assetId: { type: string }
                  reportId: { type: string }
                  version: { type: string }
                  algoKey: { type: string }
                  status: { type: string, example: registered }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Asset or report manifest not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/backfill/{id}/retry-failed:
    post:
      tags: [Backfill]
      summary: Retry all failed items in a backfill job
      security:
        - DatabrewToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Retry started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: retry started for N failed items }
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
