        checked_at: { type: string, format: date-time }
    LakehouseAssetGrowthItem:
      type: object
      properties:
        event_date: { type: string, example: '2026-05-12' }
        new_assets: { type: integer, format: int64 }
        cumulative_assets: { type: integer, format: int64 }
    LakehouseAssetGrowthResponse:
      type: object
      properties:
        days: { type: integer }
