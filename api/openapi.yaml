        - { name: lineage_with, in: query, schema: { type: string }, description: Asset ID used as lineage seed }
        - { name: lineage_direction, in: query, schema: { type: string, enum: [upstream, downstream, both], default: both } }
        - { name: lineage_depth, in: query, schema: { type: integer, default: 1, maximum: 3 } }
        - { name: relation_types, in: query, schema: { type: string }, description: Comma-separated or repeated relation types }
      responses:
