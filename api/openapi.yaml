          type: array
          items: { $ref: '#/components/schemas/PipelineComponentReleaseInput' }
    ComponentReleaseListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PipelineComponentRelease' }
    PortDef:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        desc: { type: string }
        default_value: { type: string }
    EnvVarDef:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
    WorkflowSummary:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        nodeCount: { type: integer }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    WorkflowDetail:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        message: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        estimatedDuration: { type: integer, format: int64, description: Estimated workflow duration in seconds }
        progress: { type: string, description: Workflow progress, e.g. 1/2 }
        nodes:
          type: array
          description: Runtime workflow nodes plus static pending DAG task placeholders for not-yet-started tasks.
          items: { $ref: '#/components/schemas/WorkflowNodeStatus' }
        edges:
          type: array
          description: Normalized workflow DAG edges between runtime nodes and static pending DAG task placeholders.
          items: { $ref: '#/components/schemas/WorkflowDagEdge' }
