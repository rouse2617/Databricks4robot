openapi: 3.1.0
info:
  title: cyber-databrew API
  version: 0.2.0
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - DatabrewToken: []
tags:
  - name: Auth
    description: Authentication endpoints (token-based login, session cookies)
  - name: Assets
    description: Asset CRUD, lifecycle, versioning, usage stats
  - name: AssetTypes
    description: Asset type metadata schemas
  - name: AssetTags
    description: Asset tag management (multi-source, history)
  - name: ActionAnnotations
    description: Time-bounded annotations on segment assets (moved from /actions)
  - name: AlgoRuns
    description: First-class algorithm execution events
  - name: LegacyAlgo
    description: Legacy per-asset algorithm lifecycle (deprecated, use AlgoRuns)
  - name: Queries
    description: Query IR execution and validation
  - name: SavedQueries
    description: Saved query management
  - name: Customers
    description: Customer/business partner references
  - name: Deliveries
    description: Delivery workflows (single-step, C2 two-step, cancel, ack, retry)
  - name: DeliveryRules
    description: Pre-delivery compliance gate rules
  - name: MCAPFiles
    description: MCAP file metadata and upload management
  - name: EvalMetrics
    description: Evaluation results and metric registry
  - name: Registry
    description: Read-only reference data (algo, tag, metric, action-label registries)
  - name: Search
    description: Elasticsearch sync status and progress
  - name: Lakehouse
    description: Data lakehouse reports and sync status
  - name: Audit
    description: Audit event search and asset lineage
  - name: Admin
    description: Admin-only operations (reindex, purge, outbox stats)
  - name: Internal
    description: Internal service-to-service endpoints
  - name: Infrastructure
    description: Health check, readiness, metrics, version info
  - name: Pipeline
    description: Pipeline orchestration (Argo Workflows)
  - name: Runs
    description: Product execution records served through the Run Kernel boundary, including the run ledger, runtime operations, and run tree projections
components:
  securitySchemes:
    DatabrewToken:
      type: apiKey
      in: header
      name: X-Databrew-Token
    DatabrewCIIngestToken:
      type: apiKey
      in: header
      name: X-Databrew-CI-Token
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
  parameters:
    RequestIdHeader:
      in: header
      name: X-Request-ID
      schema:
        type: string
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details:
          type: object
          additionalProperties: true
    WorkflowLogResponse:
      type: object
      required: [workflowName, nodeId, podName, container, source, logs, lineCount, truncated, truncation, pagination, window]
      properties:
        workflowName: { type: string }
        nodeId: { type: string }
        podName: { type: string }
        container: { type: string, example: main }
        source: { type: string, enum: [argo-live] }
        logs: { type: string }
        lineCount: { type: integer }
        truncated:
          type: boolean
          description: True when the server-side byte cap cut the returned log payload.
        nextCursor:
          type: string
          nullable: true
          description: Always null; live Argo logs do not provide stable cursor pagination.
        pagination:
          type: object
          required: [available, nextCursor]
          properties:
            available:
              type: boolean
              example: false
              description: Whether this log source can return another historical page through nextCursor.
            nextCursor:
              type: string
              nullable: true
              description: Cursor for the next historical window when available. Null for live Argo logs.
            reason:
              type: string
              example: live Argo logs do not provide stable historical cursor pagination
        window:
          type: object
          required: [mode, scope]
          properties:
            mode:
              type: string
              enum: [tail, since, cursor]
              example: tail
            tailLines: { type: integer, format: int64, example: 200 }
            limitBytes: { type: integer, format: int64, example: 262144 }
            sinceSeconds: { type: integer, format: int64, nullable: true }
            sinceTime: { type: string, format: date-time, nullable: true }
            previous: { type: boolean }
            timestamps: { type: boolean }
            scope:
              type: string
              example: bounded-live-window
        truncation:
          type: object
          required: [bounded, tailLines, maxTailLines, limitBytes, maxLimitBytes, bytesTruncated]
          properties:
            bounded: { type: boolean, example: true }
            tailLines: { type: integer, format: int64, example: 200 }
            maxTailLines: { type: integer, format: int64, example: 2000 }
            tailLinesClamped: { type: boolean }
            limitBytes: { type: integer, format: int64, example: 262144 }
            maxLimitBytes: { type: integer, format: int64, example: 2097152 }
            limitBytesClamped: { type: boolean }
            bytesTruncated: { type: boolean }
    ResourceValues:
      type: object
      properties:
        cpu: { type: string, example: 500m }
        memory: { type: string, example: 256Mi }
    ResourceUsageSource:
      type: object
      required: [workflow, metrics, spec]
      properties:
        workflow:
          type: string
          enum: [argo-live, unavailable]
          description: Source for workflow status and resource duration values.
        metrics:
          type: string
          enum: [unavailable]
          description: Live Kubernetes Metrics API source; unavailable until metrics integration is wired.
        spec:
          type: string
          enum: [stored-manifest, unavailable]
          description: Source for manifest-derived requests and limits.
    ResourceUsageReport:
      type: object
      required: [workflow_name, status, observed_at, source, live_metrics_available, pods]
      properties:
        deployment_id: { type: string }
        workflow_name: { type: string }
        status: { type: string }
        observed_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/ResourceUsageSource' }
        live_metrics_available:
          type: boolean
          description: False when live CPU/memory samples are not available.
        pods:
          type: array
          items:
            type: object
            properties:
              pod_name: { type: string }
              node_id: { type: string }
              node_name: { type: string }
              template_name: { type: string }
              observed_at: { type: string, format: date-time }
              live_metrics_available: { type: boolean }
              requests: { $ref: '#/components/schemas/ResourceValues' }
              limits: { $ref: '#/components/schemas/ResourceValues' }
              resource_duration:
                allOf:
                  - $ref: '#/components/schemas/ResourceValues'
                description: Argo resource duration, not live CPU/memory usage or billing.
              cpu_usage:
                type: string
                description: Deprecated compatibility alias for cpu_resource_duration; not live CPU usage.
              memory_usage:
                type: string
                description: Deprecated compatibility alias for memory_resource_duration; not live memory usage.
              cpu_resource_duration: { type: string }
              memory_resource_duration: { type: string }
              cpu_request: { type: string }
              memory_request: { type: string }
              cpu_limit: { type: string }
              memory_limit: { type: string }
    AssetID:
      type: string
      minLength: 8
      maxLength: 8
      pattern: '^[0-9A-Za-z]{8}$'
      description: Primary key for assets (8 alphanumeric ASCII characters).
    RunID:
      type: string
      minLength: 16
      maxLength: 16
      pattern: '^[0-9A-Za-z]{16}$'
      description: Primary key for algo_runs (16 alphanumeric ASCII characters).
    McapFileID:
      type: string
      minLength: 8
      maxLength: 8
      pattern: '^[0-9A-Za-z]{8}$'
      description: Primary key for mcap_files (same format as asset_id).
    ActionID:
      type: string
      minLength: 8
      maxLength: 8
      pattern: '^[0-9A-Za-z]{8}$'
      description: Primary key for actions (same format as asset_id).
    CustomerID:
      type: string
      description: Customer identifier (UUID or slug).

    # ── Asset ──────────────────────────────────────────────────────────────
    Asset:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        mcap_file_id: { $ref: '#/components/schemas/McapFileID' }
        segment_locator: { type: string, description: "Deterministic SHA-1 of mcap_file_id + start_ns + end_ns" }
        start_timestamp_ns: { type: integer, format: int64 }
        end_timestamp_ns: { type: integer, format: int64 }
        duration_sec: { type: number, format: double, description: "Legacy: duration in seconds (backward compat)" }
        duration_ms: { type: integer, format: int64 }
        lifecycle_state:
          type: string
          enum: [created, processing, ready, delivered, archived, superseded, failed, rejected]
        asset_type:
          type: string
          description: "Asset type (e.g. segment, clip, frame_set, derived_asset)."
        status: { type: string, description: "Legacy derived status (API-only, not stored). One of: approved, rejected, archived, superseded." }
        owner: { type: string }
        reviewer: { type: string }
        type: { type: string, description: "Legacy: mirrors asset_type." }
        retention_tier: { type: string }
        expire_at: { type: string, format: date-time, nullable: true }
        storage_uri: { type: string }
        thumb_uri: { type: string }
        asset_level: { type: integer }
        parent_asset_id: { $ref: '#/components/schemas/AssetID', nullable: true }
        root_asset_id: { $ref: '#/components/schemas/AssetID', nullable: true }
        split_method: { type: string, nullable: true }
        split_algo_name: { type: string, nullable: true }
        split_algo_version: { type: string, nullable: true }
        split_run_id: { type: string, nullable: true }
        split_reason: { type: string, nullable: true }
        segment_index: { type: integer, nullable: true }
        parent_start_offset_ms: { type: integer, format: int64, nullable: true }
        parent_end_offset_ms: { type: integer, format: int64, nullable: true }
        delivery_count: { type: integer }
        last_delivered_at: { type: string, format: date-time, nullable: true }
        last_delivered_to: { type: string, nullable: true }
        env: { type: string }
        task: { type: string }
        version: { type: integer, format: int64 }
        algo_results:
          type: object
          additionalProperties: { type: string }
        tags:
          type: object
          additionalProperties: { type: string }
          description: "Flat key→value map (last-write-wins). For multi-source use tags_detailed."
        tags_detailed:
          type: array
          items: { $ref: '#/components/schemas/AssetTag' }
        files:
          type: object
          additionalProperties: { type: string }
        files_json:
          type: object
          additionalProperties: true
          description: "JSONB alternative to files."
        algo_inputs_uris:
          type: object
          additionalProperties: { type: string }
        annot_inputs_uris:
          type: object
          additionalProperties: { type: string }
        metadata:
          type: object
          additionalProperties: true
        lifecycle_meta:
          type: object
          additionalProperties: true
        logical_asset_id: { type: string, nullable: true }
        revision: { type: integer, format: int64 }
        is_current: { type: boolean }
        tenant_id: { type: string, nullable: true }
        project_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    AssetTypeSchema:
      type: object
      description: JSON Schema definition for an asset type metadata object.
      additionalProperties: true

    # ── AssetMcapLocator ───────────────────────────────────────────────────
    AssetMcapLocator:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        lifecycle_state: { type: string }
        mcap:
          type: object
          properties:
            mcap_file_id: { $ref: '#/components/schemas/McapFileID' }
            mcap_uri: { type: string }
            size_bytes: { type: integer, format: int64 }
            raw_hash_md5: { type: string, nullable: true }
        window:
          type: object
          properties:
            start_timestamp_ns: { type: integer, format: int64 }
            end_timestamp_ns: { type: integer, format: int64 }
            duration_ms: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    # ── FoxgloveSource ─────────────────────────────────────────────────────
    FoxgloveSourceResponse:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        source_id: { type: string }
        ds: { type: string }
        ds_params:
          type: object
          additionalProperties: { type: string }
        hints:
          type: object
          additionalProperties: true
        expires_at: { type: string }

    # ── LogicalAsset ───────────────────────────────────────────────────────
    LogicalAsset:
      type: object
      properties:
        logical_asset_id: { type: string }
        asset_type: { type: string }
        display_name: { type: string }
        description: { type: string }
        owner: { type: string }
        status: { type: string }
        current_revision: { type: integer, format: int64 }
        total_revisions: { type: integer, format: int64 }
        metadata:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CurrentAssetResponse:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        revision: { type: integer, format: int64 }
        logical_asset_id: { type: string }
        asset_type: { type: string }
        owner: { type: string }
        lifecycle_state: { type: string }

    # ── Ratings History ────────────────────────────────────────────────────
    RatingsHistoryMetric:
      type: object
      properties:
        metric_key: { type: string }
        metric_type: { type: string }
        metric_unit: { type: string, nullable: true }
        metric_value: { type: number, format: double, nullable: true }
        metric_value_int: { type: integer, format: int64, nullable: true }
        metric_value_text: { type: string, nullable: true }
        metric_value_bool: { type: boolean, nullable: true }
        target_type: { type: string }
        target_id: { type: string }
        eval_name: { type: string }
        eval_version: { type: string }
        parameter_version: { type: string, nullable: true }
        run_id: { type: string, nullable: true }
        source_type: { type: string }
        source_name: { type: string, nullable: true }
        confidence: { type: number, format: double, nullable: true }
        recorded_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RatingsHistoryRevision:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        revision: { type: integer, format: int64 }
        is_current: { type: boolean }
        lifecycle_state: { type: string }
        created_at: { type: string, format: date-time }
        ratings:
          type: array
          items: { $ref: '#/components/schemas/RatingsHistoryMetric' }
    RatingsHistoryResponse:
      type: object
      properties:
        logical_asset_id: { type: string }
        asset_type: { type: string }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/RatingsHistoryRevision' }

    # ── AssetTag ───────────────────────────────────────────────────────────
    AssetTag:
      type: object
      properties:
        asset_id: { $ref: '#/components/schemas/AssetID' }
        tag_key: { type: string }
        tag_value: { type: string }
        tag_type: { type: string }
        source_type: { type: string }
        source_name: { type: string }
        source_version: { type: string }
        run_id: { type: string }
        confidence: { type: number, format: double, nullable: true }
        tenant_id: { type: string }
        project_id: { type: string }
        applied_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TagUpsertRequest:
      type: object
      properties:
        tag_key: { type: string }
        tag_value: { type: string }
        source_type: { type: string }
        source_name: { type: string }
        source_version: { type: string }
        run_id: { type: string }
    TagHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssetTag' }
        total: { type: integer }

    # ── AssetEvent ─────────────────────────────────────────────────────────
    AssetEvent:
      type: object
      properties:
        event_id: { type: string }
        event_seq: { type: integer, format: int64 }
        event_type: { type: string }
        aggregate_type: { type: string }
        asset_id: { $ref: '#/components/schemas/AssetID' }
        mcap_file_id: { type: string, nullable: true }
        tenant_id: { type: string, nullable: true }
        project_id: { type: string, nullable: true }
        event_source: { type: string }
        actor_type: { type: string, nullable: true }
        actor_id: { type: string, nullable: true }
        run_id: { type: string, nullable: true }
        event_payload:
          type: object
          additionalProperties: true
        payload_schema_version: { type: string }
        publish_state: { type: string }
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time, nullable: true }
        occurred_at: { type: string, format: date-time }
        retry_count: { type: integer }
    AssetEventListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssetEvent' }
        limit: { type: integer }
        next_cursor: { type: integer, format: int64, nullable: true }
    AssetEventSSEFrame:
      type: object
      properties:
        event_id: { type: string }
        event_seq: { type: integer, format: int64 }
        event_type: { type: string }
        asset_id: { $ref: '#/components/schemas/AssetID' }
        event_payload:
          type: object
          additionalProperties: true
        occurred_at: { type: string, format: date-time }

    # ── Action ─────────────────────────────────────────────────────────────
    Action:
      type: object
      properties:
        action_id: { $ref: '#/components/schemas/ActionID' }
        asset_id: { $ref: '#/components/schemas/AssetID' }
        start_ns: { type: integer, format: int64 }
        end_ns: { type: integer, format: int64 }
        action_index: { type: integer, nullable: true }
        primary_label: { type: string }
        labels:
          type: array
          items: { type: string }
        description: { type: string }
        attrs:
          type: object
          additionalProperties: true
        source_type: { type: string }
        source_name: { type: string }
        source_version: { type: string }
        run_id: { type: string }
        confidence: { type: number, format: double, nullable: true }
        external_id: { type: string }
        tenant_id: { type: string }
        project_id: { type: string }
        is_deleted: { type: boolean }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ActionCreateRequest:
      type: object
      required: [start_ns, end_ns]
      properties:
        start_ns: { type: integer, format: int64 }
        end_ns: { type: integer, format: int64 }
        action_index: { type: integer, nullable: true }
        primary_label: { type: string }
        labels:
          type: array
          items: { type: string }
        description: { type: string }
        attrs:
          type: object
          additionalProperties: true
        source_type: { type: string }
        source_name: { type: string }
        source_version: { type: string }
        run_id: { type: string }
        confidence: { type: number, format: double, nullable: true }
        external_id: { type: string }
    ActionPatchRequest:
      type: object
      properties:
        start_ns: { type: integer, format: int64 }
        end_ns: { type: integer, format: int64 }
        action_index: { type: integer, nullable: true }
        primary_label: { type: string }
        labels:
          type: array
          items: { type: string }
        description: { type: string }
        attrs:
          type: object
          additionalProperties: true
        source_type: { type: string }
        source_name: { type: string }
        source_version: { type: string }
        run_id: { type: string }
        confidence: { type: number, format: double, nullable: true }
        expected_version: { type: integer, format: int64 }
    ActionListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        total: { type: integer }

    # ── AlgoRun ────────────────────────────────────────────────────────────
    AlgoRun:
      type: object
      properties:
        run_id: { $ref: '#/components/schemas/RunID' }
        algo_name: { type: string }
        algo_version: { type: string }
        algo_kind: { type: string, description: "e.g. seg_runner, clip_runner, eval" }
        triggered_by: { type: string, description: "user_id or system" }
        status:
          type: string
          enum: [pending, running, ok, failed, cancelled]
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        duration_ns: { type: integer, format: int64, nullable: true }
        input_filter:
          type: object
          additionalProperties: true
          description: "Query IR filter used to select input assets."
        input_asset_ids:
          type: array
          items: { $ref: '#/components/schemas/AssetID' }
        params:
          type: object
          additionalProperties: true
        code_commit: { type: string, description: "Git commit SHA of algo code." }
        image_digest: { type: string, description: "Container image digest used." }
        pipeline_name: { type: string }
        pipeline_version: { type: string }
        assets_processed: { type: integer, nullable: true }
        assets_succeeded: { type: integer, nullable: true }
        assets_failed: { type: integer, nullable: true }
        actions_created: { type: integer, nullable: true }
        metrics_written: { type: integer, nullable: true }
        outputs:
          type: object
          additionalProperties: true
        cpu_seconds: { type: integer, format: int64, nullable: true }
        gpu_seconds: { type: integer, format: int64, nullable: true }
        cost_usd_micros: { type: integer, format: int64, nullable: true }
        error_class: { type: string }
        error_message: { type: string }
        external_runtime: { type: string, nullable: true, description: "External runtime identifier (e.g. dagster_run_id)." }
        external_url: { type: string, nullable: true }
        tenant_id: { type: string }
        project_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        row_version: { type: integer, format: int64 }
    AlgoRunListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AlgoRun' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    AlgoRunCreateRequest:
      type: object
      properties:
        algo_name: { type: string, example: "scene-detector" }
        algo_version: { type: string, example: "2.1.0" }
        algo_kind: { type: string, example: "seg_runner" }
        triggered_by: { type: string, example: "admin@cyberorigin.ai" }
        params:
          type: object
          additionalProperties: true
          example: { threshold: 0.85, max_scenes: 100 }
        input_filter:
          type: object
          additionalProperties: true
          example: { asset_type: "segment", lifecycle_state: "ready" }
        input_asset_ids:
          type: array
          items: { $ref: '#/components/schemas/AssetID' }
          uniqueItems: true
          description: "Optional explicit input asset IDs. Each ID must exist and must not be soft-deleted."
          example: ["a1b2c3d4", "e5f6g7h8"]
    AlgoRunStartRequest:
      type: object
      properties:
        code_commit: { type: string }
        image_digest: { type: string }
        pipeline_name: { type: string }
        pipeline_version: { type: string }
    AlgoRunFinishRequest:
      type: object
      properties:
        status: { type: string, enum: [ok, failed] }
        assets_processed: { type: integer }
        assets_succeeded: { type: integer }
        assets_failed: { type: integer }
        actions_created: { type: integer }
        metrics_written: { type: integer }
        outputs:
          type: object
          additionalProperties: true
        cpu_seconds: { type: integer, format: int64 }
        gpu_seconds: { type: integer, format: int64 }
        cost_usd_micros: { type: integer, format: int64 }
        error_class: { type: string }
