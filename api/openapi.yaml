  /api/v1/lakehouse/sync-progress:
    get:
      summary: PG→Bronze watermark-based sync progress (O(1) queries)
      description: |
        Returns 4 watermark fields for the PG → Iceberg Bronze pipeline (Cloud
        Run Job `bronze-incremental`). All values are cheap to compute even at
        50B+ rows: `outbox_published_max_seq` is a PG index lookup,
        `bronze_max_event_seq` and `bronze_last_ingested_at` come from Iceberg
        metadata via BigQuery without scanning parquet. Also sets Prometheus
        gauges `lakehouse_bronze_max_event_seq`, `lakehouse_bronze_lag_events`,
        `lakehouse_bronze_last_ingested_unix_seconds`.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BronzeSyncProgressResponse' }
        '503':
          description: bigquery or postgres unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
