        '200':
          description: deleted
  /api/v1/internal/assets/{id}:
    delete:
      summary: Hard delete a single asset and all of its child rows
      description: >
        Privileged maintenance endpoint guarded by `X-Grace-Token`. Removes the
        asset row along with referencing rows in `asset_metrics`,
        `asset_eval_results`, `asset_algo_events`, `asset_algo_latest`,
        `asset_tags`, `actions`, `delivery_items`, `asset_relations` and
        `asset_events`. Returns `404` when the asset is not found. The
        associated `mcap_files` row is left in place — use the batch endpoint
        with `include_mcap_files=true` when you also want to drop mcap files.
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                type: object
                required: [asset_id, deleted]
                properties:
                  asset_id: { $ref: '#/components/schemas/AssetID' }
                  deleted: { $ref: '#/components/schemas/PurgeCounts' }
        '400':
          description: invalid asset id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: invalid or missing token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: asset not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/internal/assets:batch_delete:
    post:
      summary: Hard delete a batch of assets (and optionally their mcap_files)
      description: >
        Privileged maintenance endpoint guarded by `X-Grace-Token`. Exactly
        one of `asset_ids` or `import_batch` must be set. Deletions run in
        chunks of `chunk_size` ids (default `1000`), each chunk inside its
        own PostgreSQL transaction so progress survives partial failures and
        the CDC consumer can ingest deletes incrementally into Elasticsearch.
        Use `dry_run=true` to preview the per-table counts that would be
        deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteRequest' }
      responses:
        '200':
          description: counts of deleted (or to-be-deleted, when dry_run) rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchPurgeResponse' }
        '400':
          description: invalid request body, or neither/both of asset_ids and import_batch supplied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: invalid or missing token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: persistence error (for example an mcap_file is still referenced by an asset that was not part of the purge)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/admin/search/reindex:
    post:
      summary: Rebuild Elasticsearch `assets` index from PostgreSQL
      description: >
        Scans all non-deleted assets and bulk-indexes documents. Does not modify
        `asset_events` rows. Uses the normal `X-Grace-Token` auth path for now
        and requires reachable ES. When the `assets` index does not exist yet,
        the initial delete-by-query step treats HTTP 404 as zero deletions so the
        bulk index can proceed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: false
                page_size:
                  type: integer
                  maximum: 500
                  default: 200
      responses:
        '200':
          description: Summary counters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchReindexResponse' }
        '401':
          description: invalid or missing admin token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Elasticsearch not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/admin/search/reindex-jobs:
    post:
      summary: Create asynchronous Elasticsearch reindex job
      description: >
        Creates a background PG->ES reindex job. Supports `dry_run` preview,
        stop, and resume from checkpoint. Returns the created job immediately.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: false
                page_size:
                  type: integer
                  maximum: 500
                  default: 200
      responses:
        '202':
          description: job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchReindexJob' }
        '401':
          description: invalid or missing token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Elasticsearch or job repository not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      summary: List recent asynchronous reindex jobs
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: recent jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchReindexJobListResponse' }
        '401':
          description: invalid or missing token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/admin/search/reindex-jobs/{id}:
    get:
      summary: Get one asynchronous reindex job
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: job detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchReindexJob' }
        '401':
          description: invalid or missing token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/admin/search/reindex-jobs/{id}/stop:
    post:
      summary: Request stop for asynchronous reindex job
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '202':
          description: stop requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchReindexJob' }
        '401':
          description: invalid or missing token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/admin/search/reindex-jobs/{id}/resume:
    post:
      summary: Resume paused/failed asynchronous reindex job from checkpoint
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '202':
          description: job resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchReindexJob' }
        '400':
          description: job is not resumable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: invalid or missing token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/admin/search/outbox-stats:
    get:
      summary: Outbox publish_state counts and DLQ archive size (read-only)
      description: >
        Returns `SELECT publish_state, COUNT(*) FROM asset_events GROUP BY publish_state`
