          $ref: '#/components/schemas/WorkflowNodeDebugCapabilities'
    WorkflowNodeDebugCapabilities:
      type: object
      properties:
        execEnabled: { type: boolean, description: Whether Pod terminal exec is enabled for this node and target. }
        logStreamEnabled: { type: boolean }
        metricsEnabled: { type: boolean }
        costEnabled: { type: boolean }
        reason: { type: string, description: Human-readable terminal availability reason. }
        allowedCommands:
          type: array
          items: { type: string }
        maxSessionSeconds: { type: integer }
    WorkflowNodePodDiagnostics:
      type: object
      required: [namespace, podName, restartCount, containers, podConditions, podEvents]
      properties:
        cluster: { type: string, description: Optional Kubernetes cluster display label }
        namespace: { type: string, description: Kubernetes namespace }
        podName: { type: string, description: Kubernetes Pod name backing this workflow node }
        podIp: { type: string, description: Kubernetes Pod IP }
        serviceAccountName: { type: string, description: Pod service account name }
        restartCount: { type: integer, format: int32, description: Sum of all container restart counts }
        containers:
          type: array
          items: { $ref: '#/components/schemas/WorkflowNodePodContainer' }
        podConditions:
          type: array
          items: { $ref: '#/components/schemas/WorkflowNodePodCondition' }
        podEvents:
          type: array
          items: { $ref: '#/components/schemas/WorkflowNodePodEvent' }
    CreatePodTerminalSessionRequest:
      type: object
      properties:
        containerName:
          type: string
          description: Optional container name. Defaults to the workflow node's main container when omitted.
        command:
          type: string
          description: Allowed command preset such as `sh`, `pwd`, `ls`, or `env`.
          default: sh
    PodTerminalSession:
      type: object
      required: [id, workflowName, nodeId, podName, namespace, command, status, expiresAt, createdAt]
      properties:
        id: { type: string }
        runId: { type: string }
        workflowName: { type: string }
        nodeId: { type: string }
        podName: { type: string }
        containerName: { type: string }
        executionTargetId: { type: string }
        cluster: { type: string }
        namespace: { type: string }
        command: { type: string }
        status:
          type: string
          enum: [created, attached, terminated, failed, timed_out]
        attachUrl:
          type: string
          description: One-time backend attach URL. Does not expose Kubernetes credentials.
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        attachedAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        errorCode: { type: string }
        errorMessage: { type: string }
    WorkflowNodePodContainer:
      type: object
      required: [name, ready, restartCount]
      properties:
        name: { type: string }
        image: { type: string }
        ready: { type: boolean }
        restartCount: { type: integer, format: int32 }
        state: { type: string, description: Running, Waiting, Terminated, or empty when unknown }
    WorkflowNodePodCondition:
      type: object
      required: [type, status]
      properties:
        type: { type: string }
        status: { type: string }
        reason: { type: string }
        message: { type: string }
        lastTransitionTime: { type: string, format: date-time, nullable: true }
    WorkflowNodePodEvent:
      type: object
      required: [type, reason, message]
      properties:
        type: { type: string }
        reason: { type: string }
        message: { type: string }
        count: { type: integer, format: int32 }
        firstTimestamp: { type: string, format: date-time, nullable: true }
        lastTimestamp: { type: string, format: date-time, nullable: true }
    WorkflowOperationResponse:
      type: object
      properties:
        message:
          type: string
          example: ok
        workflowName:
          type: string
          description: Newly created workflow name when the operation creates one, such as resubmit.
        pipelineRunId:
          type: string
          description: DataBrew pipeline run id created for the new workflow when available.
    BackfillJob:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        templateId: { type: string }
        templateVersion: { type: integer, nullable: true }
        filterJson: { type: object, nullable: true }
        totalCount: { type: integer }
        completedCount: { type: integer }
        failedCount: { type: integer }
        pilotCount: { type: integer }
        pilotPhase: { type: string, description: "none | running | review | done" }
        status: { type: string, description: "running | paused | completed | failed" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BackfillItem:
      type: object
      properties:
        id: { type: string }
        jobId: { type: string }
        assetId: { type: string }
        status: { type: string, description: "pending | running | completed | failed | cancelled" }
        workflowName: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    BatchNodeSummary:
      type: object
      properties:
        batchJobId: { type: string }
        templateId: { type: string }
        templateVersion: { type: integer, nullable: true }
        subtasks:
          type: object
          properties:
            total: { type: integer }
            completed: { type: integer }
            failed: { type: integer }
            running: { type: integer }
            pending: { type: integer }
            paused: { type: boolean }
        nodes:
          type: array
          items:
            type: object
            properties:
              pipelineNodeId: { type: string }
              displayName: { type: string }
              dagOrder: { type: integer }
              counts:
                type: object
                additionalProperties: { type: integer }
              attempted: { type: integer }
              failureRate: { type: number, format: double }
        dataCoverage:
          type: object
          properties:
            runsWithNodeRows: { type: integer }
            runsTotal: { type: integer }
            complete: { type: boolean }
        generatedAt: { type: string, format: date-time }
    BatchNodeFailureList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              backfillItemId: { type: string }
              assetId: { type: string }
              runId: { type: string }
              workflowName: { type: string }
              pipelineNodeId: { type: string }
              displayName: { type: string }
              status: { type: string }
              message: { type: string }
              startedAt: { type: string, format: date-time, nullable: true }
              finishedAt: { type: string, format: date-time, nullable: true }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    BackfillRerunRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [failed, pending, incomplete, completed, custom, node_failed]
        templateId: { type: string }
        templateVersion: { type: integer }
        itemIds:
          type: array
          items: { type: string }
        assetIds:
          type: array
          items: { type: string }
        pipelineNodeId: { type: string }
        dryRun: { type: boolean }
    BackfillRerunResult:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, partial_success, succeeded, failed, noop]
        dryRun: { type: boolean }
        matchedCount: { type: integer }
        retriedCount: { type: integer }
        templateId: { type: string }
        templateVersion: { type: integer, nullable: true }
        skipped:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string }
              reason: { type: string }

paths:
  # ── Infrastructure ────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [Infrastructure]
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
  /readyz:
    get:
      tags: [Infrastructure]
      summary: Readiness check (PG ping)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      healthy: { type: boolean }
                  checks:
                    type: object
                    properties:
                      pg:
                        type: object
                        properties:
                          status: { type: string }
                          error: { type: string }
                      lakehouse:
                        type: object
                        properties:
                          status: { type: string }
                          backend: { type: string }
                          project: { type: string }
                          dataset: { type: string }
        '503':
          description: Not ready
  /version:
    get:
      tags: [Infrastructure]
      summary: Version info
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  commit: { type: string }
                  time: { type: string }
                  service: { type: string }
  /metrics:
    get:
      tags: [Infrastructure]
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus metrics

  # ── Auth ───────────────────────────────────────────────────────────────
  /api/v1/auth/email-login:
    post:
      tags: [Auth]
      summary: Login with email and issue JWT session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailLoginRequest' }
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly databrew_session JWT cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: Missing or invalid email
        '401':
          description: Email domain not allowed
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with Grace Token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: Missing token
        '401':
          description: Invalid token
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Check current auth session
      responses:
        '200':
          description: Auth status
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (clear session cookie)
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }

  # ── Assets ─────────────────────────────────────────────────────────────
  /api/v1/assets:
    post:
      tags: [Assets]
      summary: Create asset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRequest' }
      responses:
        '201': { description: Created }
        '422':
          description: Invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}:
    get:
      tags: [Assets]
      summary: Get asset by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Assets]
      summary: Update asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Concurrent conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Assets]
      summary: Soft-delete asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets:batch_get:
    post:
      tags: [Assets]
      summary: Batch get assets by IDs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchGetAssetsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }

  /api/v1/asset-types/{type}/schema:
    get:
      tags: [AssetTypes]
      summary: Get asset type metadata schema
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JSON Schema for assets.metadata of the requested asset type.
          content:
            application/schema+json:
              schema: { $ref: '#/components/schemas/AssetTypeSchema' }
            application/json:
              schema: { $ref: '#/components/schemas/AssetTypeSchema' }
        '404':
          description: Asset type schema not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/mcap-locator:
    get:
      tags: [Assets]
      summary: Get MCAP locator for asset preview/streaming
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetMcapLocator' }
  /api/v1/assets/{id}/foxglove-source:
    get:
      tags: [Assets]
      summary: Get Foxglove streaming source
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoxgloveSourceResponse' }
  /api/v1/assets/{id}/deliveries:
    get:
      tags: [Assets]
      summary: List deliveries for an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryListResponse' }
  /api/v1/assets/{id}/events:
    get:
      tags: [Assets]
      summary: List asset events
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: query
          name: before_seq
          schema: { type: integer, format: int64 }
        - in: query
          name: after_seq
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetEventListResponse' }
  /api/v1/assets/{id}/events/stream:
    get:
      tags: [Assets]
      summary: Stream asset events (SSE)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  event_id: { type: string }
                  event_seq: { type: integer, format: int64 }
                  event_type: { type: string }
                  asset_id: { $ref: '#/components/schemas/AssetID' }
                  event_payload:
                    type: object
                    additionalProperties: true
                  occurred_at: { type: string, format: date-time }
  /api/v1/assets/{id}/lineage:
    get:
      tags: [Assets]
      summary: Get asset lineage (upstream/downstream)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineageResponse' }
  /api/v1/assets/{id}/provenance:
    get:
      tags: [Assets]
      summary: Get asset provenance chain
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetProvenanceResponse' }
  /api/v1/assets/{id}/timeline:
    get:
      tags: [Assets]
      summary: Get asset timeline (event/time-based activity)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
  /api/v1/assets/{id}/view:
    post:
      tags: [Assets]
      summary: Record asset view (usage stats)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: Recorded
  /api/v1/assets/{id}/favorite:
    post:
      tags: [Assets]
      summary: Toggle asset favorite status
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: Toggled
  /api/v1/assets/{id}/revisions:
    post:
      tags: [Assets]
      summary: Promote asset revision
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteRevisionRequest' }
      responses:
        '200':
          description: Revision promoted

  # ── Layered child-asset creation (CYB-1222) ──────────────────────────────
  /api/v1/assets/{id}/clips:
    post:
      tags: [Assets]
      summary: Create clip asset under a segment parent
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildAssetCreateRequest' }
      responses:
        '201':
          description: Clip asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '422':
          description: Hierarchy violation or invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/frames:
    post:
      tags: [Assets]
      summary: Create frame asset under a segment parent
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildAssetCreateRequest' }
      responses:
        '201':
          description: Frame asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '422':
          description: Hierarchy violation or invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/tasks:
    post:
      tags: [Assets]
      summary: Create task asset under a segment or task parent
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildAssetCreateRequest' }
      responses:
        '201':
          description: Task asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '422':
          description: Hierarchy violation or invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/assets/{id}/actions:
    post:
      tags: [Assets]
      summary: Create action-type child asset under a parent (layered creation, CYB-1228)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildAssetCreateRequest' }
      responses:
        '201':
          description: Action child asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '422':
          description: Hierarchy violation or invalid domain state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/logical-assets/{id}/current:
    get:
      tags: [Assets]
      summary: Get current revision for logical asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentAssetResponse' }
  /api/v1/logical-assets/{id}/ratings-history:
    get:
      tags: [Assets]
      summary: Get ratings history for a logical asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingsHistoryResponse' }
  /api/v1/events:
    get:
      tags: [Assets]
      summary: List global asset events
      parameters:
        - in: query
          name: before_seq
          schema: { type: integer, format: int64 }
        - in: query
          name: after_seq
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: event_types
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetEventListResponse' }

  # ── AssetTags ──────────────────────────────────────────────────────────
  /api/v1/assets/{id}/tags:
    post:
      tags: [AssetTags]
      summary: Upsert a tag on an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagUpsertRequest' }
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetTag' }
  /api/v1/assets/{id}/tags/{key}:
    delete:
      tags: [AssetTags]
      summary: Delete a tag by key
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
  /api/v1/assets/{id}/tags/history:
    get:
      tags: [AssetTags]
      summary: List tag history for an asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagHistoryResponse' }

  # ── ActionAnnotations ────────────────────────────────────────────────────
  /api/v1/assets/{id}/action-annotations:
    post:
      tags: [ActionAnnotations]
      summary: Create action annotation on asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
    get:
      tags: [ActionAnnotations]
      summary: List action annotations on asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionListResponse' }
  /api/v1/assets/{id}/action-annotations/{action_id}:
    patch:
      tags: [ActionAnnotations]
      summary: Patch action annotation
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: action_id
          required: true
          schema: { $ref: '#/components/schemas/ActionID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionPatchRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
    delete:
      tags: [ActionAnnotations]
      summary: Soft-delete action annotation
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: action_id
          required: true
          schema: { $ref: '#/components/schemas/ActionID' }
      responses:
        '204':
          description: Deleted

  # ── LegacyAlgo (deprecated) ───────────────────────────────────────────
  /api/v1/assets/{id}/algo:
    get:
      tags: [LegacyAlgo]
      summary: List current algo statuses for asset (deprecated)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/AlgoLifecycleResponse'
  /api/v1/assets/{id}/algo/{algo_key}/start:
    post:
      tags: [LegacyAlgo]
      summary: Start a legacy algo on asset (deprecated, use AlgoRuns)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/AssetID' }
        - in: path
          name: algo_key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAlgoRequest' }
      responses:
        '200':
          description: Started
  /api/v1/assets/{id}/algo/{algo_key}/finish:
    post:
      tags: [LegacyAlgo]
