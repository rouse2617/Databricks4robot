; PgBouncer configuration — transaction pooling for local dev
; Design reference: data-platform-design.md §6.3

[databases]
data4cyber = host=postgres port=5432 dbname=data4cyber

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling — connections are returned to the pool after each transaction.
; This is the most efficient mode and matches the design requirement.
pool_mode = transaction

; Pool sizing (design: default_pool_size=25, reserve_pool=10, max_client_conn=1000)
; Local dev uses smaller values; production follows §6.3 defaults.
default_pool_size = 20
max_client_conn = 100
reserve_pool_size = 5

; Timeouts
server_idle_timeout = 600
client_idle_timeout = 0

; Logging
log_connections = 1
log_disconnections = 1

; Admin access (local dev only)
admin_users = postgres
stats_users = postgres
