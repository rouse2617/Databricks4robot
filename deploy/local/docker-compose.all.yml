# docker-compose.all.yml — Full stack: Postgres + Backend + Frontend + Iceberg + Trino
# Usage: docker compose -f docker-compose.all.yml up -d --build

services:
  # ── Data Layer ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: data4cyber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (Go) ────────────────────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENV: development
      PORT: "8080"
      STORAGE_BACKEND: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: data4cyber
      GRACE_TOKEN: dev-token
      TRINO_ENABLED: "false"
      OPENSEARCH_URL: "http://opensearch:9200"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (React + Nginx) ────────────────────────────────
  frontend:
    build:
      context: ../../Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Iceberg Stack ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    volumes:
      - iceberg-minio-data:/data
    networks:
      default:
        aliases:
          - warehouse.minio

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin password; do
        echo 'waiting for minio...';
        sleep 1;
      done;
      mc mb --ignore-existing local/warehouse;
      mc mb --ignore-existing local/datalake;
      "
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8183:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000

  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    depends_on:
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8889:8888"
      - "8083:8080"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./iceberg/notebooks:/home/iceberg/notebooks/notebooks

  trino:
    image: trinodb/trino:latest
    depends_on:
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8082:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro

  # ── OpenSearch (Search) ──────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  iceberg-minio-data:
  opensearch-data:
