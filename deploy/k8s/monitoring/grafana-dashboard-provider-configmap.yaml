apiVersion: v1
kind: ConfigMap
metadata:
  name: cyber-databrew-grafana-dashboard-provider
  labels:
    app.kubernetes.io/name: cyber-databrew-monitoring
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: cyber-databrew
        orgId: 1
        folder: Cyber Databrew
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
