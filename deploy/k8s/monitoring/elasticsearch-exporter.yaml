# Scrapes Elasticsearch for Prometheus via elasticsearch-exporter.
# Defaults to in-cluster Service/elasticsearch; credentials are optionally
# sourced from cyber-databrew-secrets when present.
apiVersion: v1
kind: Service
metadata:
  name: cyber-databrew-elasticsearch-exporter
  labels:
    app.kubernetes.io/name: cyber-databrew-monitoring
    app.kubernetes.io/component: elasticsearch-exporter
spec:
  ports:
    - name: metrics
      port: 9114
      targetPort: metrics
  selector:
    app.kubernetes.io/name: cyber-databrew-monitoring
    app.kubernetes.io/component: elasticsearch-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-databrew-elasticsearch-exporter
  labels:
    app.kubernetes.io/name: cyber-databrew-monitoring
    app.kubernetes.io/component: elasticsearch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-databrew-monitoring
      app.kubernetes.io/component: elasticsearch-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-databrew-monitoring
        app.kubernetes.io/component: elasticsearch-exporter
    spec:
      containers:
        - name: elasticsearch-exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
          env:
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cyber-databrew-secrets
                  key: ELASTICSEARCH_USERNAME
                  optional: true
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cyber-databrew-secrets
                  key: ELASTICSEARCH_PASSWORD
                  optional: true
          args:
            - --es.uri=http://elasticsearch:9200
            - --es.all
            - --es.indices
            - --es.indices_settings
            - --es.shards
            - --collector.clustersettings
            - --es.timeout=15s
            - --web.listen-address=:9114
          ports:
            - name: metrics
              containerPort: 9114
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
