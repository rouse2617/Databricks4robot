apiVersion: v1
kind: Service
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: trino
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: trino
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-databrew
      app.kubernetes.io/component: trino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-databrew
        app.kubernetes.io/component: trino
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-nessie
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://nessie:9000/q/health/live >/dev/null 2>&1; do
                echo waiting for nessie...
                sleep 3
              done
      containers:
        - name: trino
          image: trinodb/trino:476
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: catalog
              mountPath: /etc/trino/catalog
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              memory: "4Gi"
      volumes:
        - name: catalog
          configMap:
            name: trino-catalog-iceberg-minio
