apiVersion: v1
kind: Service
metadata:
  name: nessie
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: nessie
spec:
  ports:
    - name: http
      port: 19120
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
  selector:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: nessie
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: nessie
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-databrew
      app.kubernetes.io/component: nessie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-databrew
        app.kubernetes.io/component: nessie
    spec:
      containers:
        - name: nessie
          image: ghcr.io/projectnessie/nessie:0.104.3
          ports:
            - containerPort: 19120
              name: http
            - containerPort: 9000
              name: management
          env:
            - name: QUARKUS_HTTP_PORT
              value: "19120"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
