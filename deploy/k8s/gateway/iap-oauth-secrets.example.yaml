apiVersion: v1
kind: Secret
metadata:
  name: iap-oauth-cyber-databrew-dev-frontend
  namespace: cyber-databrew-dev
type: Opaque
stringData:
  # GKE IAP expects the key name to be literally `key`.
  key: REPLACE_WITH_IAP_OAUTH_CLIENT_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: iap-oauth-cyber-databrew-dev-api
  namespace: cyber-databrew-dev
type: Opaque
stringData:
  key: REPLACE_WITH_IAP_OAUTH_CLIENT_SECRET
