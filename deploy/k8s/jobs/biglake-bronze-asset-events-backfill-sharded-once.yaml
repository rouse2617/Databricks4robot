# One-off parallel backfill (low-cost): run N shards in parallel.
#
# Reuses ConfigMap script from:
#   deploy/k8s/jobs/biglake-bronze-asset-events-backfill-once.yaml
#
# Important:
# - Apply the base file once first so the ConfigMap/ServiceAccount exist.
# - This manifest only creates the sharded Job.
#
# Run:
#   kubectl apply -f deploy/k8s/jobs/biglake-bronze-asset-events-backfill-once.yaml -n cyber-databrew-dev
#   kubectl apply -f deploy/k8s/jobs/biglake-bronze-asset-events-backfill-sharded-once.yaml -n cyber-databrew-dev
#   kubectl logs -n cyber-databrew-dev job/biglake-bronze-asset-events-backfill-sharded-once -f
#
# Tune:
# - SHARD_COUNT (default 8 here)
# - BATCH_SIZE (default 20000 here)
# - UPPER_SEQ optional fixed boundary; leave empty to backfill all > bronze_max_seq
apiVersion: batch/v1
kind: Job
metadata:
  name: biglake-bronze-asset-events-backfill-sharded-once
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: biglake-backfill
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 8
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-databrew
        app.kubernetes.io/component: biglake-backfill
    spec:
      restartPolicy: Never
      serviceAccountName: cyber-databrew-dev-biglake-smoke
      containers:
        - name: backfill
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: biglake-user-token
                  key: ACCESS_TOKEN
                  optional: true
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cyber-databrew-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: cyber-databrew-secrets
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cyber-databrew-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cyber-databrew-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: cyber-databrew-secrets
                  key: DB_NAME
            - name: BATCH_SIZE
              value: "20000"
            - name: SHARD_COUNT
              value: "8"
            - name: SHARD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: UPPER_SEQ
              value: ""
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: script
              mountPath: /scripts
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir --quiet "pyiceberg[pyarrow,gcsfs]" google-auth requests psycopg2-binary
              python /scripts/backfill.py
      volumes:
        - name: script
          configMap:
            name: biglake-bronze-asset-events-backfill-script
            defaultMode: 0444
