# One-off Job: PyIceberg append against GCP Lakehouse REST Catalog from inside the cluster
# (bypasses local proxy / RAPT issues). Uses a dedicated KSA in cyber-databrew-dev.
#
# Workload Identity (required — without this, Pod logs show 403 on metadata token exchange):
#   Ask a project IAM admin to run once:
#
#     # 0) create dedicated GSA (only once, if not exists)
#     gcloud iam service-accounts create cyber-databrew-dev \
#       --project=green-valley-442103 \
#       --display-name="cyber-databrew dev workload identity"
#
#     # 1) allow this KSA to impersonate the GSA
#     gcloud iam service-accounts add-iam-policy-binding \
#       cyber-databrew-dev@green-valley-442103.iam.gserviceaccount.com \
#       --project=green-valley-442103 \
#       --role=roles/iam.workloadIdentityUser \
#       --member="serviceAccount:green-valley-442103.svc.id.goog[cyber-databrew-dev/cyber-databrew-dev-biglake-smoke]"
#
#   Verify: `gcloud iam service-accounts get-iam-policy cyber-databrew-dev@...` should list the binding above.
#
# Prereq: the bound GCP service account needs at least:
#   - roles/biglake.editor (or admin) on project green-valley-442103
#   - roles/storage.objectUser on gs://cyber-databrew-iceberg-warehouse-prod
#
#     # 2) grant minimum data-plane roles to GSA
#     gcloud projects add-iam-policy-binding green-valley-442103 \
#       --member="serviceAccount:cyber-databrew-dev@green-valley-442103.iam.gserviceaccount.com" \
#       --role="roles/biglake.editor"
#
#     gcloud storage buckets add-iam-policy-binding gs://cyber-databrew-iceberg-warehouse-prod \
#       --member="serviceAccount:cyber-databrew-dev@green-valley-442103.iam.gserviceaccount.com" \
#       --role="roles/storage.objectUser"
#
# Apply:
#   kubectl apply -f deploy/k8s/jobs/biglake-iceberg-smoke.yaml -n cyber-databrew-dev
# Watch:
#   kubectl logs -n cyber-databrew-dev job/biglake-iceberg-smoke -f
# Cleanup:
#   kubectl delete -f deploy/k8s/jobs/biglake-iceberg-smoke.yaml -n cyber-databrew-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyber-databrew-dev-biglake-smoke
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: biglake-smoke
  annotations:
    iam.gke.io/gcp-service-account: cyber-databrew-dev@green-valley-442103.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: biglake-iceberg-smoke-script
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: biglake-smoke
data:
  smoke.py: |
    import os
    import google.auth
    import google.auth.transport.requests
    import pyarrow as pa
    from pyiceberg.catalog import load_catalog

    PROJECT = "green-valley-442103"
    BUCKET = "cyber-databrew-iceberg-warehouse-prod"

    token = os.environ.get("ACCESS_TOKEN", "").strip()
    if not token:
        creds, _ = google.auth.default(
            scopes=["https://www.googleapis.com/auth/cloud-platform"]
        )
        creds.refresh(google.auth.transport.requests.Request())
        token = creds.token

    catalog = load_catalog(
        "biglake",
        **{
            "type": "rest",
            "uri": "https://biglake.googleapis.com/iceberg/v1/restcatalog",
            "warehouse": f"gs://{BUCKET}",
            "token": token,
            "header.x-goog-user-project": PROJECT,
            # Use fsspec backend so we can pass short-lived user token directly
            # (`gcs.oauth2.token`) as a temporary workaround when WI binding is pending.
            "py-io-impl": "pyiceberg.io.fsspec.FsspecFileIO",
            "gcs.project-id": PROJECT,
            "gcs.oauth2.token": token,
        },
    )

    table = catalog.load_table("poc_smoke.hello")
    table.append(
        pa.table({"id": [901, 902], "name": ["from-gke-job", "from-gke-job-2"]})
    )
    scan = table.scan().to_arrow()
    print("APPEND_OK rows_total=", scan.num_rows)
    print("APPEND_OK last_rows=", scan.slice(max(0, scan.num_rows - 8), 8).to_pylist())
---
apiVersion: batch/v1
kind: Job
metadata:
  name: biglake-iceberg-smoke
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: biglake-smoke
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-databrew
        app.kubernetes.io/component: biglake-smoke
    spec:
      restartPolicy: Never
      serviceAccountName: cyber-databrew-dev-biglake-smoke
      containers:
        - name: smoke
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: biglake-user-token
                  key: ACCESS_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: script
              mountPath: /scripts
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir --quiet "pyiceberg[pyarrow,gcsfs]" google-auth requests
              python /scripts/smoke.py
      volumes:
        - name: script
          configMap:
            name: biglake-iceberg-smoke-script
            defaultMode: 0444
