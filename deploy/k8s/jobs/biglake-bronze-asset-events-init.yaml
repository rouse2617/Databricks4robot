# One-off Job: initialize the formal Bronze Iceberg table for asset_events.
#
# Target table:
#   robot.bronze_asset_events
#
# Catalog:
#   BigLake Iceberg REST catalog on bucket
#   gs://cyber-databrew-iceberg-warehouse-prod
#
# Auth:
#   - Preferred: Workload Identity via KSA `cyber-databrew-dev-biglake-smoke`
#   - Temporary fallback: Secret `biglake-user-token` with key ACCESS_TOKEN
#
# Apply:
#   kubectl apply -f deploy/k8s/jobs/biglake-bronze-asset-events-init.yaml -n cyber-databrew-dev
# Watch:
#   kubectl logs -n cyber-databrew-dev job/biglake-bronze-asset-events-init -f
# Cleanup:
#   kubectl delete -f deploy/k8s/jobs/biglake-bronze-asset-events-init.yaml -n cyber-databrew-dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: biglake-bronze-asset-events-init-script
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: biglake-bronze-init
data:
  init.py: |
    import os

    import google.auth
    import google.auth.transport.requests
    from pyiceberg.catalog import load_catalog
    from pyiceberg.schema import Schema
    from pyiceberg.types import LongType, NestedField, StringType, TimestamptzType

    PROJECT = "green-valley-442103"
    BUCKET = "cyber-databrew-iceberg-warehouse-prod"
    NAMESPACE = "robot"
    TABLE = "bronze_asset_events"

    token = os.environ.get("ACCESS_TOKEN", "").strip()
    if not token:
        creds, _ = google.auth.default(
            scopes=["https://www.googleapis.com/auth/cloud-platform"]
        )
        creds.refresh(google.auth.transport.requests.Request())
        token = creds.token

    catalog = load_catalog(
        "biglake",
        **{
            "type": "rest",
            "uri": "https://biglake.googleapis.com/iceberg/v1/restcatalog",
            "warehouse": f"gs://{BUCKET}",
            "token": token,
            "header.x-goog-user-project": PROJECT,
            "py-io-impl": "pyiceberg.io.fsspec.FsspecFileIO",
            "gcs.project-id": PROJECT,
            "gcs.oauth2.token": token,
        },
    )

    try:
        catalog.create_namespace(NAMESPACE)
        print(f"NAMESPACE_CREATED {NAMESPACE}")
    except Exception:
        print(f"NAMESPACE_EXISTS {NAMESPACE}")

    table_id = f"{NAMESPACE}.{TABLE}"

    # PG source: schemas/pg-phase0.sql -> asset_events
    schema = Schema(
        NestedField(1, "event_id", StringType(), required=True),
        NestedField(2, "event_seq", LongType(), required=True),
        NestedField(3, "event_type", StringType(), required=True),
        NestedField(4, "payload_schema_version", StringType(), required=True),
        NestedField(5, "aggregate_type", StringType(), required=True),
        NestedField(6, "asset_id", StringType(), required=False),
        NestedField(7, "mcap_file_id", StringType(), required=False),
        NestedField(8, "tenant_id", StringType(), required=False),
        NestedField(9, "project_id", StringType(), required=False),
        NestedField(10, "event_source", StringType(), required=True),
        NestedField(11, "actor_type", StringType(), required=False),
        NestedField(12, "actor_id", StringType(), required=False),
        NestedField(13, "request_id", StringType(), required=False),
        NestedField(14, "idempotency_key", StringType(), required=False),
        NestedField(15, "run_id", StringType(), required=False),
        NestedField(16, "occurred_at", TimestamptzType(), required=True),
        NestedField(17, "created_at", TimestamptzType(), required=True),
        NestedField(18, "publish_state", StringType(), required=True),
        NestedField(19, "published_at", TimestamptzType(), required=False),
        NestedField(20, "retry_count", LongType(), required=True),
        NestedField(21, "last_error", StringType(), required=False),
        # Keep payload as JSON string in Bronze for compatibility across engines.
        NestedField(22, "event_payload", StringType(), required=True),
        # Ingestion metadata columns.
        NestedField(23, "_ingested_at", TimestamptzType(), required=False),
        NestedField(24, "_source_file", StringType(), required=False),
    )

    try:
        table = catalog.create_table(
            table_id,
            schema=schema,
            properties={
                "format-version": "2",
                "write.format.default": "parquet",
                "write.parquet.compression-codec": "zstd",
            },
        )
        print(f"TABLE_CREATED {table_id}")
    except Exception:
        table = catalog.load_table(table_id)
        print(f"TABLE_EXISTS {table_id}")

    print(f"TABLE_LOCATION {table.location()}")
    print(f"TABLE_SCHEMA_COLUMNS {len(table.schema().fields)}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: biglake-bronze-asset-events-init
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: biglake-bronze-init
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-databrew
        app.kubernetes.io/component: biglake-bronze-init
    spec:
      restartPolicy: Never
      serviceAccountName: cyber-databrew-dev-biglake-smoke
      containers:
        - name: init
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: biglake-user-token
                  key: ACCESS_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: script
              mountPath: /scripts
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir --quiet "pyiceberg[pyarrow,gcsfs]" google-auth requests
              python /scripts/init.py
      volumes:
        - name: script
          configMap:
            name: biglake-bronze-asset-events-init-script
            defaultMode: 0444
