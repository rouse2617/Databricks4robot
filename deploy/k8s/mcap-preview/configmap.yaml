# Non-sensitive defaults for mcap-preview.
# UPSTREAM_BASE_URL points at the cyber-databrew backend's ClusterIP service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcap-preview-config
  labels:
    app.kubernetes.io/name: mcap-preview
    app.kubernetes.io/component: preview
data:
  PORT: "8090"
  UPSTREAM_BASE_URL: "http://cyber-databrew-backend:80"
  GRACE_TOKEN_PASSTHROUGH: "true"
  GCS_PAGE_SIZE_BYTES: "1048576"
  GCS_PAGE_CACHE_BYTES: "67108864"
  LOG_LEVEL: info
  LOG_FORMAT: json
