apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cyber-databrew-backend-runtime-config
  namespace: video-proc-dev
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cyber-databrew-backend-runtime-config
  namespace: video-proc-dev
subjects:
  - kind: ServiceAccount
    name: cyber-databrew-backend-argo
    namespace: cyber-databrew-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cyber-databrew-backend-runtime-config
