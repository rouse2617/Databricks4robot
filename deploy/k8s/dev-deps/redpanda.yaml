apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: redpanda
spec:
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
  selector:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: redpanda
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-databrew
      app.kubernetes.io/component: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-databrew
        app.kubernetes.io/component: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --overprovisioned
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --node-id=0
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
            - --pandaproxy-addr=internal://0.0.0.0:8082
            - --advertise-pandaproxy-addr=internal://redpanda:8082
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9644
              name: admin
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 10
            periodSeconds: 5
