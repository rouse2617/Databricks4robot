apiVersion: v1
kind: Service
metadata:
  name: connect
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: cdc-connect
spec:
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  selector:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: cdc-connect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: cdc-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-databrew
      app.kubernetes.io/component: cdc-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-databrew
        app.kubernetes.io/component: cdc-connect
    spec:
      containers:
        - name: connect
          image: quay.io/debezium/connect:2.7
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: BOOTSTRAP_SERVERS
              value: redpanda:9092
            - name: GROUP_ID
              value: cdc-connect-cluster
            - name: CONFIG_STORAGE_TOPIC
              value: cdc_connect_configs
            - name: OFFSET_STORAGE_TOPIC
              value: cdc_connect_offsets
            - name: STATUS_STORAGE_TOPIC
              value: cdc_connect_status
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: PLUGIN_PATH
              value: /kafka/connect,/debezium-plugins
          readinessProbe:
            httpGet:
              path: /connectors
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /connectors
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
