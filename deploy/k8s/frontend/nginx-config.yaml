apiVersion: v1
kind: ConfigMap
metadata:
  name: cyber-databrew-frontend-nginx
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/v1/preview/ {
            proxy_pass https://mcap-preview-dev-wtttm6suaq-uc.a.run.app;
            # Cloud Run requires host to match its service domain.
            proxy_set_header Host mcap-preview-dev-wtttm6suaq-uc.a.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Grace-Token $cookie_grace_session;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /api/ {
            proxy_pass http://cyber-databrew-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /assets/ {
            # React SPA deep-link fallback, while still serving real hashed files.
            try_files $uri /index.html;
        }

        location / {
            try_files $uri /index.html;
        }
    }
