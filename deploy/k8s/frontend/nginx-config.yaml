apiVersion: v1
kind: ConfigMap
metadata:
  name: cyber-databrew-frontend-nginx
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://cyber-databrew-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
