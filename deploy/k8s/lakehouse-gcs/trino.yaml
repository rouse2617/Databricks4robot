apiVersion: v1
kind: Service
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: trino
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: trino
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: cyber-databrew
    app.kubernetes.io/component: trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-databrew
      app.kubernetes.io/component: trino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-databrew
        app.kubernetes.io/component: trino
    spec:
      # Uses namespace default ServiceAccount (same pattern as backend base deployment).
      # Annotate that SA with iam.gke.io/gcp-service-account and bind WI — see README.md.
      securityContext:
        fsGroup: 1000
      containers:
        - name: trino
          # >= 480: Iceberg REST catalog security GOOGLE for BigLake (see Trino release 480 / issue #26219).
          image: trinodb/trino:480
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: catalog
              mountPath: /etc/trino/catalog
              readOnly: true
            - name: gcp-key
              mountPath: /etc/trino/gcp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              memory: "4Gi"
      volumes:
        - name: catalog
          configMap:
            name: trino-catalog-iceberg-gcs
        - name: gcp-key
          secret:
            secretName: trino-gcp-key
