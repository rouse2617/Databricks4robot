# GCP per-resource unit rates, us-central1. Best-effort per-Pod cost estimates.
#
# Cost model (CYB-3705): Argo resourcesDuration is "resource-quantity × seconds"
# in a fixed base unit per resource, so
#
#     cost = Σ_r  resourcesDuration[r] × units[r][provisioning] / 3600
#
# We price each resource by its own unit rate rather than multiplying one
# resource's duration by a whole-instance hourly rate. This means:
#   - cpu core-seconds are priced by $/vCPU-hour (NOT treated as wall-clock);
#   - GPU cost is added only when a pod actually uses a GPU;
#   - a CPU-only step never inherits GPU pricing, even cross-cluster where the
#     node's machine type cannot be resolved.
#
# What is NOT modeled: network egress, storage I/O, GCS, node scale-down idle
# time. CUD/SUD: a 2026-07 bill audit confirmed actual spend == GCP list price
# for all Compute Engine SKUs (GPU/vCPU/RAM) — no committed- or sustained-use
# discounts, gross_cost == net_cost — so calibration_factor stays 1.00. To fold
# in a future discount, set it to (actual invoice $) / (sum of list-price $).
#
# Re-check quarterly against a real bill.

region: us-central1
calibration_factor: 1.00

# units[resource_name][provisioning] = USD unit rate.
#   - resource_name matches the Argo resourcesDuration key exactly.
#   - provisioning is resolved from cloud.google.com/gke-provisioning
#     ("standard" | "spot"); defaults to "standard" when unresolved.
#   - Adding a new machine type needs NO change here — CPU work shares one
#     blended vCPU rate (per-vCPU list prices span only ~1.6×: E2 $0.0218,
#     T2D $0.0275, C3D $0.0296, N4 $0.0312, N2 $0.0316, C3 $0.0347, G2 $0.0250).
#     Only a new accelerator type needs a new key.
units:
  # $/vCPU-hour. Blended on-demand rate across the CPU pools (c3d/t2d/n2/e2).
  # Spot ≈ 51% of on-demand (2026-07 bill: spot node discount ~49%, uniform
  # across components).
  cpu:
    standard: 0.0300
    spot: 0.0153

  # $/GPU-hour for the NVIDIA L4 accelerator only (the g2 host vCPUs are billed
  # via `cpu` above). GCP us-central1 list prices, verified against the bill:
  # on-demand $0.5600, spot $0.2862 (51% of on-demand).
  nvidia.com/gpu:
    standard: 0.5600
    spot: 0.2862

  # $/100Mi-hour (Argo memory base unit is 100Mi). ~$0.004/GiB-hour on-demand;
  # spot ~51%. Small relative to cpu/gpu; kept for completeness.
  memory:
    standard: 0.0004
    spot: 0.0002
