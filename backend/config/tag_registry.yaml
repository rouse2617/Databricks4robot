# Tag registry — governs `asset_tags` writes.
#
# Two sections:
#
#   tag_sources[]  → who may write each source; identity required fields;
#                    whether assertions are immutable once written.
#   tags{}         → which tag keys are known + per-key value rules.
#
# See docs/review/unified-asset-catalog/design/asset-tagging.md §5 for the
# full design including propagation rules (P1.5 — enforced CYB-1068).
#
# Per-key propagation:
#   none (default) — tag applies only to the target asset.
#   descendants    — tag is automatically propagated to all descendant assets
#                    via asset_relations parent→child edges.

tag_sources:
  - source: human
    description: "人工标注 / 运营手工"
    requires_source_name: true            # must record labeler / ops user_id
    immutable: false

  - source: algo_sdk
    description: "算法 worker 通过 SDK 写入"
    requires_source_name: true            # algo name
    requires_source_version: true         # algo version
    immutable: true                       # algorithm assertions are append-only

  - source: rule_engine
    description: "规则引擎派生"
    requires_source_name: true            # rule name
    requires_source_version: true         # rule version
    immutable: false                      # rule may recompute

  - source: system
    description: "平台自动 / 运营配置"
    immutable: false

  - source: compliance
    description: "合规审查"
    requires_source_name: true            # reviewer / policy id
    immutable: true                       # compliance assertions cannot be rewritten

tags:
  priority:
    description: "处理优先级"
    type: enum
    values: ["critical", "high", "medium", "low"]
  quality:
    description: "数据质量评级"
    type: enum
    values: ["excellent", "good", "acceptable", "poor", "unusable"]
  scene:
    description: "采集场景"
    type: enum
    values: ["indoor", "outdoor", "warehouse", "office", "factory"]
  task:
    description: "采集任务标识"
    type: string
  batch:
    description: "采集批次号"
    type: string
  source:
    description: "数据采集平台 (vibecap / grace / cybercap / ...)"
    type: string
  city:
    description: "采集地点(城市)"
    type: string
    max_length: 32
  notes:
    description: "自由备注"
    type: string
    max_length: 500
  compliance.status:
    description: "合规审查状态"
    type: enum
    values: ["pending", "approved", "rejected", "needs_review"]
    propagation: descendants
  customer.id:
    description: "客户标识 (CYB-1070: namespace lint — customer must exist)"
    type: string
