# Kubernetes Deployment for the standalone outbox worker.
# Blocked by P0-4 stability for 90 days — do not deploy to production
# until the in-process worker has been stable for the required period.
#
# Build: docker build -f cmd/outbox-worker/Dockerfile -t outbox-worker:latest .
# (run from backend/ directory)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-worker
  labels:
    app: outbox-worker
    component: async-sync
spec:
  replicas: 1  # Single worker — see outbox-worker-design.md §1.2
  selector:
    matchLabels:
      app: outbox-worker
  template:
    metadata:
      labels:
        app: outbox-worker
        component: async-sync
    spec:
      containers:
        - name: outbox-worker
          image: outbox-worker:latest
          ports:
            - containerPort: 8081
              name: health
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: host
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DB_NAME
              value: data4cyber
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
            - name: ELASTICSEARCH_INDEX
              value: assets
            - name: OUTBOX_WORKER_PORT
              value: "8081"
            - name: OUTBOX_TICK_INTERVAL_SEC
              value: "30"
            - name: OUTBOX_BATCH_SIZE
              value: "1000"
            - name: OUTBOX_RETRY_LIMIT
              value: "10"
            - name: OUTBOX_FATAL_ON_PANIC
              value: "true"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-worker
  labels:
    app: outbox-worker
spec:
  selector:
    app: outbox-worker
  ports:
    - port: 8081
      targetPort: health
      name: health
  clusterIP: None  # Headless — no external traffic, health only
