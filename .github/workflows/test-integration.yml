# CI: Backend tests + Frontend coverage (workflow name kept for branch protection compatibility).
name: test-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-review-guard:
    name: Docs review wording guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Pure CDC wording in docs/review
        run: bash scripts/check_review_docs_pure_cdc.sh

  backend:
    name: Backend (vet + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check migration filenames are unique
        run: bash ../scripts/check_migration_filenames.sh

      - run: go vet ./...
      - run: go test -p 4 -timeout 300s ./...

  backend-fresh-db:
    name: Backend fresh DB migrations + asset CRUD
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cyber_databrew_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      INTEGRATION_DB: "1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cyber_databrew_dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply all migrations to empty database
        run: |
          for f in migrations/*.sql; do
            echo "==> $f"
            PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d cyber_databrew_dev -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Asset CRUD smoke (post-migration 025)
        run: go test -p 4 -tags integration -v -timeout 120s ./internal/postgres/ -run TestFreshDB_AssetCRUD

  frontend:
    name: Frontend tests + coverage gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci --no-audit --prefer-offline
      - run: npm run lint
      - run: npm run build

      # Coverage thresholds (core components ≥ 70%) are enforced via
      # vite.config.ts → test.coverage.thresholds. The grep check below
      # catches threshold violations that vitest may only log as warnings.
      - name: Run tests with coverage gate
        run: |
          npx vitest run --coverage 2>&1 | tee /tmp/coverage-output.txt
          if grep -q 'does not meet.*threshold' /tmp/coverage-output.txt; then
            echo "::error::Coverage thresholds not met — see output above"
            exit 1
          fi
