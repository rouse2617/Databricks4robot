# Feishu on PRs targeting main → A 群 (FEISHU_BOT_WEBHOOK_MAIN).
name: Feishu PR Notifications

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    branches:
      - main

jobs:
  post-merge-deploy-hint:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Comment prod deploy commands on merged PR
        uses: actions/github-script@v7
        with:
          script-path: .github/scripts/pr-prod-deploy-comment.js
