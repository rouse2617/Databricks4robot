---
name: gitleaks

# Secret scanning gate. Catches tokens, passwords, API keys, GCP service-account
# JSON, etc. in PRs and direct pushes to protected branches. Fails the workflow
# on any finding so the PR cannot merge with leaked credentials.
# Pre-commit runs detect-secrets locally for the same purpose; gitleaks is the
# CI-side counterpart with a richer rule set.
#
# We use gitleaks-action@v1 (not v2) because v2 requires a paid GITLEAKS_LICENSE
# secret. v1 still uses the latest gitleaks binary; it just runs the scan
# in-process and uploads SARIF for the Code Scanning UI.

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  # Required for gitleaks-action to upload SARIF to the Code Scanning UI.
  security-events: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
