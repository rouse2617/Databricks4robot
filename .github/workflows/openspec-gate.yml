name: OpenSpec Gate

on:
  pull_request:
    branches: [main]

jobs:
  openspec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for exempt labels
        id: labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const exempt = ['docs-only', 'infra-ci-only', 'hotfix-approved'];
            const isExempt = labels.some(l => exempt.includes(l));
            core.setOutput('exempt', isExempt.toString());

      - name: Get changed files
        if: steps.labels.outputs.exempt == 'false'
        id: files
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$FILES" > /tmp/changed_files.txt

      - name: Validate OpenSpec change
        if: steps.labels.outputs.exempt == 'false'
        run: |
          BRANCH="${{ github.head_ref }}"
          bash scripts/validate_openspec_change.sh "$BRANCH" "$(cat /tmp/changed_files.txt)"

      - name: Setup Node (OpenSpec CLI validate)
        if: steps.labels.outputs.exempt == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: OpenSpec CLI validate change deltas
        if: steps.labels.outputs.exempt == 'false'
        env:
          OPENSPEC_TELEMETRY: "0"
        run: |
          BRANCH="${{ github.head_ref }}"
          bash scripts/openspec_validate_ci.sh "$BRANCH" "$(cat /tmp/changed_files.txt)"

      - name: Skip (exempt label)
        if: steps.labels.outputs.exempt == 'true'
        run: echo "OpenSpec gate skipped due to exempt label."
