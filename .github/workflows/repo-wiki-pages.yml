name: repo-wiki-pages

on:
  push:
    branches: [main]
    paths:
      - "docs/repo-wiki/**"
      - "docs/agents/skills/repo-wiki/**"
      - "scripts/repo-wiki/**"
      - ".github/workflows/repo-wiki-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/repo-wiki/**"
      - "docs/agents/skills/repo-wiki/**"
      - "scripts/repo-wiki/**"
      - ".github/workflows/repo-wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build repo wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/repo-wiki/requirements-mkdocs.txt

      - name: Install MkDocs dependencies
        run: pip install -r scripts/repo-wiki/requirements-mkdocs.txt

      - name: Generate MkDocs config
        run: python3 scripts/repo-wiki/gen_mkdocs.py

      - name: Build site
        run: mkdocs build --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/repo-wiki-site

  deploy:
    name: Deploy repo wiki
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
