name: Feishu Push Notifications

on:
  push:

jobs:
  notify-on-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send push message to Feishu bot
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.actor }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_BOT_WEBHOOK:-}" ]; then
            echo "FEISHU_BOT_WEBHOOK is empty, skip sending."
            exit 0
          fi

          text="$(printf '【Git Push 通知】\n仓库：%s\n分支：%s\n提交人：%s\n链接：%s\n' \
            "${REPO}" "${BRANCH}" "${PUSHER}" "${COMMIT_URL}")"
          payload="$(jq -nc --arg text "$text" '{msg_type:"text", content:{text:$text}}')"

          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${FEISHU_BOT_WEBHOOK}"
