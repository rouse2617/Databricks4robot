name: DB GORM drift check

# Verifies the GORM models in backend/internal/dbschema/ stay in sync with
# the SQL migrations in backend/migrations/. Runs `atlas migrate diff
# --env gorm` and fails on REAL drift (column-level changes); known gaps
# (indexes, check constraints, triggers, functions) are filtered out
# because GORM can't express them.
#
# Runs on PRs touching:
#   - backend/internal/dbschema/**   (GORM models)
#   - backend/migrations/**          (SQL migrations)
#   - backend/atlas/**              (atlas.hcl, atlas.sum)
#   - .github/workflows/db-drift-check.yml

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/internal/dbschema/**"
      - "backend/migrations/**"
      - "backend/atlas/**"
      - ".github/workflows/db-drift-check.yml"

permissions:
  contents: read

jobs:
  drift-check:
    name: Atlas GORM vs migrations drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}  # optional; only needed for Pro lint upload

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Atlas CLI
        run: |
          curl -sSf https://atlasgo.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      # Generate the candidate diff. We don't apply it; we just inspect it.
      - name: Generate GORM diff
        id: diff
        run: |
          # Use a scratch dir outside the repo to avoid polluting migrations/.
          SCRATCH=$(mktemp -d)
          trap 'rm -rf "$SCRATCH"' EXIT
          atlas migrate diff scratch --env gorm --config file://atlas/atlas.hcl \
            --dir "file://$SCRATCH" 2>&1 | tee /tmp/diff-output.txt | tail -5
          # The above writes to $SCRATCH; copy to a known path for the next step.
          if [ -f "$SCRATCH/$(ls -t "$SCRATCH" | head -1)" ]; then
            cp "$SCRATCH"/* /tmp/ 2>/dev/null || true
          fi

      # Real drift: column-level changes that GORM *can* express but got wrong.
      # Known gaps (filtered out): DROP INDEX / DROP CONSTRAINT / DROP TRIGGER
      # / DROP FUNCTION — these are intentional (GORM can't express them).
      - name: Detect real drift
        id: detect
        run: |
          set -e
          DIFF_FILE=$(ls -t /tmp/scratch*.sql 2>/dev/null | head -1)
          if [ -z "$DIFF_FILE" ] || [ ! -s "$DIFF_FILE" ]; then
            echo "✓ No migration diff produced (GORM matches migrations exactly)"
            echo "drift_lines=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Real drift = column-level changes only. Filter out known gaps.
          REAL_DRIFT=$(grep -cE '^(ALTER TABLE|.*ADD COLUMN|.*DROP COLUMN|.*ADD PRIMARY KEY|.*ALTER COLUMN)' "$DIFF_FILE" || true)

          # Known gaps: indexes, constraints, triggers, functions, partitioned tables.
          KNOWN_GAP=$(grep -cE '^-- (Drop index|Drop constraint|Drop "trg|Drop "(set_updated_at|sync_databrew_run_from_pipeline|event_retention_cleanup|asset_algo_statuses|trg_logical_assets_type_immutable))' "$DIFF_FILE" || true)

          echo "::notice::GORM drift: $REAL_DRIFT real-drift lines, $KNOWN_GAP known-gap lines"
          echo "drift_lines=$REAL_DRIFT" >> "$GITHUB_OUTPUT"
          echo "known_gap_lines=$KNOWN_GAP" >> "$GITHUB_OUTPUT"

          if [ "$REAL_DRIFT" -gt 0 ]; then
            echo "::error::GORM model has $REAL_DRIFT lines of real drift from SQL migrations"
            echo "::error::Diff file: $DIFF_FILE"
            echo "::group::First 50 real-drift lines"
            grep -E '^(ALTER TABLE|.*ADD COLUMN|.*DROP COLUMN|.*ADD PRIMARY KEY|.*ALTER COLUMN)' "$DIFF_FILE" | head -50
            echo "::endgroup::"
            exit 1
          fi

          echo "✓ GORM models match SQL migrations (only known gaps remain)"

      # Optional: post the diff to PR as a comment for visibility.
      - name: Comment on PR with diff summary
        if: always() && steps.detect.outputs.drift_lines != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const drift = '${{ steps.detect.outputs.drift_lines }}';
            const known = '${{ steps.detect.outputs.known_gap_lines }}';
            const body = `### Atlas GORM drift detected\n\n` +
              `Real-drift lines: **${drift}** (column-level mismatches between \`internal/dbschema/*.go\` and \`migrations/*.sql\`)\n` +
              `Known-gap lines: ${known} (index/constraint/trigger/function — GORM can't express these; expected)\n\n` +
              `To fix: either update the GORM model to match the SQL, or update the SQL migration to match the model (and add a new migration if the change is meaningful). See \`docs/atlas-migrations.md\` for the workflow.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });