name: DB GORM drift check

# Verifies the GORM models in backend/internal/dbschema/ stay in sync with
# the SQL migrations in backend/migrations/.
#
# Two checks, both baseline-aware:
#
#  1. New tables. Extracts the set of "CREATE TABLE X" lines from the
#     PR's diff and the baseline `.atlas-drift-baseline.sql`. Fails on
#     any NEW table not in the baseline. (This catches "I added a GORM
#     model but forgot to generate a migration".)
#
#  2. Drift visibility. Posts the full diff as a PR comment so the team
#     can review column-level changes against the baseline. The diff
#     itself is informational; the team decides in the PR whether the
#     change is intentional.
#
# The baseline is committed at repo root: `.atlas-drift-baseline.sql`.
# To regenerate: `atlas migrate diff baseline --env gorm --dir
# file:///tmp/baseline && cp /tmp/baseline/<file>.sql
# .atlas-drift-baseline.sql`.
#
# Runs on PRs touching:
#   - backend/internal/dbschema/**   (GORM models)
#   - backend/migrations/**          (SQL migrations)
#   - backend/atlas/**              (atlas.hcl, atlas.sum)
#   - .github/workflows/db-drift-check.yml
#   - .atlas-drift-baseline.sql

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/internal/dbschema/**"
      - "backend/migrations/**"
      - "backend/atlas/**"
      - ".github/workflows/db-drift-check.yml"
      - ".atlas-drift-baseline.sql"

permissions:
  contents: read

jobs:
  drift-check:
    name: Atlas GORM vs migrations drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Atlas CLI
        run: |
          curl -sSf https://atlasgo.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      # Generate the PR's drift into a scratch dir (we don't apply).
      - name: Generate GORM diff
        id: diff
        run: |
          SCRATCH=$(mktemp -d)
          trap 'rm -rf "$SCRATCH"' EXIT
          # --dir override keeps the diff out of the repo's migrations/
          # (otherwise it would pollute atlas.sum and show up as an
          # unintended migration).
          atlas migrate diff pr-drift --env gorm --config file://atlas/atlas.hcl \
            --dir "file://$SCRATCH" > /tmp/atlas-stdout.txt 2>&1 || true
          cat /tmp/atlas-stdout.txt | tail -3
          PR_FILE=$(ls -t "$SCRATCH"/*.sql 2>/dev/null | head -1)
          if [ -n "$PR_FILE" ]; then
            cp "$PR_FILE" /tmp/pr-drift.sql
            wc -l /tmp/pr-drift.sql
            echo "diff_file=/tmp/pr-drift.sql" >> "$GITHUB_OUTPUT"
          else
            echo "diff_file=" >> "$GITHUB_OUTPUT"
          fi

      # Compare the PR's "CREATE TABLE" set against the baseline. Fail on
      # any NEW table the PR introduces. (Modifications to existing
      # tables are reported in the PR comment, not auto-failed.)
      - name: Detect new tables
        id: detect
        run: |
          set -e
          BASELINE=../.atlas-drift-baseline.sql
          PR_FILE="${{ steps.diff.outputs.diff_file }}"

          if [ -z "$PR_FILE" ] || [ ! -s "$PR_FILE" ]; then
            echo "✓ PR diff is empty (GORM matches migrations exactly)"
            echo "new_tables=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract "CREATE TABLE \"X\"" (or -- Create "X" table) from
          # both. Atlas emits both forms: a -- comment header and the
          # actual CREATE TABLE statement.
          PR_TABLES=$(grep -E '^-- Create "[^"]+" table' "$PR_FILE" | sort -u || true)
          BASE_TABLES=$(grep -E '^-- Create "[^"]+" table' "$BASELINE" | sort -u || true)

          if [ -z "$PR_TABLES" ]; then
            echo "✓ No new tables (PR diff is only ALTERs, no new CREATE TABLE)"
            echo "new_tables=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tables in PR but not in baseline = new.
          NEW_TABLES=$(comm -23 <(echo "$PR_TABLES") <(echo "$BASE_TABLES") || true)
          NEW_COUNT=$(echo "$NEW_TABLES" | grep -c . || true)

          echo "new_tables_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_tables<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW_TABLES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$NEW_COUNT" -gt 0 ]; then
            echo "::error::PR introduces $NEW_COUNT new table(s) not in baseline:"
            echo "$NEW_TABLES" | sed 's/^/  /'
            echo
            echo "::error::If you added a GORM model for a new table, you must also"
            echo "::error::generate a new SQL migration via:"
            echo "::error::  cd backend && atlas migrate diff <name> --env gorm"
            echo "::error::and commit the generated SQL file alongside the model."
            exit 1
          fi

          echo "✓ No new tables (matches baseline)"

      # Post the PR diff as a comment for team review. Always (informational).
      - name: Comment on PR with diff summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const newTables = `$(echo '${{ steps.detect.outputs.new_tables }}' | head -20)`;
            const prFile = '${{ steps.diff.outputs.diff_file }}';
            if (!prFile) return;
            const fs = require('fs');
            let diff = '';
            try {
              const buf = fs.readFileSync(prFile);
              diff = buf.toString().split('\n').slice(0, 200).join('\n');
            } catch (e) {}
            const newTableLines = (newTables || '').split('\n').filter(l => l.startsWith('-- Create')).join('\n');
            const body = `### Atlas GORM drift check\n\n` +
              (newTableLines
                ? `**${newTableLines.split('\n').length} new table(s) detected** — review above. CI failed; generate a migration with \`atlas migrate diff <name> --env gorm\`.\n\n`
                : `No new tables (PR diff is only modifications to existing tables or known gaps).\n\n`) +
              `Full diff (first 200 lines) for review:\n\n\`\`\`sql\n${diff}\n\`\`\`\n\n` +
              `Baseline: \`.atlas-drift-baseline.sql\` at repo root.`;
            const marker = '<!-- atlas-drift-bot -->';
            // Avoid duplicate comments: list existing and update.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            const finalBody = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: finalBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: finalBody
              });
            }