name: deploy-frontend-dev

# Last updated: 2026-06-29 — VM build box, Cloud Run dev.
on:
  push:
    branches: [dev]
    paths:
      - "Frontend/**"
      - "deploy/cloudrun/frontend-dev.sh"
      - "deploy/cloudrun/frontend-cloudrun.Dockerfile"
      - "deploy/cloudrun/frontend-nginx.conf"
      - ".github/workflows/deploy-frontend-dev.yml"

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  VM_HOST: 136.119.82.209
  VM_USER: rick
  REPO_DIR: /home/rick/cyber-databrew
  BASE_IMAGE: us-central1-docker.pkg.dev/green-valley-442103/cyber-databrew-images/cyber-databrew-frontend:dev-latest
  IMAGE: us-central1-docker.pkg.dev/green-valley-442103/cyber-databrew-images/cyber-databrew-frontend:cloudrun-dev-latest
  BASE_CACHE_IMAGE: us-central1-docker.pkg.dev/green-valley-442103/cyber-databrew-images/cyber-databrew-frontend:base-buildcache

jobs:
  deploy:
    name: Build & Deploy frontend to Cloud Run dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/cloudrun/frontend-dev.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234851712830/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider
          service_account: cyber-databrew-gha@green-valley-442103.iam.gserviceaccount.com

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build & push images on VM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          AR_TOKEN=$(gcloud auth print-access-token)
          CLONE_URL="https://x-access-token:${GH_TOKEN}@github.com/CyberOrigin2077/cyber-databrew.git"

          ssh -i ~/.ssh/vm_key ${{ env.VM_USER }}@${{ env.VM_HOST }} bash << ENDSSH
          set -euo pipefail

          echo "--- [1/3] sync code: commit $COMMIT_SHA ---"
          if [ -d ${{ env.REPO_DIR }}/.git ]; then
            git -C ${{ env.REPO_DIR }} remote set-url origin "$CLONE_URL" 2>/dev/null
            git -C ${{ env.REPO_DIR }} fetch --depth=1 origin dev -q
            git -C ${{ env.REPO_DIR }} reset --hard FETCH_HEAD -q
          else
            git clone --depth=1 --branch dev "$CLONE_URL" ${{ env.REPO_DIR }} -q
          fi
          echo "    code ready: $(git -C ${{ env.REPO_DIR }} log -1 --oneline)"

          echo "--- [2/3] docker login ---"
          echo "$AR_TOKEN" | docker login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev 2>&1 | grep -v "^$"

          echo "--- [3/3] build & push ---"
          if docker buildx inspect databrew-frontend-builder &>/dev/null; then
            echo "    builder warm — skipping registry cache pull"
            docker buildx use databrew-frontend-builder
            BASE_CACHE_ARGS="--cache-to=type=registry,ref=${{ env.BASE_CACHE_IMAGE }},mode=max"
          else
            echo "    builder cold — pulling registry cache"
            docker buildx create --driver docker-container --use --name databrew-frontend-builder
            BASE_CACHE_ARGS="--cache-from=type=registry,ref=${{ env.BASE_CACHE_IMAGE }} --cache-to=type=registry,ref=${{ env.BASE_CACHE_IMAGE }},mode=max"
          fi

          GIT_SHA=\$(git -C ${{ env.REPO_DIR }} rev-parse --short HEAD)

          echo "    building SPA base image..."
          docker buildx build \
            --progress=auto \
            --platform=linux/amd64 \
            \$BASE_CACHE_ARGS \
            --build-arg "VITE_APP_VERSION=\${GIT_SHA}" \
            --build-arg "VITE_BUILD_REF=dev#\${GIT_SHA}" \
            -f ${{ env.REPO_DIR }}/Frontend/Dockerfile \
            -t ${{ env.BASE_IMAGE }} \
            --push \
            ${{ env.REPO_DIR }}/Frontend

          echo "    building Cloud Run wrapper image..."
          docker buildx build \
            --progress=auto \
            --platform=linux/amd64 \
            --build-arg "BASE_IMAGE=${{ env.BASE_IMAGE }}" \
            -f ${{ env.REPO_DIR }}/deploy/cloudrun/frontend-cloudrun.Dockerfile \
            -t ${{ env.IMAGE }} \
            --push \
            ${{ env.REPO_DIR }}

          echo "    pushed: ${{ env.IMAGE }}"
          ENDSSH

      - name: Deploy to Cloud Run dev
        run: |
          echo "--- deploying ${{ env.IMAGE }} to Cloud Run dev ---"
          IMAGE=${{ env.IMAGE }} \
          BASE_IMAGE=${{ env.BASE_IMAGE }} \
          USE_EXISTING_IMAGE=true \
          BUILD_ARGO_UI=false \
          bash deploy/cloudrun/frontend-dev.sh
