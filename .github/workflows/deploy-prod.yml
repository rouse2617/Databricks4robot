name: deploy-prod

# Consolidated prod deploy: backend(Cloud Run) + frontend(CF Worker).
# Triggers on semantic version tags, or manual dispatch with an explicit
# version_tag input (workflow_dispatch does NOT run on a tag ref, so
# github.ref_name would otherwise resolve to a branch name like "main" —
# see resolve-version below). Both jobs require production approval.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Semver tag to deploy (e.g. v1.2.3) — must already exist as a git tag'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  VM_HOST: 136.119.82.209
  VM_USER: rick
  REPO_DIR: /home/rick/cyber-databrew
  PROJECT_ID: green-valley-442103
  REGION: us-central1

jobs:
  # ─── Resolve & validate the version to deploy ────────────────────────────────
  resolve-version:
    name: Resolve deploy version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate version tag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version_tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' does not match the required vX.Y.Z tag pattern"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ─── Backend ────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Build & Deploy backend → Cloud Run prod
    needs: [resolve-version, deploy-migrate]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend-prod
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      IMAGE: us-central1-docker.pkg.dev/green-valley-442103/cyber-databrew-images/cyber-databrew-backend:${{ needs.resolve-version.outputs.version }}
      CACHE_IMAGE: us-central1-docker.pkg.dev/green-valley-442103/cyber-databrew-images/cyber-databrew-backend:buildcache
    steps:
      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234851712830/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider
          service_account: cyber-databrew-gha@green-valley-442103.iam.gserviceaccount.com

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build & push image on VM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          AR_TOKEN=$(gcloud auth print-access-token)

          # NOTE: the token-bearing URL below is only ever used as a
          # one-shot fetch/clone source — it is never written to `origin`
          # via `git remote set-url`, so it can't be read back out of
          # .git/config on the VM after this step finishes. For a fresh
          # clone (which does briefly set `origin` to this URL), we
          # immediately rewrite `origin` to the public, token-free URL.
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/CyberOrigin2077/cyber-databrew.git"
          PUBLIC_URL="https://github.com/CyberOrigin2077/cyber-databrew.git"

          ssh -i ~/.ssh/vm_key ${{ env.VM_USER }}@${{ env.VM_HOST }} bash << ENDSSH
          set -euo pipefail

          echo "--- [1/3] sync code: $VERSION ($COMMIT_SHA) ---"
          if [ -d ${{ env.REPO_DIR }}/.git ]; then
            git -C ${{ env.REPO_DIR }} fetch --depth=1 "$AUTH_URL" "refs/tags/$VERSION" -q
            git -C ${{ env.REPO_DIR }} reset --hard FETCH_HEAD -q
          else
            git clone --depth=1 --branch "$VERSION" "$AUTH_URL" ${{ env.REPO_DIR }} -q
            git -C ${{ env.REPO_DIR }} remote set-url origin "$PUBLIC_URL"
          fi
          echo "    code ready: \$(git -C ${{ env.REPO_DIR }} log -1 --oneline)"

          echo "--- [2/3] docker login ---"
          echo "$AR_TOKEN" | docker login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev 2>&1 | grep -v "^$"

          echo "--- [3/3] build & push ---"
          if docker buildx inspect databrew-builder &>/dev/null; then
            docker buildx use databrew-builder
            CACHE_ARGS="--cache-to=type=registry,ref=${{ env.CACHE_IMAGE }},mode=max"
          else
            docker buildx create --driver docker-container --use --name databrew-builder
            CACHE_ARGS="--cache-from=type=registry,ref=${{ env.CACHE_IMAGE }} --cache-to=type=registry,ref=${{ env.CACHE_IMAGE }},mode=max"
          fi
          docker buildx build \
            --progress=auto \
            --platform=linux/amd64 \
            \$CACHE_ARGS \
            -f ${{ env.REPO_DIR }}/backend/Dockerfile \
            -t ${{ env.IMAGE }} \
            --push \
            ${{ env.REPO_DIR }}/backend
          echo "    pushed: ${{ env.IMAGE }}"
          ENDSSH

      - name: Deploy to Cloud Run prod
        run: |
          # --update-env-vars merges into the existing env var set; --set-env-vars
          # would REPLACE the entire set (gcloud docs: "All existing environment
          # variables will be removed first"), which would wipe JWT_SECRET,
          # DATABREW_TOKEN, DB_HOST, and every other prod env var on first run.
          #
          # --set-secrets is REPLACE-ALL for secret-backed env vars — every
          # secret this service needs at runtime must be listed here or it
          # disappears on the next tag deploy. See the block below.
          #
          # Runtime secrets currently required (2026-07-16):
          #   DATABREW_TOKEN                    → SDK / API bearer for backend
          #   DB_PASSWORD                       → CloudSQL postgres auth
          #   K8S_CA_DATA / K8S_CA_B64          → GKE control-plane CA for the
          #                                       backend's Kubernetes client
          #                                       (pod exec + runtime config
          #                                       projection ConfigMap writes)
          #   COMPONENT_RELEASE_INGEST_TOKEN    → shared secret the
          #                                       automated-processing-gcloud
          #                                       Cloud Build presents on
          #                                       POST /api/v1/pipeline-component-releases/sync
          #   BACKFILL_NOTIFY_FEISHU_WEBHOOK_URL → batch-job Feishu completion
          #                                       notifications. Sourced from
          #                                       the dev-owned secret today
          #                                       (cross-env by intent; both
          #                                       envs point at the same
          #                                       webhook until we split them).
          gcloud run deploy cyber-databrew-backend-prod \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --service-account=cyber-databrew-cloudrun-prod@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --update-env-vars=DEPLOYMENT_VERSION=${{ env.VERSION }},ADMIN_EMAILS=ruipeng.huang@cyberorigin.ai \
            --set-secrets=DATABREW_TOKEN=cyber-databrew-prod-databrew-token:latest,DB_PASSWORD=cyber-databrew-prod-postgres-password:latest,K8S_CA_DATA=cyber-databrew-k8s-ca-cert:latest,K8S_CA_B64=cyber-databrew-k8s-ca-cert:latest,COMPONENT_RELEASE_INGEST_TOKEN=cyber-databrew-prod-component-release-ingest-token:latest,BACKFILL_NOTIFY_FEISHU_WEBHOOK_URL=cyber-databrew-dev-backfill-feishu-webhook:latest

  # ─── Atlas migrations (Cloud Run Job) ───────────────────────────────────────
  # Runs BEFORE deploy-backend so the new image deploys against an already-
  # migrated schema. The Job (cyber-databrew-migrate-prod) is created once via
  # deploy/cloudrun/create-migrate-jobs.sh. This job rebuilds the migrate
  # image pinned to the same release tag as the backend (so a given tag can
  # never apply a migration that isn't also in the corresponding code).
  deploy-migrate:
    name: Apply Atlas migrations → CloudSQL prod
    needs: resolve-version
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-migrate-prod
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      MIGRATE_IMAGE: us-central1-docker.pkg.dev/green-valley-442103/cyber-databrew-images/cyber-databrew-migrate:${{ needs.resolve-version.outputs.version }}
      MIGRATE_JOB: cyber-databrew-migrate-prod
      REGION: us-central1
      PROJECT_ID: green-valley-442103
    steps:
      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234851712830/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider
          service_account: cyber-databrew-gha@green-valley-442103.iam.gserviceaccount.com

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build & push migrate image on VM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AR_TOKEN=$(gcloud auth print-access-token)
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/CyberOrigin2077/cyber-databrew.git"
          PUBLIC_URL="https://github.com/CyberOrigin2077/cyber-databrew.git"

          ssh -i ~/.ssh/vm_key ${{ env.VM_USER }}@${{ env.VM_HOST }} bash << ENDSSH
          set -euo pipefail
          if [ -d ${{ env.REPO_DIR }}/.git ]; then
            git -C ${{ env.REPO_DIR }} fetch --depth=1 "$AUTH_URL" "refs/tags/$VERSION" -q
            git -C ${{ env.REPO_DIR }} reset --hard FETCH_HEAD -q
          else
            git clone --depth=1 --branch "$VERSION" "$AUTH_URL" ${{ env.REPO_DIR }} -q
            git -C ${{ env.REPO_DIR }} remote set-url origin "$PUBLIC_URL"
          fi
          echo "$AR_TOKEN" | docker login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev 2>&1 | grep -v "^$"
          docker buildx build \
            --progress=auto \
            --platform=linux/amd64 \
            -f ${{ env.REPO_DIR }}/backend/atlas/Dockerfile.migrate \
            -t ${{ env.MIGRATE_IMAGE }} \
            --push \
            ${{ env.REPO_DIR }}/backend
          echo "    pushed: ${{ env.MIGRATE_IMAGE }}"
          ENDSSH

      - name: Update Job image reference
        run: |
          # NOTE: gcloud run jobs update wipes plain --set-env-vars (but keeps
          # --set-secrets). We re-assert the DB_* env vars on every update so
          # the Job's container can compose the connection URL via atlas.hcl.
          gcloud run jobs update "${{ env.MIGRATE_JOB }}" \
            --image="${{ env.MIGRATE_IMAGE }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --update-env-vars=DB_HOST=172.27.160.9,DB_PORT=5432,DB_USER=postgres,DB_NAME=cyber_databrew_prod,DB_SSLMODE=disable

      - name: Execute migrate Job
        run: |
          # Apply pending migrations only — the Job's default entrypoint is
          # `atlas migrate apply --env migrate`, so a plain execute (no --args)
          # applies whatever is pending. prod is already baselined, so there is
          # no first-run baseline gymnastics here.
          #
          # Adopting a NEW pre-existing (pre-Atlas) database is a deliberate,
          # one-off `atlas migrate apply --baseline <version>` run by hand — see
          # docs/atlas-migrations.md. It is intentionally NOT auto-run at deploy
          # (the old hardcoded `--baseline 000_initial.sql` was removed when the
          # baseline was reset to a single reverse-engineered snapshot).
          gcloud run jobs execute "${{ env.MIGRATE_JOB }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --wait

  # ─── Frontend (Cloudflare Worker) ───────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy frontend → Cloudflare Worker prod
    needs: resolve-version
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-frontend-prod
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: Frontend
        env:
          VITE_APP_VERSION: ${{ env.VERSION }}
          VITE_BUILD_REF: main#${{ env.VERSION }}
        run: npm run build

      - name: Sync dist → site/
        run: |
          rm -rf site
          cp -r Frontend/dist site

      - name: Deploy to Cloudflare Worker (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env prod

  # ─── Notify: Deploy complete ───────────────────────────────────────────────
  notify-complete:
    name: Notify deploy complete
    needs: [resolve-version, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Notify Feishu — deploy complete
        env:
          FEISHU_BOT_WEBHOOK_MAIN: ${{ secrets.FEISHU_BOT_WEBHOOK_MAIN }}
          FEISHU_BOT_WEBHOOK_BRANCH: ${{ secrets.FEISHU_BOT_WEBHOOK_BRANCH }}
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          BACKEND_STATUS="${{ needs.deploy-backend.result }}"
          FRONTEND_STATUS="${{ needs.deploy-frontend.result }}"

          if [[ "${BACKEND_STATUS}" == "success" ]] && [[ "${FRONTEND_STATUS}" == "success" ]]; then
            TITLE="【部署成功】生产环境部署完成"
            HINT="backend 和 frontend 均已成功部署到生产环境。"
            RESULT="✅ 成功"
          else
            TITLE="【部署失败】生产环境部署异常"
            HINT="backend 或 frontend 部署失败，请查看日志。"
            RESULT="❌ 失败"
          fi

          export FEISHU_ROUTE_BRANCH="main"
          export FEISHU_MESSAGE="$(printf '%s\n\n版本：%s\nBackend：%s\nFrontend：%s\n结果：%s\n说明：%s\n日志：%s\n' \
            "${TITLE}" "${VERSION}" "${BACKEND_STATUS}" "${FRONTEND_STATUS}" "${RESULT}" "${HINT}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"

          bash .github/scripts/feishu-notify.sh
