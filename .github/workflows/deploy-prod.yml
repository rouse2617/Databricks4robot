name: deploy-prod

# Consolidated prod deploy: backend(Cloud Run) + frontend(CF Worker).
# Triggers on semantic version tags only. Both jobs require production approval.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  VM_HOST: 136.119.82.209
  VM_USER: rick
  REPO_DIR: /home/rick/cyber-databrew
  PROJECT_ID: green-valley-442103
  REGION: us-central1

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Build & Deploy backend → Cloud Run prod
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend-prod
      cancel-in-progress: false
    env:
      IMAGE: us-central1-docker.pkg.dev/green-valley-442103/cyber-databrew-images/cyber-databrew-backend:${{ github.ref_name }}
      CACHE_IMAGE: us-central1-docker.pkg.dev/green-valley-442103/cyber-databrew-images/cyber-databrew-backend:buildcache
    steps:
      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234851712830/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider
          service_account: cyber-databrew-gha@green-valley-442103.iam.gserviceaccount.com

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build & push image on VM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          AR_TOKEN=$(gcloud auth print-access-token)
          CLONE_URL="https://x-access-token:${GH_TOKEN}@github.com/CyberOrigin2077/cyber-databrew.git"

          ssh -i ~/.ssh/vm_key ${{ env.VM_USER }}@${{ env.VM_HOST }} bash << ENDSSH
          set -euo pipefail

          echo "--- [1/3] sync code: $VERSION ($COMMIT_SHA) ---"
          if [ -d ${{ env.REPO_DIR }}/.git ]; then
            git -C ${{ env.REPO_DIR }} remote set-url origin "$CLONE_URL" 2>/dev/null
            git -C ${{ env.REPO_DIR }} fetch --depth=1 origin refs/tags/$VERSION -q
            git -C ${{ env.REPO_DIR }} reset --hard FETCH_HEAD -q
          else
            git clone --depth=1 --branch $VERSION "$CLONE_URL" ${{ env.REPO_DIR }} -q
          fi
          echo "    code ready: \$(git -C ${{ env.REPO_DIR }} log -1 --oneline)"

          echo "--- [2/3] docker login ---"
          echo "$AR_TOKEN" | docker login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev 2>&1 | grep -v "^$"

          echo "--- [3/3] build & push ---"
          if docker buildx inspect databrew-builder &>/dev/null; then
            docker buildx use databrew-builder
            CACHE_ARGS="--cache-to=type=registry,ref=${{ env.CACHE_IMAGE }},mode=max"
          else
            docker buildx create --driver docker-container --use --name databrew-builder
            CACHE_ARGS="--cache-from=type=registry,ref=${{ env.CACHE_IMAGE }} --cache-to=type=registry,ref=${{ env.CACHE_IMAGE }},mode=max"
          fi
          docker buildx build \
            --progress=auto \
            --platform=linux/amd64 \
            \$CACHE_ARGS \
            -f ${{ env.REPO_DIR }}/backend/Dockerfile \
            -t ${{ env.IMAGE }} \
            --push \
            ${{ env.REPO_DIR }}/backend
          echo "    pushed: ${{ env.IMAGE }}"
          ENDSSH

      - name: Deploy to Cloud Run prod
        run: |
          gcloud run deploy cyber-databrew-backend-prod \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --service-account=cyber-databrew-cloudrun-prod@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars=DEPLOYMENT_VERSION=${{ github.ref_name }}

      - name: Verify backend health
        run: |
          BACKEND_URL=$(gcloud run services describe cyber-databrew-backend-prod \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          curl -sf "${BACKEND_URL}/healthz" > /dev/null && echo "backend healthy" || echo "WARNING: backend health check failed"

  # ─── Frontend (Cloudflare Worker) ───────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy frontend → Cloudflare Worker prod
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-frontend-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: Frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION }}
          VITE_BUILD_REF: main#${{ steps.version.outputs.VERSION }}
        run: npm run build

      - name: Sync dist → site/
        run: |
          rm -rf site
          cp -r Frontend/dist site

      - name: Deploy to Cloudflare Worker (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env prod
