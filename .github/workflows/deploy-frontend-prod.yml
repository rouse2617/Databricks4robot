name: deploy-frontend-prod

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy frontend to Cloudflare Worker (prod)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: Frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION }}
          VITE_BUILD_REF: main#${{ steps.version.outputs.VERSION }}
        run: npm run build

      - name: Sync dist → site/
        run: |
          rm -rf site
          cp -r Frontend/dist site

      - name: Deploy to Cloudflare Worker (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env prod
