server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Enable transfer compression for text assets to improve first-load latency.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Server-side video preview (fMP4) lives on the separate mcap-preview service.
    # Must come before the generic /api/ block so it wins the longest-prefix match.
    # Keep in sync with deploy/cloudrun/frontend-nginx.conf.
    location /api/v1/preview/ {
        proxy_pass https://mcap-preview-dev-wtttm6suaq-uc.a.run.app;
        proxy_set_header Host mcap-preview-dev-wtttm6suaq-uc.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        # <video> cannot set custom headers; forward session cookie as header for mcap-preview.
        proxy_set_header X-Grace-Token $cookie_grace_session;
        proxy_ssl_server_name on;
        proxy_ssl_name mcap-preview-dev-wtttm6suaq-uc.a.run.app;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass https://cyber-databrew-backend-dev-wtttm6suaq-uc.a.run.app;
        proxy_set_header Host cyber-databrew-backend-dev-wtttm6suaq-uc.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name cyber-databrew-backend-dev-wtttm6suaq-uc.a.run.app;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Fingerprinted bundles can be cached aggressively.
    location ~* ^/assets/.+\.(js|css|mjs|map|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        # Vite emits hashed bundles under /assets/*.js; /assets/:id is also a React route.
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
