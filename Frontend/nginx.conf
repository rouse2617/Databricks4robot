server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
        # Vite emits hashed bundles under /assets/*.js; /assets/:id is also a React route.
        # Serve real files when present; otherwise fall back to SPA shell.
        try_files $uri /index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
