repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.104.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint

  # 1. High-entropy string detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(package-lock\.json|site/)

  # 2. Scanning for specific cloud provider signatures
  # Local gitleaks gate so secrets never reach `git commit`. We invoke the
  # gitleaks binary directly because the upstream pre-commit hook manifest is
  # broken for current gitleaks versions. Requires gitleaks on PATH
  # (`brew install gitleaks`).
  #
  # We run `gitleaks detect --source . --no-git` instead of `gitleaks protect`
  # because:
  #  - gitleaks's default ruleset catches vendor fingerprints (AWS, GCP, GitHub
  #    tokens, etc.) but does NOT catch truly random passwords — those are
  #    detect-secrets's job above.
  #  - `gitleaks protect --staged` reads from a different config precedence and
  #    ignores --config. We need --config .gitleaks.toml so the project allowlist
  #    is honoured (it excludes .secrets.baseline).
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        description: Scan working tree for known-vendor secrets via gitleaks
        entry: gitleaks detect --no-git --source . --redact --config .gitleaks.toml --exit-code 1
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

  # 3. Standard Git "Sanity" Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(databrew-pipeline/|site/|backend/migrations/055_pipeline_configs\.sql$)
      - id: trailing-whitespace
        exclude: ^(databrew-pipeline/|site/)
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: ^databrew-pipeline/
      - id: check-json
        exclude: ^databrew-pipeline/
