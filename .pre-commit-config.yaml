repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.104.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint

  # 1. High-entropy string detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # services/grace-sync/ contains variable names like GRACE_API_SECRET,
        # SECRET_ENVS, etc. that the "Secret Keyword" plugin flags as false
        # positives. The file is a deploy script — actual secrets live in
        # GCP Secret Manager and are mounted via --set-secrets. The baseline
        # was generated before that directory existed, so excluding it is
        # the cleanest fix.
        exclude: ^(package-lock\.json|site/|services/grace-sync/)

  # 2. Vendor-specific secret fingerprinting (AWS, GCP, GitHub tokens, etc.)
  # is owned by .github/workflows/gitleaks.yml, not by a pre-commit hook.
  # Reason: gitleaks is a Go binary and pre-commit's pip-managed venv can't
  # provide it, so a local pre-commit hook here would always fail in CI with
  # "Executable `gitleaks` not found". The GHA workflow uses
  # gitleaks/gitleaks-action@v1 with config-path: .gitleaks.toml.

  # 3. Standard Git "Sanity" Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(databrew-pipeline/|site/|backend/migrations/055_pipeline_configs\.sql$)
      - id: trailing-whitespace
        exclude: ^(databrew-pipeline/|site/)
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: ^databrew-pipeline/
      - id: check-json
        exclude: ^databrew-pipeline/

  # 4. Atlas migrations lint (local).
  # Mirrors CI's db-migrate-lint.yml — replay every backend/migrations/*.sql
  # on a fresh PG17 and verify atlas.sum. Catches: stale checksum after
  # hand-editing a SQL file, broken DDL, missing extension declaration.
  - repo: local
    hooks:
      - id: check-migration-validate
        name: atlas migrate validate (fresh PG17 replay + atlas.sum)
        language: system
        entry: ./scripts/check_migration_validate.sh
        pass_filenames: false
        files: ^backend/migrations/(.*\.sql|atlas\.sum)$
        require_serial: false

  # 5. Block any schema change that doesn't land as a new migration file.
  # Companion to #4: this one enforces the routing (only via migrations/),
  # #4 verifies the SQL itself. Editing an already-applied migration, or
  # sneaking runnable DDL into scripts/shell, both fail the commit.
  - repo: local
    hooks:
      - id: no-manual-schema-change
        name: schema changes only via backend/migrations/*
        language: system
        entry: ./scripts/check_no_manual_schema_change.sh
        pass_filenames: false
