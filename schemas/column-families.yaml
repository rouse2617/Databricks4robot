# ====================================================================
# data4cyber - Bigtable Column Families 定义(Phase 1+)
# 
# - Phase 0 用 Postgres JSONB 模拟,见 pg-phase0.sql
# - Phase 1 用 gcloud / Terraform 按此文件创建 CF
# ====================================================================

version: 1
instance: grace-asset-metadata
table: assets

# --------------------------------------------------------------------
# Row Key 规范
# --------------------------------------------------------------------
row_key:
  format_phase0: "v0#<tenant_id>#<project_id>#<asset_uuid>"
  format_phase1: "v1#<salt2>#<tenant_id>#<reverse_ts_ms_19>#<project_id>#<asset_uuid>"
  description: |
    设计目标:row key 含稳定业务属性(tenant/project),并保持写入打散。
    Phase 0 数据量小,不加 salt,先用 v0 key 起步。
    Phase 1 起用 2 位 hash salt(建议 00-31,后续可扩 00-63)打散写入热点。
    reverse_ts_ms_19 = (2^63 - 1) - created_at_ms,固定 19 位,让最新数据靠前。
    tenant_id / project_id 必须是稳定 ID,不要使用可改名展示字段。

  related_tables:
    asset_locator:
      row_key: "<asset_uuid>"
      columns: [main_row_key, key_ver, tenant_id, project_id, created_at_ms, status]
      purpose: "asset_id 点查入口,先定位主表 row key 再回源读取"
    assets_by_project:
      row_key: "v1#<salt2>#<tenant_id>#<project_id>#<reverse_ts_ms_19>#<asset_uuid>"
      columns: [main_row_key, created_at_ms]
      purpose: "按 project 扫最近 N 条时降低主表扇出"

# --------------------------------------------------------------------
# Column Families
# --------------------------------------------------------------------
column_families:

  - name: core
    description: 核心不变属性
    gc_rule: { max_versions: 3 }
    typical_columns:
      - type              # asset 类型(video_segment / ...)
      - tenant
      - project
      - urn
      - status            # active | archived | deleted
      - created_at
      - created_by
      - updated_at
      - schema_ver

  - name: time
    description: 时间区间(segment 语义)
    gc_rule: { max_versions: 3 }
    typical_columns:
      - start_ns
      - end_ns
      - duration_ns
      - mcap_uri
      - mcap_size
      - mcap_sha256

  - name: tag
    description: 业务标签,稀疏宽列(每个 tag 一列)
    gc_rule: { max_versions: 5 }
    naming: "<Classification>.<tag>  或  user.<team_or_user>.<custom>"
    value_hint: "0/1 或 浮点(如 Quality.blur=0.23)或 字符串(如 Quality.exposure=good)"

  - name: file
    description: 派生产物文件列表
    gc_rule: { max_versions: 3 }
    naming: "<file_kind>.<attr>"
    examples:
      - "sam2_v3.uri"
      - "sam2_v3.version"
      - "sam2_v3.producer"
      - "sam2_v3.created_at"
      - "sam2_v3.size"
      - "sam2_v3.sha256"

  - name: qa
    description: QA 工作流
    gc_rule: { max_versions: 10 }      # 保留状态历史
    typical_columns:
      - state           # pending|in_review|approved|rejected|disputed|archived
      - prev_state
      - qa_by
      - qa_at
      - qa_notes
      - approved_ver    # 乐观锁
      - disputes

  - name: event
    description: 事件流,依赖多版本
    gc_rule:
      max_age: "90d"    # 保留 90 天
      max_versions: 1000
    naming: "<event_type>"    # 例如 "created" / "qa_approved" / "tag_added"
    value_hint: "JSON payload"
    note: |
      每列代表一类事件;每个 cell version = 一次发生。
      查询:scan cf:event 按 timestamp 倒序。

  - name: lineage
    description: 血缘关系
    gc_rule: { max_versions: 3 }
    naming: "up:<kind>  或  down:<kind>"
    examples:
      - "up:mcap"              # 指向源 MCAP URN
      - "up:parent_asset"      # 指向父 asset
      - "up:ingestion_run"
      - "down:dataset_xxx"
      - "down:derived_asset_1"
      - "down:export_xxx"

  - name: algo
    description: 各算法运行状态
    gc_rule: { max_versions: 5 }
    naming: "<algo_name>.<attr>"
    examples:
      - "sam2_v3.status"        # pending|running|done|failed|skipped
      - "sam2_v3.run_id"
      - "sam2_v3.started_at"
      - "sam2_v3.completed_at"
      - "sam2_v3.duration_ms"
      - "sam2_v3.error"
      - "sam2_v3.output_file"

  - name: emb
    description: Embedding 指针(向量本身存 Vertex AI Vector Search)
    gc_rule: { max_versions: 3 }
    naming: "<model_name>.<attr>"
    examples:
      - "clip_vit_l.vector_id"
      - "clip_vit_l.model"
      - "clip_vit_l.dim"
      - "clip_vit_l.created_at"

# --------------------------------------------------------------------
# Terraform / gcloud 创建示例
# --------------------------------------------------------------------
# gcloud bigtable instances tables create assets \
#   --instance=grace-asset-metadata \
#   --column-families=core,time,tag,file,qa,event,lineage,algo,emb
#
# gcloud bigtable column-families update core --instance=grace-asset-metadata \
#   --table=assets --gc-rule-max-versions=3
#
# (每个 CF 的 gc_rule 按上面配)

# --------------------------------------------------------------------
# 查询 / 写入范式
# --------------------------------------------------------------------
access_patterns:
  - name: read_asset_full
    description: 读一个 asset 所有列族
    bigtable_op: "Row read by exact row_key, all CFs"

  - name: read_asset_light
    description: UI 列表只读 core + tag + qa
    bigtable_op: "Row read, CF filter: [core, tag, qa]"

  - name: update_qa_atomic
    description: 原子状态机推进
    bigtable_op: "CheckAndMutate: cf:qa.state==in_review THEN set cf:qa.state=approved + append cf:event"

  - name: list_recent_events
    description: 活动流
    bigtable_op: "Row read, CF=event, version limit=50, order=desc"

  - name: bulk_get_by_ids
    description: 搜索结果回源
    bigtable_op: "Resolve row_keys via asset_locator, then ReadRows(<=1000 keys/RPC)"

  - name: list_recent_by_tenant
    description: 某 tenant 最近资产
    bigtable_op: "Parallel prefix scan on v1#<00..31>#<tenant_id># , then top-k merge"

  - name: list_recent_by_project
    description: 某 project 最近资产
    bigtable_op: "Parallel prefix scan on assets_by_project with 32 salts, then回源主表"
