# Cyber Databrew — backend image (see backend/Dockerfile, build context = repo root with Dockerfile in backend/).
# PR → BuildKit → AR cyber-databrew-backend; tags :<sha>, :pr-<N>-<sha>
#
# Image registry (green-valley / rick-cyber-databrew-images).
# If you fork CI to another project, search-replace project + repo id below.
#
# Requires cluster Tasks `git-clone` (Hub), `buildkit`, `retag-image` in `tekton-pipelines`,
# PAC bound to this repo, and `tekton-builder` (or your org’s equivalent) with AR push access.
# yaml-language-server: $schema=https://raw.githubusercontent.com/redhat-developer/vscode-tekton/refs/heads/main/scheme/tekton.dev/v1beta1_PipelineRun.json
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: build-backend-{{revision}}
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-path-change: "[backend/**, .tekton/build-backend.yaml]"
    pipelinesascode.tekton.dev/target-namespace: "tekton-pipelines"
    pipelinesascode.tekton.dev/task: "git-clone"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  serviceAccountName: tekton-builder
  podTemplate:
    securityContext:
      fsGroup: 65532
  taskRunSpecs:
    - pipelineTaskName: build-and-push
      taskPodTemplate:
        nodeSelector:
          build-pool-tier: warm
        tolerations:
          - key: build-pool-tier
            operator: Equal
            value: warm
            effect: NoSchedule
      stepOverrides:
        - name: build-and-push
          resources:
            requests:
              cpu: "2"
              memory: "6Gi"
      sidecarOverrides:
        - name: buildkitd
          resources:
            requests:
              ephemeral-storage: "10Gi"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    - name: pac-gitauth
      secret:
        secretName: "{{git_auth_secret}}"
  pipelineSpec:
    workspaces:
      - name: shared-workspace
      - name: pac-gitauth
    tasks:
      - name: fetch-repository
        taskRef:
          name: git-clone
        workspaces:
          - name: output
            workspace: shared-workspace
          - name: basic-auth
            workspace: pac-gitauth
        params:
          - name: url
            value: "{{repo_url}}"
          - name: revision
            value: "{{revision}}"

      - name: build-and-push
        retries: 1
        runAfter:
          - fetch-repository
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: buildkit
            - name: namespace
              value: tekton-pipelines
        workspaces:
          - name: source
            workspace: shared-workspace
        params:
          - name: IMAGE
            value: us-central1-docker.pkg.dev/green-valley-442103/rick-cyber-databrew-images/cyber-databrew-backend:{{revision}}
          - name: DOCKERFILE
            value: backend/Dockerfile
          - name: CONTEXT
            value: backend
          - name: CACHE_IMAGE
            value: us-central1-docker.pkg.dev/green-valley-442103/rick-cyber-databrew-images/cyber-databrew-backend:buildcache

      - name: tag-pr
        runAfter:
          - build-and-push
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: retag-image
            - name: namespace
              value: tekton-pipelines
        params:
          - name: SOURCE_IMAGE
            value: us-central1-docker.pkg.dev/green-valley-442103/rick-cyber-databrew-images/cyber-databrew-backend:{{revision}}
          - name: TARGET_IMAGES
            value: us-central1-docker.pkg.dev/green-valley-442103/rick-cyber-databrew-images/cyber-databrew-backend:pr-{{pull_request_number}}-{{revision}}
