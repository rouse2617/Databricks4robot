[project]
name = "asset-sdk"
dynamic = ["version"]
description = "Python SDK for the cyber-databrew platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.11.0",
    "mcap>=1.1.1",
    "python-dateutil>=2.9.0",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."
tag_regex = "^sdk/v(?P<version>.*)$"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/asset_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_sdk"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.28.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",         # httpx mock
    "ruff>=0.11",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "BLE", "PERF", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["asset_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running backend (docker compose)",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
