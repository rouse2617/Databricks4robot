[project]
name = "data-platform-dagster"
version = "0.0.1"
description = "Dagster pipeline jobs for data4cyber"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dagster-gcp>=0.24",
    "grace-sdk",
    "mcap>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "dagster-pytest>=0.1",
    "ruff>=0.11",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
